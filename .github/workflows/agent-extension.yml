name: redrob extension channel

# Build the agent extension, sign it with Redrob's key and publish its update channel to
# https://cdn.redrob.ai/browser/extensions/. The browser bundles the same CRX for first run
# (tools/agent-extension); this channel is how installed browsers update.

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - agent/apps/app/**
      - agent/scripts/redrob-extension/**
      - .github/workflows/agent-extension.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # The organisation's CDN convention, same names as every product (see redrob-browser's
      # .github/scripts/cdn-publish.sh).
      REDROB_CDN_BUCKET: ${{ vars.REDROB_CDN_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.REDROB_CDN_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.REDROB_CDN_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      CDN_PUBLIC_HOST: cdn.redrob.ai
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: build and sign
        env:
          REDROB_AGENT_EXTENSION_KEY: ${{ secrets.REDROB_AGENT_EXTENSION_KEY }}
          # The vite build of app + sidepanel outgrows node's default heap on a 16 GB runner.
          NODE_OPTIONS: --max-old-space-size=8192
        run: bash scripts/redrob-extension/build.sh

      - name: publish to cdn.redrob.ai
        run: bash scripts/redrob-extension/cdn-publish-extensions.sh out/redrob-extension/extensions
