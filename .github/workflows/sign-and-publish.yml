# Sign artefacts built somewhere else, then publish them.
#
# This exists because a hosted runner cannot check out Chromium and does not need to. Both platform build
# workflows died in `sync` -- macOS with 37 GiB free, Windows with 67 GiB -- because Chromium's full git
# history is 64.75 GiB of pack data before a single file is checked out. Signing an artefact needs none of
# that: it downloads a 113 MB .deb or a few hundred MB of .app and runs one tool. The runners are ample for
# that, so the machine that BUILDS and the machine that SIGNS are deliberately different machines.
#
# The artefact travels on a DRAFT GitHub Release. That choice buys two things. Nothing new has to exist on
# the building machine -- no AWS credentials, no signing certificate, only `gh` -- and no user ever sees an
# unsigned asset, because the draft is published only after every signature verifies.
#
#   local:  redrob.py build && redrob.py package
#           gh release create v0.1.4 --draft --title ... <artefacts>
#   here:   workflow_dispatch with tag=v0.1.4
#             probe         read the draft: which platforms are on it, which commit it points at
#             sign-macos    codesign -> notarytool -> stapler -> three checks; .dmg for Redrob Launcher
#             sign-windows  azure/login (OIDC) -> redrob-labs/.github/actions/sign-windows
#             collect       the .deb and the Windows portable zip, published as built
#             cdn           cdn.redrob.ai: installers, Sparkle appcasts, the apt repository
#             publish       redrob-labs/.github release-publish: SHA256SUMS.txt, redrob-launcher.json,
#                           the draft's assets replaced with the signed set, published as latest
#
# Signing and publishing are the organisation's one copy of each (redrob-labs/.github): the Windows recipe
# is `actions/sign-windows`, the release step is `release-publish.yml`. What stays here is what is this
# repository's alone -- the Chromium mac signing driver, the Sparkle feeds, the apt repository, the CDN.
#
# WHAT A SIGNATURE HERE MEANS. It attests that the holder of the certificate approved these bytes. It does
# NOT attest that the bytes came from this source tree, because the build happened on a machine this workflow
# never saw. That is normal for sign-after-build and is written down here rather than assumed.
name: sign-and-publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag carrying the unsigned artefacts (e.g. v0.1.4)"
        required: true
      dry_run:
        description: "Sign only: verify the signatures and keep the signed files as workflow artifacts; touch neither the release nor the CDN"
        required: false
        default: false
        type: boolean
      replace_published:
        description: "Overwrite this version's CDN files when they differ (needs CloudFront invalidation rights)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------------------------------
  probe:
    name: what is on this release
    # On ubuntu, on purpose. Deciding whether a mac artefact exists must not itself start a macOS runner:
    # those bill at ten times the Linux rate, and a Linux-only release would otherwise pay for a mac and a
    # Windows machine to boot, look at a list of filenames and exit. The signing jobs are gated on this.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      target: ${{ steps.assets.outputs.target }}
      mac: ${{ steps.assets.outputs.mac }}
      win: ${{ steps.assets.outputs.win }}
      deb: ${{ steps.assets.outputs.deb }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: the tag and the version have to agree
        # A tag that does not match REDROB_VERSION means the artefacts on it were built from a different tree
        # than this checkout, and every path below -- the CDN filename, the latest/ alias, the release title
        # -- would be named after the wrong one.
        id: version
        run: |
          set -euo pipefail
          version="$(cat REDROB_VERSION)"
          if [ "${{ inputs.tag }}" != "v$version" ]; then
            echo "::error::tag ${{ inputs.tag }} does not match REDROB_VERSION $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: assets
        run: |
          set -euo pipefail
          gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" --json assets,targetCommitish,isDraft > release.json
          names="$(jq -r '.assets[].name' release.json)"
          echo "assets on ${{ inputs.tag }}:"
          printf '  %s\n' $names
          has() { printf '%s\n' $names | grep -qE "$1" && echo true || echo false; }
          # The commit the draft was created against is the commit the tag will point at when the release
          # is published; release-publish takes it as `target` so publishing from any ref keeps that.
          target="$(jq -r '.targetCommitish' release.json)"
          test -n "$target" || { echo "::error::the release has no target commit"; exit 1; }
          echo "target: $target  draft: $(jq -r .isDraft release.json)"
          {
            echo "target=$target"
            echo "mac=$(has '\.app\.zip$')"
            echo "win=$(has 'setup\.exe$')"
            echo "deb=$(has '\.deb$')"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------------------------------
  collect:
    name: collect the artefacts published as built
    needs: probe
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: the Linux package and the Windows portable zip
        # Nothing to sign in either. A .deb is not itself signed in this ecosystem -- what gets signed is
        # the apt repository's Release file, which the cdn job produces with scripts/build_repo.py, gated on
        # a signing key. The Windows portable zip is the unpacked application re-containered by `redrob.py
        # package` on the build host for Redrob Launcher, which installs no -setup.exe; it rides the draft
        # beside the installer. Both are collected here so the publish job sees every asset as a `release-*`
        # artifact and the draft's own upload can be replaced wholesale. Both already carry the release's
        # one name shape, redrob-browser-<version>-<os>-<arch>.<ext> (redrob-launcher crates/core/src/
        # platform.rs): `redrob.py package` writes the .deb to the release as -linux-x86_64.deb and keeps
        # the Debian name in out/deb for the apt pool, so nothing is renamed here.
        run: |
          set -euo pipefail
          mkdir -p staging
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" -p '*.deb' -D staging || \
            echo "::notice::no .deb on this release"
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" -p '*-portable.zip' -D staging || \
            echo "::notice::no Windows portable zip on this release"
          ls -l staging || true

      - name: the Linux tarball, repacked from the .deb
        # Redrob Launcher installs a .deb only through apt, so on Fedora / Redrob OS the .deb alone is not
        # installable. The launcher's per-user path there is the tarball (install_tree): unpacked into
        # ~/.local/share/redrob-launcher/apps, no root. Same files as the .deb, no second build.
        run: |
          set -euo pipefail
          for deb in staging/redrob-browser-*-linux-*.deb; do
            [ -e "$deb" ] || { echo "::notice::no .deb, so no Linux tarball"; break; }
            python3 scripts/deb_to_tarball.py "$deb"
          done
          ls -l staging || true

      - uses: actions/upload-artifact@v4
        with:
          name: release-as-built
          path: staging
          # A release with neither is possible (mac and Windows only); the publish job then has the signed
          # artifacts alone, and fails on its own if there is nothing at all.
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------------
  sign-macos:
    name: sign and notarize the macOS app
    needs: probe
    if: needs.probe.outputs.mac == 'true'
    runs-on: macos-15
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: require the Apple signing and notarization secrets
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_NOTARY_API_KEY_P8_BASE64 \
            APPLE_API_KEY \
            APPLE_API_ISSUER; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing macOS signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | openssl base64 -d -A > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: download and unpack the app
        run: |
          set -euo pipefail
          mkdir -p incoming unpacked
          gh release download "${{ inputs.tag }}" -p '*.app.zip' -D incoming
          zip="$(find incoming -name '*.app.zip' | head -1)"
          # ditto, not unzip. The archive MUST have been made with `ditto -c -k --keepParent` on the building
          # mac and must be expanded with ditto here: a plain zip does not preserve the framework's symlinks,
          # and codesign then rejects the reassembled bundle with a message about the seal rather than about
          # the links, which is the single most common way this pattern fails.
          ditto -x -k "$zip" unpacked
          app="$(find unpacked -maxdepth 2 -type d -name '*.app' | head -1)"
          test -n "$app" || { echo "::error::no .app inside $zip"; ls -R unpacked | head -40; exit 1; }
          echo "APP_PATH=$app" >> "$GITHUB_ENV"
          echo "app: $app"

      - name: stamp the version Sparkle compares
        # Sparkle offers an update when the appcast's sparkle:version is newer than the installed app's
        # CFBundleVersion. Chromium stamps BUILD.PATCH there (8059.26), which is identical for every Redrob
        # release cut from one Chromium, so no release on the same Chromium would ever be offered. Ours leads
        # with REDROB_VERSION and keeps Chromium's build after it, so it rises with each release and stays
        # unique across Chromium uprevs. Done before signing: the plist is sealed by the signature.
        # scripts/sparkle_appcast.py reads these values back out of the signed archive.
        run: |
          set -euo pipefail
          version="$(cat REDROB_VERSION)"
          chromium="$(cat CHROMIUM_VERSION)"
          build="${chromium#*.*.}"
          plist="$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $version.$build" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist"

      - name: import the signing certificate into a throwaway keychain
        # set-key-partition-list is the step people leave out. Without it codesign prompts for keychain
        # access, and on a runner with no UI a prompt is a hang rather than an error.
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/redrob-signing.keychain-db"
          password="$(openssl rand -base64 24)"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          p12="$RUNNER_TEMP/cert.p12"
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A > "$p12"
          security import "$p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -nE 's/.*"(Developer ID Application: .*)"/\1/p' | head -1)"
          if [ -z "$identity" ]; then
            echo "::error::no Developer ID Application identity in the imported certificate"
            security find-identity -v -p codesigning "$keychain" || true
            exit 1
          fi
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "identity: $identity"

      - name: sign the vendored binaries the Chromium driver does not know about
        # sign_chrome.py signs Chromium's own parts and nothing else. Two vendored components ride inside
        # the bundle and Apple's notary service rejects the whole submission when any Mach-O in it is
        # unsigned or lacks the hardened runtime ("The binary is not signed with a valid Developer ID
        # certificate" x11, run 37783643127): the Sparkle updater framework (Autoupdate, Updater.app, the
        # Downloader and Installer XPC services, the framework itself) and the bundled Bun server. They are
        # signed here first, inside-out, so the driver's outer seals then cover valid nested signatures.
        # Options and entitlements mirror BrowserOS's own sign step (vendor/browseros/bos_build/steps/sign/
        # macos.py and products/browseros/product.py): `runtime` everywhere, and the Bun executable gets the
        # JIT/unsigned-memory entitlements a Bun binary needs to start under the hardened runtime.
        run: |
          set -euo pipefail
          sign() { codesign --sign "$SIGNING_IDENTITY" --force --timestamp --keychain "$SIGNING_KEYCHAIN" "$@"; }
          fw="$(find "$APP_PATH/Contents/Frameworks" -type d -name 'Sparkle.framework' | head -1)"
          if [ -n "$fw" ]; then
            b="$fw/Versions/B"
            for xpc in "$b"/XPCServices/*.xpc; do sign --options runtime "$xpc"; done
            [ -d "$b/Updater.app" ] && sign --options runtime "$b/Updater.app"
            [ -f "$b/Autoupdate" ] && sign --options runtime "$b/Autoupdate"
            sign --options runtime "$b"
            codesign --verify --verbose=2 "$b"
          else
            echo "no Sparkle.framework in the bundle; nothing to pre-sign there"
          fi
          ents="vendor/browseros/resources/entitlements/browseros-executable-entitlements.plist"
          test -f "$ents" || { echo "::error::$ents is missing"; exit 1; }
          server="$APP_PATH/Contents/Resources/BrowserOSServer/default/resources/bin/redrob-agent-server"
          if [ -f "$server" ]; then
            sign --options runtime --identifier ai.redrob.Browser.redrob-agent-server --entitlements "$ents" "$server"
            codesign --verify --verbose=2 "$server"
          else
            echo "no redrob-agent-server in the bundle"
          fi
          # Anything else Apple would scan: list every Mach-O that still carries no Developer ID signature,
          # so the next rejection names its file here instead of in a notary log.
          find "$APP_PATH" -type f -perm +111 | while read -r f; do
            file -b "$f" | grep -q '^Mach-O' || continue
            codesign -dv "$f" 2>&1 | grep -q 'Authority=Developer ID Application' || echo "still unsigned (driver will sign Chromium parts): ${f#"$APP_PATH"/}"
          done

      - name: sign with upstream's own driver
        # sign_chrome.py, not a hand-rolled codesign: Chromium's bundle is signed inside-out -- helpers, then
        # the framework's versioned directory, then the app -- with per-part entitlements, and getting that
        # order wrong produces a bundle codesign accepts and Gatekeeper rejects.
        #
        # It needs the signing module, which the BUILD produces, not the source tree: `signing/build_props_config.py`
        # is generated by GN from the branding and version (product name, bundle id, version), and the driver
        # refuses to start without it. A sparse checkout of the Chromium tag was tried first and failed exactly
        # there -- the tree holds only `build_props_config.py.in`. So the building host uploads its
        # `<product> Packaging/` directory (target `chrome/installer/mac`) as `*-packaging.zip` next to the
        # `.app.zip`, and this step uses that. Same Chromium, same branding, same GN args as the app it signs.
        #
        # `--notarize none`, and the next step notarizes. With `--disable-packaging` AND notarization the driver
        # keeps the stapled app in its temporary work directory and writes NOTHING to --output (pipeline.py:
        # dest_dir is the work dir whenever it notarizes, and only packaging copies out of it). Run 37784910398
        # notarized and stapled successfully and then had no .app to publish. Signing-only drops the bundle
        # straight into --output.
        run: |
          set -euo pipefail
          mkdir -p packaging signed
          gh release download "${{ inputs.tag }}" -p '*-packaging.zip' -D packaging
          pkgzip="$(find packaging -name '*-packaging.zip' | head -1)"
          test -n "$pkgzip" || { echo "::error::no *-packaging.zip on ${{ inputs.tag }}: upload the build's '<product> Packaging' directory (ninja target chrome/installer/mac) zipped as <name>-packaging.zip"; exit 1; }
          # The driver looks for `<input>/<product> Packaging/` (entitlements, helper plists) -- model.py's
          # packaging_dir -- so the zip is expanded BESIDE the app, into the same directory `--input` names.
          ditto -x -k "$pkgzip" "$(dirname "$APP_PATH")"
          driver="$(find "$(dirname "$APP_PATH")" -maxdepth 2 -name sign_chrome.py | head -1)"
          test -n "$driver" || { echo "::error::no sign_chrome.py inside $pkgzip"; ls -R "$(dirname "$APP_PATH")" | head -40; exit 1; }
          test -f "$(dirname "$driver")/signing/build_props_config.py" || { echo "::error::packaging zip lacks signing/build_props_config.py -- it was not produced by the build"; exit 1; }
          python3 "$driver" \
            --input "$(dirname "$APP_PATH")" \
            --output signed \
            --identity "$SIGNING_IDENTITY" \
            --disable-packaging \
            --notarize none
          app="$(find signed -maxdepth 3 -type d -name '*.app' | head -1)"
          test -n "$app" || { echo "::error::the signing driver produced no .app"; ls -R signed | head -40; exit 1; }
          echo "SIGNED_APP=$app" >> "$GITHUB_ENV"

      - name: notarize and staple
        # The whole bundle goes to Apple as one archive, made with ditto so the framework symlinks survive.
        # `--wait` blocks until Apple answers; a rejection prints the full log (every offending path) here, so
        # the next fix does not start from "Invalid" alone.
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "$SIGNED_APP" notarize.zip
          set +e
          xcrun notarytool submit notarize.zip \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 90m --output-format json > notarize.json
          rc=$?
          set -e
          cat notarize.json
          id="$(python3 -c 'import json,sys; print(json.load(open("notarize.json")).get("id",""))')"
          status="$(python3 -c 'import json,sys; print(json.load(open("notarize.json")).get("status",""))')"
          if [ "$rc" -ne 0 ] || [ "$status" != "Accepted" ]; then
            echo "::error::notarization ended with status '$status' (rc=$rc)"
            [ -n "$id" ] && xcrun notarytool log "$id" \
              --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" || true
            exit 1
          fi
          xcrun stapler staple "$SIGNED_APP"

      - name: verify the signature, the ticket and Gatekeeper
        # Three checks, not one. codesign says it is signed; stapler says the notarization ticket is actually
        # attached; spctl says this machine would run it. A signing step that silently no-ops passes the
        # first and fails the third, which is the failure worth catching before a user meets it.
        run: |
          set -euo pipefail
          app="$(find signed -maxdepth 3 -type d -name '*.app' | head -1)"
          test -n "$app" || { echo "::error::the signing driver produced no .app"; ls -R signed | head -40; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          mkdir -p staging
          # ditto again on the way out, for the same reason as on the way in. Named the way every asset on
          # the release is, redrob-browser-<version>-macos-<arch>.zip; the cdn job copies it under the CDN's
          # own spelling (redrob-browser-macos-<arch>-<version>.zip) for cdn-publish.sh and the appcast.
          archs="$(lipo -archs "$app/Contents/MacOS/$(basename "$app" .app)")"
          case "$archs" in
            arm64) arch=arm64 ;;
            x86_64) arch=x86_64 ;;
            *) arch=universal ;;
          esac
          ditto -c -k --keepParent "$app" "staging/redrob-browser-$(cat REDROB_VERSION)-macos-${arch}.zip"

      - name: the name Redrob Launcher installs from -- a .dmg
        # Redrob Launcher installs an asset only when its name reads <stem>-<version>-<os>-<arch>.<ext>, and on
        # macOS the only <ext> it opens is .dmg (redrob-launcher crates/core/src/platform.rs: it mounts the image
        # and copies `Redrob Browser.app` into /Applications). The Sparkle zip above is not one it opens, so the
        # stapled app is also written into a disk image here, on the one machine in this pipeline that has
        # hdiutil. Same stem as the zip: redrob-browser-<version>-macos-<arch>. The image is codesigned so
        # Gatekeeper attributes it; the app inside carries its own notarization ticket.
        run: |
          set -euo pipefail
          app="$(find signed -maxdepth 3 -type d -name '*.app' | head -1)"
          version="$(cat REDROB_VERSION)"
          archs="$(lipo -archs "$app/Contents/MacOS/$(basename "$app" .app)")"
          case "$archs" in
            arm64) arch=arm64 ;;
            x86_64) arch=x86_64 ;;
            *) arch=universal ;;
          esac
          mkdir -p launcher dmgroot
          ditto "$app" "dmgroot/$(basename "$app")"
          ln -s /Applications dmgroot/Applications
          dmg="launcher/redrob-browser-${version}-macos-${arch}.dmg"
          hdiutil create -volname "Redrob Browser" -srcfolder dmgroot -ov -format UDZO -fs HFS+ "$dmg"
          codesign --sign "$SIGNING_IDENTITY" --force --timestamp --keychain "$SIGNING_KEYCHAIN" "$dmg"
          codesign --verify --verbose=2 "$dmg"
          # The image must hold the stapled app, by the same checks the previous step made on the loose one.
          mount="$(hdiutil attach -nobrowse -readonly -noverify "$dmg" | awk -F'\t' '/\/Volumes\//{print $NF}')"
          test -n "$mount" || { echo "::error::$dmg did not mount"; exit 1; }
          mounted="$(find "$mount" -maxdepth 1 -type d -name '*.app' | head -1)"
          codesign --verify --deep --strict "$mounted"
          xcrun stapler validate "$mounted"
          hdiutil detach "$mount"
          ls -l launcher
          python3 scripts/check_asset_names.py --names launcher/*.dmg --version "$version" --no-platforms

      - name: clean up the keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12" || true

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: staging/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        # Separate from release-macos on purpose: the cdn job copies the Sparkle zip to the CDN, and the .dmg
        # belongs on the GitHub release only -- the CDN's download page and the appcast have their own names.
        with:
          name: release-macos-launcher
          path: launcher/*
          if-no-files-found: error


  # ---------------------------------------------------------------------------------------------------
  sign-windows:
    name: sign the Windows installer
    needs: probe
    if: needs.probe.outputs.win == 'true'
    runs-on: windows-2022
    # `release` is the environment the organization's federated credential names
    # (repo:redrob-labs@<org id>/<repo>@<id>:environment:release); any other name is refused.
    environment: release
    permissions:
      # Write, not read: the asset lives on a DRAFT release, and a read-only token cannot see a
      # draft at all (`gh release download` answers "release not found"). The job still only
      # downloads; the publish job is the one that edits the release.
      contents: write
      # The OIDC token `azure/login` exchanges for the Artifact Signing credential.
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: require the Artifact Signing identifiers
        # Six names, all plain identifiers, all redrob-labs organization secrets. Do not recreate them as
        # repository secrets (a same-named repository secret would override the org one). No certificate
        # file and no client secret exist anywhere in this job: the credential is the OIDC login below.
        # The shared action would only WARN and leave the file unsigned when the three signing inputs are
        # empty -- right for a fork's dry run, wrong for a release -- so the names are required here first.
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_CERT_PROFILE: ${{ secrets.ARTIFACT_SIGNING_CERT_PROFILE }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            AZURE_CLIENT_ID \
            AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID \
            ARTIFACT_SIGNING_ENDPOINT \
            ARTIFACT_SIGNING_ACCOUNT \
            ARTIFACT_SIGNING_CERT_PROFILE; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing Windows signing configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: download the installer
        # BEFORE the Azure login, deliberately: GitHub's OIDC token lives minutes, and the login must sit
        # immediately before signing with nothing long between them. The download is the only step here
        # that can take a while, so it goes first.
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" -p '*setup.exe' -D staging
          ls -la staging
          test -n "$(find staging -name '*setup.exe' | head -1)" || { echo "::error::no setup.exe was downloaded"; exit 1; }

      # Azure Artifact Signing, authenticated with OpenID Connect: the job's GitHub token is exchanged
      # for an Azure token against the organization's app registration, whose federated credential
      # accepts `repo:redrob-labs@<org id>/*:environment:release`. No client secret exists anywhere.
      # The login comes AFTER the download and IMMEDIATELY before signing: GitHub's OIDC token lives
      # minutes, and a login done before a long step left signtool without a usable credential (it then
      # waited on a browser). No token caching, no sidecar -- just the ordering.
      - name: Log in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: sign and verify the installer
        # The organisation's one copy of the recipe (redrob-labs/.github/actions/sign-windows): signtool with
        # the Artifact Signing dlib and an ExcludeCredentials list, an RFC 3161 timestamp, then
        # `signtool verify /pa` with Status Valid and the signer's CN compared to McKinley Rice, Inc. It prints
        # `<file> signed by CN=...`, which is the line a release's log is read for.
        uses: redrob-labs/.github/actions/sign-windows@main
        with:
          files: staging/*setup.exe
          description: Redrob Browser
          url: https://github.com/redrob-labs/redrob-browser
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          account: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          cert-profile: ${{ secrets.ARTIFACT_SIGNING_CERT_PROFILE }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: staging/*.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------------
  cdn:
    name: publish to cdn.redrob.ai
    needs: [probe, collect, sign-macos, sign-windows]
    # SKIPPED is not FAILED, and the difference is the whole workflow. A Linux-only release skips both signing
    # jobs, and a plain `needs:` would then skip this one too -- publishing nothing, which is exactly the case
    # this exists to serve. So the condition admits success and skipped and refuses only a real failure:
    # an artefact that was meant to be signed and could not be must never reach the CDN. A dry run stops
    # before this job: the signed files stay as workflow artifacts and nothing public changes.
    if: ${{ !cancelled() && !inputs.dry_run && needs.collect.result == 'success' && needs.sign-macos.result != 'failure' && needs.sign-windows.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      APP_VERSION: ${{ needs.probe.outputs.version }}
      # The same names every other product in this organisation uses. preflight.yml confirms all three reach
      # this repository.
      REDROB_CDN_BUCKET: ${{ vars.REDROB_CDN_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.REDROB_CDN_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.REDROB_CDN_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      CDN_PUBLIC_HOST: cdn.redrob.ai
      CDN_PREFIX: browser
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        # Everything the release will carry, the same set release-publish merges: the signed installers and
        # the as-built Linux and portable files.
        with:
          pattern: release-*
          path: staging
          merge-multiple: true

      - name: every shipped platform has a name Redrob Launcher can install
        # Checked over the exact file set release-publish uploads, BEFORE anything is published: a platform
        # that ships without a launcher-readable name fails the release here. `redrob-launcher.json` is named
        # with them because release-publish writes it beside the assets (launcher_manifest: true); its content
        # is the one line scripts/check_asset_names.py's self-test pins.
        run: |
          set -euo pipefail
          if [ -z "$(ls -A staging 2>/dev/null)" ]; then
            echo "::error::nothing to publish -- the release carried no artefact this workflow understands"
            exit 1
          fi
          for f in staging/*; do
            printf '%s  %s bytes\n' "$(basename "$f")" "$(stat -c%s "$f")"
            sha256sum "$f" | awk '{print "  sha256 "$1}'
          done
          python3 scripts/check_asset_names.py --names staging/* redrob-launcher.json --version "$APP_VERSION"

      # The launcher icon: the 512 px app icon as one more release asset, named in redrob-launcher.json
      # (`icon`) by release-publish (launcher_icon) so Redrob Launcher's catalog shows this release's own
      # logo. Uploaded under the `release-*` prefix the publish job collects; not a CDN file. Full bleed,
      # not the macOS appiconset file, which carries Apple's 100 px margin.
      - name: stage the launcher icon
        run: |
          mkdir -p "$RUNNER_TEMP/launcher-icon"
          cp branding/icons/launcher_icon_512.png "$RUNNER_TEMP/launcher-icon/redrob-browser.png"
      - uses: actions/upload-artifact@v4
        with:
          name: release-launcher-icon
          path: ${{ runner.temp }}/launcher-icon/redrob-browser.png
          if-no-files-found: error

      - name: name the files the way the CDN has always published them
        # The GitHub release carries ONE name shape, redrob-browser-<version>-<os>-<arch><suffix>, which is what
        # Redrob Launcher reads. cdn.redrob.ai keeps the names it has served since the first releases --
        # redrob-browser-amd64-<version>.deb, redrob-browser-macos-<arch>-<version>.zip,
        # redrob-browser-x64-<version>-setup.exe -- because cdn-publish.sh aliases each to a version-free
        # `latest/` name by deleting the `-<version>` segment, and the download page and the Sparkle appcast
        # link those. Renaming the CDN files would move every `latest/` link, so the translation happens here,
        # once, from the release's spelling to the CDN's. `redrob.py package` writes the same CDN names into
        # `out/cdn` on the release.yml path; keep the two in step.
        #
        # The .dmg and the portable zip belong on the GitHub release only, which is where the launcher reads.
        run: |
          set -euo pipefail
          mkdir -p cdn
          for f in staging/redrob-browser-"$APP_VERSION"-linux-*.deb; do
            [ -f "$f" ] || continue
            token="$(basename "$f" .deb)"; token="${token##*-linux-}"
            case "$token" in
              x86_64) arch=amd64 ;;
              aarch64) arch=arm64 ;;
              *) echo "::error::no Debian architecture for launcher token linux-$token"; exit 1 ;;
            esac
            cp "$f" "cdn/redrob-browser-${arch}-${APP_VERSION}.deb"
          done
          for f in staging/redrob-browser-"$APP_VERSION"-macos-*.zip; do
            [ -f "$f" ] || continue
            arch="$(basename "$f" .zip)"; arch="${arch##*-macos-}"
            cp "$f" "cdn/redrob-browser-macos-${arch}-${APP_VERSION}.zip"
          done
          for f in staging/redrob-browser-"$APP_VERSION"-windows-*-setup.exe; do
            [ -f "$f" ] || continue
            arch="$(basename "$f" -setup.exe)"; arch="${arch##*-windows-}"
            cp "$f" "cdn/redrob-browser-${arch}-${APP_VERSION}-setup.exe"
          done
          ls -l cdn

      - name: publish to cdn.redrob.ai
        # The versioned path first, read back through CloudFront and compared, and only then the latest/
        # alias -- that ordering is the script's, copied from redrob-design, and the reason is that a link a
        # page hands out must not resolve before the bytes behind it are retrievable.
        #
        # There is no separate promote input or promote step. cdn-publish.sh aliases latest/ itself, after its
        # own read-back check, and a step here that only echoed that fact would read as a gate while being an
        # echo. If versioned-only preview publishing is wanted later, that is a change to the script -- where
        # the aliasing actually happens -- and not another flag here.
        env:
          REPLACE_PUBLISHED: ${{ inputs.replace_published }}
          CDN_DISTRIBUTION_ID: ${{ vars.REDROB_CDN_DISTRIBUTION_ID }}
        run: bash .github/scripts/cdn-publish.sh cdn

      - name: publish the Sparkle appcasts
        # After cdn-publish.sh, so a feed never points at an archive the CDN cannot serve yet. The browser
        # reads browser/appcast.xml on Apple silicon and browser/appcast-x86_64.xml on Intel
        # (chrome/browser/mac/sparkle_glue.mm); a universal build feeds both. Each enclosure points at the
        # immutable versioned key, never latest/, so an update a client already started cannot change under
        # it. Short cache: the feed is the one file that has to move at every release.
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(cdn/redrob-browser-macos-*-"$APP_VERSION".zip)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::notice::no macOS archive in this release, so the appcasts are unchanged."
            exit 0
          fi
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY is not set: a macOS release without a signed appcast never reaches installed browsers"
            exit 1
          fi
          python3 -m pip install --quiet 'cryptography==46.0.5'
          mkdir -p appcasts
          for zip in "${archives[@]}"; do
            name="$(basename "$zip")"
            arch="${name#redrob-browser-macos-}"
            arch="${arch%%-*}"
            case "$arch" in
              arm64) feeds=(appcast.xml) ;;
              x86_64) feeds=(appcast-x86_64.xml) ;;
              universal) feeds=(appcast.xml appcast-x86_64.xml) ;;
              *) echo "::error::unknown macOS archive architecture in $name"; exit 1 ;;
            esac
            url="https://${CDN_PUBLIC_HOST}/${CDN_PREFIX}/${APP_VERSION}/${name}"
            for feed in "${feeds[@]}"; do
              python3 scripts/sparkle_appcast.py --archive "$zip" --url "$url" --out "appcasts/$feed"
              aws s3 cp "appcasts/$feed" "s3://${REDROB_CDN_BUCKET}/${CDN_PREFIX}/$feed" \
                --content-type "application/xml" --cache-control "public, max-age=300" --no-progress
              # Read back through CloudFront until it serves THIS version: an edge may still hold the
              # previous feed for up to its max-age.
              served=""
              for _ in $(seq 1 15); do
                if curl --fail --silent "https://${CDN_PUBLIC_HOST}/${CDN_PREFIX}/$feed?v=${APP_VERSION}" \
                    | grep -q "<sparkle:shortVersionString>${APP_VERSION}<"; then
                  served=yes; break
                fi
                sleep 30
              done
              [ -n "$served" ] || { echo "::error::$feed is not serving $APP_VERSION after 7.5 minutes"; exit 1; }
              echo "OK https://${CDN_PUBLIC_HOST}/${CDN_PREFIX}/$feed -> $name"
            done
          done

      - name: build and publish the apt repository
        # THE STEP THAT MAKES LINUX AUTO-UPDATE EXIST. Without it a release ships a .deb, which installs
        # exactly once: `apt upgrade` has nothing to talk to, so every user stays on whatever version they
        # downloaded. The package configures apt for itself on install (see apt.include), and this is the
        # other end of that -- the repository it points at.
        #
        # Gated on the signing key, and it SAYS SO rather than skipping quietly. An unsigned apt repository
        # is worse than none: it means every future update on every machine is whatever the network hands
        # the user, which is a remote code execution channel wearing a package manager's clothes. So the
        # absence of the key turns this off and writes a notice a human reads in the run summary, instead
        # of publishing something that looks like a working update channel.
        #
        # `continue-on-error` is deliberately NOT set. If the key exists, a repository that fails to build
        # or fails to upload must fail the release: the alternative is a published version that some
        # machines can see and others cannot, with the signature the difference.
        env:
          REDROB_SIGNING_KEY: ${{ secrets.REDROB_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${REDROB_SIGNING_KEY:-}" ]; then
            echo "::notice::REDROB_SIGNING_KEY is not set, so no apt repository was built or published."
            echo "::notice::The .deb on this release installs, but apt has nothing to upgrade from -- Linux auto-update stays off."
            echo "::notice::To turn it on see docs/RELEASE.md, 'Turning the update channel on'."
            exit 0
          fi
          # The pool/ holds the package under its Debian name, <package>_<version>_<arch>.deb -- the apt
          # convention, and the name `redrob.py package` keeps in out/deb. The release carries the launcher's
          # name instead, so the Debian name is read back out of the package's own control file here.
          mkdir -p pool
          for f in staging/*.deb; do
            [ -f "$f" ] || continue
            pkg="$(dpkg-deb -f "$f" Package)"
            ver="$(dpkg-deb -f "$f" Version)"
            arch="$(dpkg-deb -f "$f" Architecture)"
            cp "$f" "pool/${pkg}_${ver}_${arch}.deb"
          done
          if ! ls pool/*.deb >/dev/null 2>&1; then
            echo "::notice::no .deb in this release, so there is nothing to put in a repository"
            exit 0
          fi

          # build_repo.py reads out/artifacts by default; point it at what this job downloaded.
          python3 scripts/build_repo.py --artifacts pool --out out/repo

          # Verify BEFORE uploading, against the public key the repository itself carries -- which is the
          # same key.include embeds, so this is the check apt will make on a user's machine. Verifying
          # after upload would mean an unverifiable Release file had already been published.
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          gpg --batch --dearmor < out/repo/redrob-signing-key.asc > "$GNUPGHOME/pub.gpg"
          for f in Release.gpg InRelease; do
            case "$f" in
              Release.gpg) args="out/repo/dists/stable/Release.gpg out/repo/dists/stable/Release" ;;
              InRelease)   args="out/repo/dists/stable/InRelease" ;;
            esac
            # shellcheck disable=SC2086
            gpg --batch --no-default-keyring --keyring "$GNUPGHOME/pub.gpg" --verify $args
            echo "verified $f"
          done

          # Under a FIXED prefix, not a versioned one. An apt repository is a single moving location by
          # design -- dists/stable/InRelease is the file apt re-fetches to discover that a new version
          # exists -- so unlike the installers there is no per-version path and no latest/ alias to make.
          aws s3 sync out/repo "s3://${REDROB_CDN_BUCKET}/${CDN_PREFIX}/apt/" \
            --delete --no-progress --cache-control 'public, max-age=300'

          # Read back through CloudFront, same reason the installer publish does it: a sources.list a
          # package hands out must not reference a file that is not retrievable yet.
          for f in dists/stable/InRelease dists/stable/Release.gpg redrob-signing-key.asc; do
            url="https://${CDN_PUBLIC_HOST}/${CDN_PREFIX}/apt/$f"
            code="$(curl -fsS -o /dev/null -w '%{http_code}' "$url" || echo 000)"
            echo "$code  $url"
            [ "$code" = "200" ] || { echo "::error::$url is not retrievable after upload"; exit 1; }
          done
          echo "apt repository published: https://${CDN_PUBLIC_HOST}/${CDN_PREFIX}/apt/"

  # ---------------------------------------------------------------------------------------------------
  publish:
    # Last, and the organisation's one copy of the step (redrob-labs/.github release-publish.yml): every
    # `release-*` artifact is merged, SHA256SUMS.txt is written over all of them, redrob-launcher.json
    # (`{ "schema": 1, "sharedAccount": true }`) is added, and the DRAFT's assets are replaced with that set
    # -- so the unsigned .app.zip, the mac packaging kit and the unsigned installer leave the release and
    # only signed files remain, every one named redrob-browser-<version>-<os>-<arch><suffix>. Then it is published as latest (prerelease when the
    # version carries a `-`). After the CDN, so a page link never resolves before the bytes behind it.
    # `tag` is the draft's own tag and `target` the commit it was drafted against, so the published tag
    # points at the commit that was built, whatever ref this workflow was dispatched from.
    needs: [probe, collect, sign-macos, sign-windows, cdn]
    if: ${{ !cancelled() && !inputs.dry_run && needs.cdn.result == 'success' && needs.sign-macos.result != 'failure' && needs.sign-windows.result != 'failure' }}
    uses: redrob-labs/.github/.github/workflows/release-publish.yml@main
    permissions:
      contents: write
    with:
      version: ${{ needs.probe.outputs.version }}
      title: Redrob Browser
      tag: ${{ inputs.tag }}
      target: ${{ needs.probe.outputs.target }}
      launcher_manifest: true
      launcher_icon: redrob-browser.png
      publish: true
