# Fast checks, on every push and pull request.
#
# Deliberately does NOT build the browser. A Chromium build needs 40-60 GB of disk, tens of GB of RAM and
# hours of CPU; a GitHub-hosted runner has 14 GB of disk, 16 GB of RAM and a 6-hour job ceiling. A workflow
# here that claimed to build would fail on every run, and a workflow that "builds" something smaller to look
# green is worse than none. The heavy gates live in release.yml on a self-hosted runner.
#
# What IS worth checking in seconds is whether the repository is internally consistent, because that is where a
# patch-based fork actually rots -- a source file nobody copies, a patch named after a path that moved, a
# version the changelog has never heard of. Each of those looks fine on the machine that made it and breaks the
# next clean build.
name: checks

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  repo:
    name: repo integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The default fetch-depth of 1 is fine: every check reads the working tree, not history.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PyYAML, so the rule parsers can be compared against each other
        # The ONLY dependency this repository's tooling installs anywhere, and it is installed to make a check
        # possible rather than to make the tooling work: plaster reads rules with PyYAML when it is importable
        # and with a built-in subset parser when it is not, and the generated patch must not depend on which.
        # With only one parser present there is nothing to compare, so check_repo would report a pass that
        # means the built-in parser agrees with itself.
        #
        # The tooling itself still needs nothing: every script runs on a bare interpreter, which is what the
        # build host has. This is the test environment, not a runtime requirement.
        run: python3 -m pip install --quiet pyyaml

      - name: sources, branding, patch names, versions
        run: python3 scripts/check_repo.py

      - name: the tooling itself parses
        # A syntax error in redrob.py is a broken release pipeline, and it is invisible until someone runs the
        # one subcommand that reaches the broken line.
        run: python3 -m compileall -q scripts/

      - name: release asset names parse the way Redrob Launcher reads them
        # scripts/check_asset_names.py mirrors redrob-launcher's parser; its self-test holds the known-good
        # names (redrob-browser-<version>-linux-x86_64.deb, -macos-aarch64.dmg, -windows-x64-portable.zip) and
        # the known-bad ones (amd64, mac, x64 on Linux, a leading v). Both packaging paths call it as a gate.
        run: python3 scripts/check_asset_names.py --self-test

      - name: version and changelog agree
        run: |
          set -euo pipefail
          python3 scripts/redrob.py version
          echo "REDROB_VERSION=$(cat REDROB_VERSION)"
          echo "CHROMIUM_VERSION=$(cat CHROMIUM_VERSION)"

      - name: the browser's colours come from the design system
        # Offline and instant: it reads the tree, not the registry. Catches a hex typed into the chrome, and
        # catches a token reference that no longer resolves -- which the C++ compiler would otherwise report
        # three hours into a Chromium build on the release runner.
        run: python3 scripts/check_design_tokens.py

      - name: the vendored design system matches its pin
        # This one DOES reach the registry, because the question is whether the copy in the tree is still the
        # release it claims to be. A published npm version is immutable, so a mismatch is an edited vendored
        # file or a moved pin, never a new release.
        run: python3 scripts/vendor_design_system.py
