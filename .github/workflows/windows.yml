# Does this fork compile, launch and package on Windows? Nothing has ever answered that, and this workflow
# exists to.
#
# It is NOT a release. The flavour is dev, and the assertions are that chrome.exe starts and stays up, that the
# UI font landed beside it, and that mini_installer produces a setup.exe. A Windows RELEASE build needs LTO
# (19.9 GB peak RSS measured on Linux, against a hosted runner's 16 GB), plus Authenticode signing, plus a
# hardened update channel. Each is a separate problem and pretending otherwise would produce a workflow that is
# red for three reasons at once.
#
# Manual dispatch only, deliberately. The first runs WILL fail -- the AddFontResourceExW branch in
# redrob_fonts.cc was written on a Linux host and has never been compiled -- and a workflow that reddens every
# push while that is worked through teaches everyone to ignore it.
#
# DISK is the expected failure, not RAM. A Chromium checkout is ~50 GB before a build and a dev build adds
# ~40 GB; a hosted windows runner has ~90 GB across C: and D: with ~30 GB already used by the image. So the
# honest expectation is that `runner: hosted` runs out of space, and that IS the answer: it says a self-hosted
# Windows machine is required, which docs/WINDOWS.md specifies. Run it with `runner: self-hosted` once one
# exists.
name: windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (defaults to the default branch)"
        required: false
      runner:
        description: "Which runner to use"
        required: false
        default: hosted
        type: choice
        options: [hosted, self-hosted]

permissions:
  contents: read

jobs:
  build:
    name: compile, launch and package
    # windows-2025, not windows-2022: the pinned tree requires Visual Studio 2026 (>=18.0.0) and a
    # windows-2022 image carries VS 2022, so that label could not have compiled this checkout even with
    # disk to spare. Whether the 2025 image carries 2026 yet is the next thing this workflow measures --
    # its first step prints the version rather than assuming it.
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted","windows","x64","chromium-build"]') || 'windows-2025' }}
    # 350 on hosted because the PLATFORM caps a hosted job at 6 hours; a larger number here just means the
    # run is killed by GitHub with no timeout message of ours. Self-hosted has no such cap.
    timeout-minutes: ${{ inputs.runner == 'self-hosted' && 700 || 350 }}
    defaults:
      run:
        shell: bash
    env:
      # The hermetic toolchain Google publishes is Google-internal. Everyone else builds against the Visual
      # Studio and Windows SDK on the machine, which is what this selects. Without it gclient tries to download
      # a toolchain it has no access to and the failure names a storage bucket, not a missing dependency.
      DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
      # DEPOT_TOOLS_UPDATE is deliberately NOT pinned here. redrob.py sets it per command and clears it for
      # the one command that must update -- depot_tools' own first run, which is what fetches the bundled
      # python and cipd. Pinning it at job level defeats that and every later command dies on
      # "python3_bin_reldir.txt not found", which reads like a broken checkout.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: what we are working with
        # Recorded first because the two numbers that decide whether this can work are the machine's, and a
        # failed run is only useful if the log says which resource ran out.
        run: |
          systeminfo | grep -E "OS Name|OS Version|Total Physical Memory" || true
          wmic logicaldisk get name,freespace,size 2>/dev/null || Get-PSDrive -PSProvider FileSystem || true
          "/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property catalog_productDisplayVersion || true

      - name: long paths
        # Chromium has paths past 260 characters. Without this the checkout half-completes and the error names
        # whichever file happened to be too long, not the limit -- so this comes before anything clones.
        run: |
          git config --global core.longpaths true
          git config --system core.longpaths true || true

      - name: repo integrity
        run: python scripts/check_repo.py

      - name: bootstrap depot_tools
        run: python scripts/redrob.py bootstrap

      - name: sync Chromium at the pinned tag
        run: python scripts/redrob.py sync

      - name: apply the patch set
        run: |
          python scripts/redrob.py apply
          python scripts/redrob.py brand

      - name: build
        run: python scripts/redrob.py build --flavour windows

      - name: the font actually landed beside the executable
        # The specific thing most likely to be silently wrong. On Windows DIR_MODULE is the directory holding
        # chrome.exe, which is where copy("ui_font") puts the file -- but the copy target is skipped on mac and a
        # future change could skip it here too, and the failure mode is a window that quietly falls back to the
        # system face.
        run: |
          set -euo pipefail
          f="chromium/src/out/windows/fonts/PretendardVariable.ttf"
          if [ ! -f "$f" ]; then
            echo "::error::$f is missing; the ui_font copy target did not run for this platform"
            ls -la chromium/src/out/windows | head -20
            exit 1
          fi
          echo "font at: $f  ($(stat -c%s "$f") bytes)"

      - name: launch it
        run: |
          set -uo pipefail
          cd chromium/src/out/windows
          ./chrome.exe --no-first-run --no-default-browser-check \
            --user-data-dir="$(mktemp -d)" "chrome://redrob" >launch.log 2>&1 &
          pid=$!
          sleep 45
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::the browser exited within 45 seconds"
            tail -40 launch.log
            exit 1
          fi
          # The font line is the interesting one either way: it says whether AddFontResourceExW took the face.
          grep -i "Redrob UI font" launch.log || echo "(no font log line -- check the VLOG level)"
          taskkill //PID "$pid" //F 2>/dev/null || kill "$pid" || true

      # The launch above proves a FRESH profile works, and every job in this repository used one, so
      # nothing here could ever see what happens on the second launch of a profile that did not exit
      # cleanly. That is not a hypothetical gap: it is exactly the shape of a bug that made a profile
      # permanently unlaunchable, because `profile.exit_type` stays `Crashed` until an exit is clean and
      # the browser died on the next start before showing a window. One unclean exit, profile gone.
      #
      # So this step reuses ONE profile directory, kills the first launch the way a crash would, and
      # requires the second launch to come up anyway.
      - name: launch again on a profile that did not exit cleanly
        run: |
          set -uo pipefail
          cd chromium/src/out/windows
          profile="$(mktemp -d)"
          for attempt in 1 2; do
            ./chrome.exe --no-first-run --no-default-browser-check \
              --user-data-dir="$profile" "chrome://redrob" >"relaunch-$attempt.log" 2>&1 &
            pid=$!
            sleep 30
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::launch $attempt on a reused profile exited within 30 seconds"
              tail -40 "relaunch-$attempt.log"
              exit 1
            fi
            # Killed hard on purpose: a clean shutdown would write exit_type=SessionEnded and the second
            # launch would prove nothing.
            taskkill //PID "$pid" //F 2>/dev/null || kill -9 "$pid" || true
            sleep 5
          done

      - name: package
        run: python scripts/redrob.py package --flavour windows

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-setup
          path: |
            out/artifacts/*.exe
            chromium/src/out/windows/launch.log
          if-no-files-found: warn
