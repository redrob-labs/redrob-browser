# Does this fork compile, launch, sign and notarize on macOS? Nothing has ever answered that, and this workflow
# exists to.
#
# It is NOT a release. The target is `chrome`, the flavour is dev, and the assertions are that the .app starts and
# stays up, that the UI font landed inside the framework, and that the result is signed, notarized and stapled. A
# macOS release build needs LTO, which measured a 19.9 GB peak RSS on Linux against a hosted runner's memory, plus
# actool for the app icon. Those are separate problems and pretending otherwise would produce a workflow that is
# red for three reasons at once.
#
# Manual dispatch only, deliberately. The first runs of this will fail -- the macOS font registration and the
# framework bundle_data were written on a Linux host and have never been compiled -- and a workflow that reddens
# every push while that is worked through teaches everyone to ignore it.
name: macos

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (defaults to the default branch)"
        required: false
      sign:
        description: "Sign and notarize the .app (needs the org Apple secrets)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: compile, launch and notarize
    # Hosted, because the point is to get an answer on hardware that exists today. Disk is the risk rather than
    # RAM: the checkout is ~50 GB before a build and a hosted macOS runner is not generous, so if this fails it is
    # likely to fail on space -- which is itself the answer that a self-hosted mac is needed, and a useful one.
    runs-on: macos-15
    # 350, not 700: the PLATFORM caps a hosted job at 6 hours, so a larger number here only means the run is
    # killed by GitHub with no timeout message of ours.
    timeout-minutes: 350
    env:
      # The same names redrob-design/cdn.yml consumes, so the same org values reach this repository unchanged.
      # .github/workflows/preflight.yml confirms all five are visible here.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: what we are working with
        # Recorded first because the two numbers that decide whether this can work are the machine's, and a failed
        # run is only useful if the log says which resource ran out. The Windows run taught this the hard way: the
        # repo's own docs had guessed both its RAM and its disk wrong, in opposite directions.
        run: |
          sw_vers
          xcodebuild -version || true
          sysctl -n hw.memsize | awk '{printf "RAM: %.1f GB\n", $1/1024/1024/1024}'
          df -h / | tail -1

      - name: require the Apple signing and notarization secrets
        # FIRST, before the hours-long build, so a missing credential costs ten seconds rather than four hours.
        # The loop is copied from redrob-design's own step of the same name rather than written fresh.
        if: ${{ inputs.sign }}
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_NOTARY_API_KEY_P8_BASE64 \
            APPLE_API_KEY \
            APPLE_API_ISSUER; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing macOS signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | openssl base64 -d -A > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: repo integrity
        run: python3 scripts/check_repo.py

      - name: bootstrap depot_tools
        run: python3 scripts/redrob.py bootstrap

      - name: sync Chromium at the pinned tag
        run: python3 scripts/redrob.py sync

      - name: apply the patch set
        run: |
          python3 scripts/redrob.py apply
          python3 scripts/redrob.py brand

      - name: build
        run: python3 scripts/redrob.py build --flavour mac

      - name: the font actually landed in the framework
        # The specific thing most likely to be silently wrong. bundle_data that no bundle depends on builds green
        # and copies nothing, so the absence of this file is the difference between a font that registers and a
        # window that quietly falls back to the system face.
        run: |
          set -euo pipefail
          app="chromium/src/out/mac/Redrob Browser.app"
          found="$(find "$app" -name PretendardVariable.ttf -print -quit || true)"
          if [ -z "$found" ]; then
            echo "::error::PretendardVariable.ttf is not in the bundle; ui_font_bundle_data copied nothing"
            find "$app/Contents/Frameworks" -maxdepth 4 -type d | head -20
            exit 1
          fi
          echo "font at: $found"

      - name: launch it
        run: |
          set -euo pipefail
          app="chromium/src/out/mac/Redrob Browser.app"
          "$app/Contents/MacOS/Redrob Browser" \
            --no-first-run --no-default-browser-check \
            --user-data-dir="$(mktemp -d)" "chrome://newtab" >launch.log 2>&1 &
          pid=$!
          sleep 30
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::the browser exited within 30 seconds"
            tail -40 launch.log
            exit 1
          fi
          # The font warning is the interesting line either way: it is what says whether CoreText took the face.
          grep -i "Redrob UI font" launch.log || echo "(no font log line -- check the VLOG level)"
          kill "$pid" || true

      - name: import the signing certificate into a throwaway keychain
        # A keychain of our own, deleted in the cleanup step, rather than the login keychain: a hosted runner is
        # discarded anyway, but a named keychain makes the teardown explicit and keeps `security find-identity`
        # from picking up anything the image happens to ship.
        #
        # set-key-partition-list is the step people leave out. Without it codesign prompts for keychain access,
        # and on a runner with no UI a prompt is a hang rather than an error.
        if: ${{ inputs.sign }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/redrob-signing.keychain-db"
          password="$(openssl rand -base64 24)"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          p12="$RUNNER_TEMP/cert.p12"
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A > "$p12"
          security import "$p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          # The identity name is the certificate's, not something we choose. Read it rather than hardcode it: a
          # renewed certificate can change the string, and a wrong --identity fails inside codesign with a
          # message about an ambiguous or missing identity rather than about the keychain.
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -nE 's/.*"(Developer ID Application: .*)"/\1/p' | head -1)"
          if [ -z "$identity" ]; then
            echo "::error::no Developer ID Application identity in the imported certificate"
            security find-identity -v -p codesigning "$keychain" || true
            exit 1
          fi
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "identity: $identity"

      - name: sign, notarize and staple with upstream's own driver
        # chrome/installer/mac/sign_chrome.py, not a hand-rolled codesign. Chromium's bundle has to be signed
        # inside-out -- helpers, then the framework's versioned directory, then the app -- with per-part
        # entitlements, and upstream's signing module already encodes that order. Writing it here would be
        # re-deriving it, and getting the order wrong produces a bundle that codesign accepts and Gatekeeper
        # rejects. Same reasoning as using chrome/installer/linux:stable_deb for the .deb.
        #
        # --notary-arg is passed straight through to `xcrun notarytool`, which is how the API key reaches it
        # without ever being written into a command line we compose.
        #
        # There is deliberately no --keychain: the driver has no such flag (its whole accepted set is --channel,
        # --development, --disable-packaging, --embed-development-provisioning-profile, --identity,
        # --input, --installer-identity, --notarize, --output, --skip-brand). codesign finds the identity through
        # the user keychain SEARCH LIST, which is why the import step adds the throwaway keychain to it rather
        # than only creating it. Passing a flag that does not exist would fail with "unrecognized arguments"
        # after the build, four hours in.
        #
        # --disable-packaging deliberately: a DMG additionally needs pkg-dmg and universalizer, and this run is
        # answering whether the fork can be signed and notarized at all. The DMG is the next question, not this
        # one.
        if: ${{ inputs.sign }}
        run: |
          set -euo pipefail
          cd chromium/src
          mkdir -p out/mac/signed
          python3 chrome/installer/mac/sign_chrome.py \
            --input out/mac \
            --output out/mac/signed \
            --identity "$SIGNING_IDENTITY" \
            --disable-packaging \
            --notarize staple \
            --notary-arg --key --notary-arg "$APPLE_API_KEY_PATH" \
            --notary-arg --key-id --notary-arg "$APPLE_API_KEY" \
            --notary-arg --issuer --notary-arg "$APPLE_API_ISSUER"

      - name: verify the signature, the ticket and Gatekeeper
        # Three checks and not one, the same three redrob-design runs. codesign says the bundle is signed;
        # stapler says the notarization ticket is actually attached; spctl says the machine WOULD run it. A
        # signing step that silently no-ops passes the first and fails the third, which is the failure worth
        # catching before a user meets it.
        if: ${{ inputs.sign }}
        run: |
          set -euo pipefail
          app="$(find chromium/src/out/mac/signed -maxdepth 3 -type d -name '*.app' | head -1)"
          test -n "$app" || { echo "::error::the signing driver produced no .app"; ls -R chromium/src/out/mac/signed | head -40; exit 1; }
          echo "signed app: $app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: clean up the keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-launch-log
          path: launch.log
          if-no-files-found: warn
