name: checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

jobs:
  rust:
    name: rust
    # A release pull request into main carries code develop already checked.
    if: github.base_ref != 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: checks
          cache-on-failure: true
      - uses: rui314/setup-mold@v1
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libdbus-1-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --features obscura-cli/render -- -D warnings
      # .github/known-test-failures.txt lists tests that fail on upstream Obscura too.
      - name: cargo test
        run: |
          skip=$(grep -v '^#' .github/known-test-failures.txt | grep . | sed 's/^/--skip /' | tr '\n' ' ')
          cargo test --workspace --features obscura-cli/render -- $skip
