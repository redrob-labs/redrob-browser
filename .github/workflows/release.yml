# Release -- the redrob-labs shape (redrob-labs/.github/workflow-templates/release.yml), with
# Redrob Browser's build steps.
#
#   tag v<version> on main  ->  version  ->  macos / windows / linux (build, then sign)  ->  publish
#
# Each package holds three programs: redrob-browser (CLI and engine), redrob-browser-worker and
# redrob-browser-window (the window). Video uses GStreamer: Linux builds with it; macOS and
# Windows build without the `media` feature until the GStreamer runtime is bundled (docs/MEDIA.md).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version for a dry run, e.g. 0.2.0-rc.1 (builds and signs, publishes nothing)
        type: string
        default: ""

permissions:
  contents: read

env:
  PRODUCT: Redrob Browser
  PRODUCT_URL: https://github.com/${{ github.repository }}
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            v="$INPUT_VERSION"
          else
            echo "::error::not a tag push and no version input"; exit 1
          fi
          declared=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "${v%%-*}" != "$declared" ]; then
            echo "::error::tag $v does not match Cargo.toml version $declared"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (unsigned)
        shell: pwsh
        run: |
          cargo build --release -p obscura-cli -p redrob-shell --features obscura-cli/render
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/redrob-browser.exe, target/release/redrob-browser-worker.exe, target/release/redrob-browser-window.exe dist/
      - name: Log in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign the executables
        uses: redrob-labs/.github/actions/sign-windows@main
        with:
          files: dist/*.exe
          description: ${{ env.PRODUCT }}
          url: ${{ env.PRODUCT_URL }}
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          account: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          cert-profile: ${{ secrets.ARTIFACT_SIGNING_CERT_PROFILE }}
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Compress-Archive -Path dist/*.exe, LICENSE, NOTICE -DestinationPath "dist/release/redrob-browser-windows-x64-$env:VERSION.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: dist/release/*
          if-no-files-found: error

  macos:
    name: macOS arm64
    needs: version
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release -p obscura-cli -p redrob-shell --features obscura-cli/render
      - name: Bundle, sign, notarize
        env:
          VERSION: ${{ needs.version.outputs.version }}
          APPLE_CODESIGN_CERT_P12_BASE64: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CODESIGN_CERT_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: bash scripts/package-macos.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: dist/release/*
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libdbus-1-dev pkg-config
      - name: Build and package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cargo build --release -p obscura-cli -p redrob-shell --features obscura-cli/render,redrob-shell/media
          name="redrob-browser-linux-x64-$VERSION"
          mkdir -p "dist/$name" dist/release
          cp target/release/redrob-browser target/release/redrob-browser-worker target/release/redrob-browser-window LICENSE NOTICE "dist/$name/"
          tar -C dist -czf "dist/release/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: dist/release/*
          if-no-files-found: error

  publish:
    needs: [version, windows, macos, linux]
    if: always() && github.ref_type == 'tag' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped')
    uses: redrob-labs/.github/.github/workflows/release-publish.yml@main
    permissions:
      contents: write
    with:
      version: ${{ needs.version.outputs.version }}
      title: Redrob Browser
      launcher_manifest: true
      publish: true
