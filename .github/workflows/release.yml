# The release pipeline: tag -> official build -> .deb -> GitHub release.
#
# SELF-HOSTED, and not by preference. The official build measured 40-60 GB of output and hours of CPU, and the
# packaging step needs debchange from devscripts on the host. Neither fits a GitHub-hosted runner, so this
# workflow declares the runner it actually needs rather than pretending.
#
# The runner must have: ~150 GB free disk, the depot_tools prerequisites, and devscripts installed. That is a
# machine-provisioning requirement, not something a workflow step can fix -- this build installs no system
# packages by design (docs/BUILD.md), so a step that apt-installed devscripts would be violating the same
# constraint the build is built around.
#
# DISPATCH ONLY, and it used to also fire on a `v*` tag. That trigger was removed because no runner carrying
# these labels is registered, so what it actually did was queue: all four release runs to date -- v0.1.0 through
# v0.1.3 -- sat unclaimed and were cancelled by GitHub at exactly 24h. Every one of those tags shipped a release
# whose .deb was built on a workstation and uploaded by hand, because that is the only thing that worked. A
# trigger that cannot be served is worse than no trigger: it puts a pending run on the tag that looks like a
# release in progress for a day, and then a red one, neither of which says "no machine to build this".
#
# So the tag no longer starts anything, and the documented path is the one that already works:
#
#   local:  redrob.py build --flavour release && redrob.py package
#           gh release create vX.Y.Z --draft <artefacts>
#   here:   sign-and-publish.yml, workflow_dispatch with tag=vX.Y.Z
#
# This workflow stays for the day a runner with ~150 GB and devscripts exists, and dispatch is how you would
# reach it then. Until that day it is a declaration of what such a machine would have to be, not a live path.
name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (defaults to the triggering ref)"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: official build and package
    runs-on: [self-hosted, linux, x64, chromium-build]
    # Eight hours: docs/BUILD.md budgets 4-8h for the release flavour with LTO and PGO, and a cold checkout adds
    # the sync on top. A timeout under that turns a slow build into a red pipeline.
    timeout-minutes: 700
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: repo integrity first
        # The same checks as checks.yml, run again here on purpose: a tag can point at a commit that never went
        # through a pull request, and eight hours is a long time to spend finding out the manifest was broken.
        run: python3 scripts/check_repo.py

      - name: the ref and REDROB_VERSION must agree, when a tag was asked for
        # Only meaningful when the dispatch names a tag. There is no `github.ref` tag to read any more -- under
        # workflow_dispatch that is the branch the workflow file came from -- so this reads the input instead,
        # and says nothing when the input is a branch or a sha.
        if: startsWith(inputs.ref, 'v')
        run: |
          set -euo pipefail
          tag="${REF#v}"
          file="$(cat REDROB_VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "ref $REF does not match REDROB_VERSION $file" >&2
            exit 1
          fi
        env:
          REF: ${{ inputs.ref }}

      - name: bootstrap depot_tools
        run: python3 scripts/redrob.py bootstrap

      - name: sync Chromium at the pinned tag
        # Also what sets checkout_pgo_profiles, without which gn gen on an official build dies inside
        # update_pgo_profiles.py. See docs/RELEASE.md.
        run: python3 scripts/redrob.py sync

      - name: apply the patch set
        run: |
          python3 scripts/redrob.py apply
          python3 scripts/redrob.py brand

      - name: official build
        run: python3 scripts/redrob.py build --flavour release

      - name: package
        run: python3 scripts/redrob.py package --flavour release

      - name: launch it once
        # A binary that links is not a binary that starts. Xvfb because the runner is headless; the flags are the
        # ones the probe scripts use.
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          sleep 3
          DISPLAY=:99 timeout 60 chromium/src/out/release/chrome \
            --no-sandbox --test-type --no-first-run --no-default-browser-check \
            --enable-unsafe-swiftshader --user-data-dir="$(mktemp -d)" >launch.log 2>&1 &
          sleep 30
          if grep -qiE "SIGSEGV|Check failed|FATAL" launch.log; then
            echo "the release binary did not start cleanly:" >&2
            tail -30 launch.log >&2
            exit 1
          fi
          pkill -f "out/release/chrome" || true
          pkill -f "Xvfb :99" || true

      - uses: actions/upload-artifact@v4
        with:
          name: redrob-browser-deb
          path: out/artifacts/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: redrob-browser-cdn
          path: out/cdn/*
          if-no-files-found: error

      - name: signed apt repository
        # Only when a signing key exists. A step that fell back to an UNSIGNED repository when the secret was
        # missing would publish an update channel whose every future update is whatever the network hands the
        # user -- and it would look green while doing it. Skipping is the safe failure; `redrob.py repo` also
        # refuses to build signed with no key rather than guessing.
        if: ${{ env.REDROB_SIGNING_KEY != '' }}
        env:
          REDROB_SIGNING_KEY: ${{ secrets.REDROB_SIGNING_KEY }}
        run: python3 scripts/redrob.py repo

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('out/repo/dists/stable/InRelease') != '' }}
        with:
          name: redrob-apt-repo
          path: out/repo/**
          if-no-files-found: error

      - name: draft the GitHub release
        # Keyed on REDROB_VERSION, not on a tag ref: there is no tag trigger any more, and the version this
        # build actually produced is the one in the file it was built from.
        # A DRAFT, not a publish. Everything above is machine-checkable; whether a version is fit to hand to
        # people is not, and the gaps in CHANGELOG.md -- Linux only, no other platform's update channel -- are
        # exactly the kind of thing a human should have to look at before this goes out.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cat REDROB_VERSION)"
          gh release create "v$version" out/artifacts/* \
            --draft \
            --title "Redrob Browser $version" \
            --notes "Chromium $(cat CHROMIUM_VERSION). See CHANGELOG.md for what is in this version and what is missing from it."

  # A separate job on a hosted runner, for the reason redrob-design gives for the same split: a failed upload can
  # be retried without repeating the build it publishes -- and here that build is measured in HOURS, so the
  # argument is stronger than it is for a twenty-minute one.
  publish-cdn:
    name: publish to cdn.redrob.ai
    needs: build
    if: github.repository == 'redrob-labs/redrob-browser'
    runs-on: ubuntu-latest
    env:
      # The same variable names as every other product in this organisation. They are the convention rather than
      # a choice being made here -- see .github/scripts/cdn-publish.sh.
      REDROB_CDN_BUCKET: ${{ vars.REDROB_CDN_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.REDROB_CDN_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.REDROB_CDN_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      CDN_PUBLIC_HOST: cdn.redrob.ai
      CDN_PREFIX: browser
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: echo "version=$(cat REDROB_VERSION)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: redrob-browser-cdn
          path: staging

      - name: Publish the .deb to cdn.redrob.ai
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/cdn-publish.sh staging

      - uses: actions/download-artifact@v4
        # The repository only exists when the signing key does, and the build job skips it otherwise, so this
        # download must not be fatal: an unprovisioned key should leave the .deb published and the update channel
        # absent, not redden a release that built correctly.
        continue-on-error: true
        with:
          name: redrob-apt-repo
          path: repo

      - name: Publish the apt repository to cdn.redrob.ai
        if: ${{ hashFiles('repo/dists/stable/InRelease') != '' }}
        run: bash .github/scripts/cdn-publish-apt.sh repo
