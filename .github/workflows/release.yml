# Release -- the redrob-labs shape (redrob-labs/.github/workflow-templates/release.yml), with
# Redrob Browser's build steps.
#
#   tag v<version> on main  ->  version  ->  macos / windows / linux x64 + arm64 (build, then sign)  ->  publish
#
# Each package holds three programs: redrob-browser (CLI and engine), redrob-browser-worker and
# redrob-browser-window (the window); Windows ships a branded setup (installer/windows) beside the
# zip. The window runs its tabs on Chromium through CEF (docs/CEF.md), which also plays video: every
# job fetches CEF's prebuilt binaries for its platform (CEF_VERSION, cached) and the package carries
# the CEF runtime beside the window, so nothing else has to be installed (docs/RELEASE.md).
#
# Asset names are redrob-browser-<platform>-<version>.<ext>; the window's updater matches the
# prefix redrob-browser-<platform>- (crates/redrob-shell/src/updater.rs).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version for a dry run, e.g. 0.2.0-rc.1 (builds and signs, publishes nothing)
        type: string
        default: ""

permissions:
  contents: read

env:
  PRODUCT: Redrob Browser
  PRODUCT_URL: https://github.com/${{ github.repository }}
  CARGO_TERM_COLOR: always
  # Build caches: Swatinem/rust-cache keeps the registry and target/ per platform, and sccache
  # keeps each compiled crate in the Actions cache, so a cache miss of one does not rebuild all.
  # A tag run can read caches saved on the default branch (develop): a release dry run there
  # before tagging leaves the tag build warm.
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  # The `cef` crate the window builds with (Cargo.lock); export-cef-dir of the same version fetches
  # the matching CEF binary distribution (Chromium 156) from CEF's builds CDN. The build links
  # against CEF_PATH and the packaging copies its runtime from there.
  CEF_VERSION: 156.3.0+156.0.15

jobs:
  version:
    name: Resolve the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            v="$INPUT_VERSION"
          else
            echo "::error::not a tag push and no version input"; exit 1
          fi
          declared=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "${v%%-*}" != "$declared" ]; then
            echo "::error::tag $v does not match Cargo.toml version $declared"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-x64
          cache-on-failure: true
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cef
          key: cef-windows-x64-${{ env.CEF_VERSION }}
      - name: Fetch CEF
        shell: pwsh
        run: |
          $cef = Join-Path $env:RUNNER_TEMP cef
          if (-not (Test-Path "$cef\archive.json")) {
            $tool = Join-Path $env:RUNNER_TEMP cef-tool
            cargo install export-cef-dir --version "=$env:CEF_VERSION" --locked --root $tool
            if ($LASTEXITCODE -ne 0) { throw "cargo install export-cef-dir failed" }
            & "$tool\bin\export-cef-dir.exe" --force $cef
            if ($LASTEXITCODE -ne 0) { throw "export-cef-dir failed" }
          }
          if (-not (Test-Path "$cef\libcef.dll")) { throw "$cef has no libcef.dll" }
          "CEF_PATH=$cef" >> $env:GITHUB_ENV
      # The engine's Chrome-like TLS transport (obscura-cli/stealth) builds BoringSSL with CMake
      # and generates its bindings with bindgen, which loads libclang from the image's LLVM.
      - name: Point bindgen at libclang
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV'
      - name: Build (unsigned)
        shell: pwsh
        run: |
          cargo build --release -p obscura-cli -p redrob-shell --features obscura-cli/render,obscura-cli/stealth
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }
          # dist/app is the installed folder: the programs with the CEF runtime beside them.
          $app = 'dist/app'
          New-Item -ItemType Directory -Force $app | Out-Null
          Copy-Item target/release/redrob-browser.exe, target/release/redrob-browser-worker.exe, target/release/redrob-browser-window.exe, LICENSE, NOTICE $app
          # CEF beside the window: libcef.dll and the DLLs it loads (chrome_elf, ANGLE, SwiftShader,
          # Vulkan, the DirectX compilers), its .pak resources, ICU data, the V8 snapshot, CREDITS.html
          # (Chromium's and CEF's licences, linked from the About page) and English and Korean of
          # its translations. Build files (.lib, cmake, headers) stay out.
          $cef = $env:CEF_PATH
          Get-ChildItem $cef -File | Where-Object {
            $_.Extension -in '.dll', '.pak', '.dat', '.bin', '.json' -and $_.Name -ne 'archive.json'
          } | Copy-Item -Destination $app
          python scripts/cef-credits.py $cef "$app\CREDITS.html"
          if ($LASTEXITCODE -ne 0) { throw "CREDITS.html failed" }
          New-Item -ItemType Directory -Force "$app\locales" | Out-Null
          Get-ChildItem "$cef\locales" -File | Where-Object { $_.Name -like 'en-US*.pak' -or $_.Name -like 'ko*.pak' } |
            Copy-Item -Destination "$app\locales"
          # With CEF's Windows sandbox the window is a DLL that CEF's bootstrap.exe (a GUI program)
          # loads under its own name, so bootstrap.exe ships as redrob-browser-window.exe.
          if (Test-Path target/release/redrob_browser_window.dll) {
            Copy-Item target/release/redrob_browser_window.dll "$app\redrob-browser-window.dll"
            Copy-Item "$cef\bootstrap.exe" "$app\redrob-browser-window.exe" -Force
          }
          foreach ($need in 'libcef.dll', 'chrome_elf.dll', 'icudtl.dat', 'resources.pak', 'v8_context_snapshot.bin', 'CREDITS.html', 'locales\en-US.pak', 'locales\ko.pak') {
            if (-not (Test-Path "$app\$need")) { throw "missing from the package: $need" }
          }
          # The Visual C++ runtime, app-local: our programs link it, and a Windows
          # without the VC++ redistributable has none (0.1.1 did not start there).
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { throw "no Visual C++ runtime under $vs\VC\Redist\MSVC" }
          Write-Host "Visual C++ runtime from $($crt.FullName)"
          Copy-Item "$($crt.FullName)\*.dll" $app
          # Every DLL a program or a top-level DLL imports is in the folder or is part of Windows; the
          # C++ runtime must be in the folder for every file, since only the redistributable puts it
          # in System32. The window is a GUI program (PE subsystem 2):
          # no console.
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1
          $root = (Resolve-Path $app).Path
          $here = @{}; Get-ChildItem $root -File | ForEach-Object { $here[$_.Name.ToLowerInvariant()] = $true }
          $sys = "$env:SystemRoot\System32"
          $bad = @()
          foreach ($pe in Get-ChildItem $root -Recurse -File -Include *.exe, *.dll) {
            $top = $pe.DirectoryName -eq $root
            foreach ($line in & $dumpbin.FullName /nologo /dependents $pe.FullName) {
              $dll = $line.Trim()
              if ($dll -notmatch '^[\w.+-]+\.dll$') { continue }
              $name = $dll.ToLowerInvariant()
              if ($here.ContainsKey($name) -or $name -like 'api-ms-*' -or $name -like 'ext-ms-*') { continue }
              if ($name -match '^(vcruntime|msvcp|concrt|vccorlib|vcomp)' -or ($top -and -not (Test-Path "$sys\$dll"))) {
                $bad += "$($pe.FullName.Substring($root.Length + 1)) needs $dll"
              }
            }
          }
          if ($bad) { $bad | Select-Object -First 40 | ForEach-Object { Write-Host "::error::$_" }; throw "$($bad.Count) unresolved DLL imports" }
          foreach ($gui in 'redrob-browser-window.exe') {
            $bytes = [IO.File]::ReadAllBytes("$root\$gui")
            $subsystem = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 0x5C)
            if ($subsystem -ne 2) { throw "$gui has PE subsystem $subsystem, expected 2 (Windows GUI)" }
          }
      - name: Log in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Every .exe and .dll in the package carries a valid Authenticode signature: ours on the
      # programs, CEF's runtime (CEF's builds are unsigned) and whatever else arrives unsigned;
      # files that already carry their vendor's signature (the Visual C++ runtime, Microsoft's
      # DirectX compilers) keep it.
      - name: List the unsigned executables
        id: unsigned
        shell: pwsh
        run: |
          $root = (Resolve-Path dist/app).Path
          $files = Get-ChildItem $root -Recurse -File -Include *.exe, *.dll |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' } |
            ForEach-Object { 'dist/app/' + $_.FullName.Substring($root.Length + 1).Replace('\', '/') }
          if ($files | Where-Object { $_ -match '\s' }) { throw "a file name has a space: $($files -join ', ')" }
          Write-Host "$(@($files).Count) files to sign"
          "files=$($files -join ' ')" >> $env:GITHUB_OUTPUT
      - name: Sign the executables
        uses: redrob-labs/.github/actions/sign-windows@main
        with:
          files: ${{ steps.unsigned.outputs.files }}
          description: ${{ env.PRODUCT }}
          url: ${{ env.PRODUCT_URL }}
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          account: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          cert-profile: ${{ secrets.ARTIFACT_SIGNING_CERT_PROFILE }}
      # The setup (installer/windows) embeds the zip and its uninstaller, so each is signed before it
      # goes in: zip -> uninstaller -> sign it -> setup -> sign the setup.
      - name: Package the zip and the setup's uninstaller
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist/release | Out-Null
          # Every file of the package, so an update replaces exactly those (crates/redrob-shell/src/bundle.rs).
          $root = (Resolve-Path dist/app).Path
          $list = @(Get-ChildItem $root -Recurse -File | Where-Object { $_.Name -ne 'bundle-manifest.txt' } |
            ForEach-Object { $_.FullName.Substring($root.Length + 1).Replace('\', '/') } | Sort-Object -CaseSensitive) + 'bundle-manifest.txt'
          [IO.File]::WriteAllText("$root\bundle-manifest.txt", (($list -join "`n") + "`n"))
          Compress-Archive -Path dist/app/* -DestinationPath "dist/release/redrob-browser-windows-x64-$env:VERSION.zip"
          python -m pip install --quiet fonttools==4.67.0
          if ($LASTEXITCODE -ne 0) { throw "pip install fonttools failed" }
          # The setup's VERSIONINFO is numeric: 0.2.0-rc.1 is 0.2.0 there.
          $plain = $env:VERSION.Split('-')[0]
          python -u installer/windows/build.py --out dist/setup --arch x64 --version $plain --uninstaller-only
          if ($LASTEXITCODE -ne 0) { throw "setup: uninstaller build failed" }
      - name: Sign the uninstaller
        uses: redrob-labs/.github/actions/sign-windows@main
        with:
          files: dist/setup/uninstall/*.exe
          description: ${{ env.PRODUCT }}
          url: ${{ env.PRODUCT_URL }}
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          account: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          cert-profile: ${{ secrets.ARTIFACT_SIGNING_CERT_PROFILE }}
      - name: Build the setup
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $name = "redrob-browser-windows-x64-$env:VERSION-setup.exe"
          $plain = $env:VERSION.Split('-')[0]
          python -u installer/windows/build.py --out dist/setup --arch x64 --version $plain `
            --payload "dist/release/redrob-browser-windows-x64-$env:VERSION.zip" `
            --uninstaller "dist/setup/uninstall/Uninstall Redrob Browser.exe" --name $name
          if ($LASTEXITCODE -ne 0) { throw "setup build failed" }
          Move-Item "dist/setup/$name" dist/release/
      - name: Sign the setup
        uses: redrob-labs/.github/actions/sign-windows@main
        with:
          files: dist/release/*-setup.exe
          description: ${{ env.PRODUCT }} Setup
          url: ${{ env.PRODUCT_URL }}
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          account: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          cert-profile: ${{ secrets.ARTIFACT_SIGNING_CERT_PROFILE }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: dist/release/*
          if-no-files-found: error

  macos:
    name: macOS arm64
    needs: version
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos-arm64
          cache-on-failure: true
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cef
          key: cef-macos-arm64-${{ env.CEF_VERSION }}
      - name: Fetch CEF
        run: bash scripts/fetch-cef.sh "$RUNNER_TEMP/cef"
      # BoringSSL (the engine's Chrome-like TLS transport) compiles against one coherent SDK, and
      # bindgen loads the Xcode toolchain's libclang.
      - name: Point BoringSSL and bindgen at the SDK
        run: |
          set -euo pipefail
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release -p obscura-cli -p redrob-shell --features obscura-cli/render,obscura-cli/stealth
      - name: Bundle, sign, notarize
        env:
          VERSION: ${{ needs.version.outputs.version }}
          APPLE_CODESIGN_CERT_P12_BASE64: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CODESIGN_CERT_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
        run: bash scripts/package-macos.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: dist/release/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux-${{ matrix.arch }}
          cache-on-failure: true
      # mold links the three large programs in a fraction of the time ld takes.
      - uses: rui314/setup-mold@v1
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libdbus-1-dev pkg-config
          # BoringSSL for the engine's Chrome-like TLS transport: CMake builds it, bindgen (libclang)
          # writes its bindings and needs the compiler's own headers (stddef.h) on its path.
          sudo apt-get install -y --no-install-recommends cmake clang libclang-dev
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$(gcc -print-file-name=include)" >> "$GITHUB_ENV"
          # patchelf gives the window the run path $ORIGIN (libcef.so beside it). The libraries
          # libcef.so links, which every desktop that runs Chrome has, let the packaging check that
          # every library of the bundle resolves (scripts/package-linux.sh).
          sudo apt-get install -y --no-install-recommends patchelf libnss3 libnspr4 libatk1.0-0 \
            libatk-bridge2.0-0 libatspi2.0-0 libcups2 libdrm2 libgbm1 libxcomposite1 libxdamage1 \
            libxrandr2 libxfixes3 libxext6 libpango-1.0-0 libcairo2 libasound2 libxkbcommon0 libxkbcommon-x11-0 libudev1 libexpat1
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cef
          key: cef-linux-${{ matrix.arch }}-${{ env.CEF_VERSION }}
      - name: Fetch CEF
        run: bash scripts/fetch-cef.sh "$RUNNER_TEMP/cef"
      - name: Build and package
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PLATFORM: linux-${{ matrix.arch }}
        # The same script builds the bundle on a developer's machine (docs/RELEASE.md).
        run: |
          set -euo pipefail
          cargo build --release -p obscura-cli -p redrob-shell --features obscura-cli/render,obscura-cli/stealth
          bash scripts/package-linux.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    needs: [version, windows, macos, linux]
    if: always() && github.ref_type == 'tag' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped')
    uses: redrob-labs/.github/.github/workflows/release-publish.yml@main
    permissions:
      contents: write
    with:
      version: ${{ needs.version.outputs.version }}
      title: Redrob Browser
      launcher_manifest: true
      publish: true
