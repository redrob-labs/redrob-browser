# PA-5. The address-bar agent row's own label.
#
# It lives HERE, in the omnibox's shared strings, and not in `redrob_strings.grd`, because the
# provider that reads it is in `components/omnibox` -- which cannot see a chrome-level grit
# header. The first version put it in our own grd and would not have compiled.
#
# The label is what makes the row readable as not-a-search. The omnibox decides a row's icon
# and trailing text from the match TYPE, and our type means nothing to it, so without this
# string the row shows the user's own sentence twice and explains nothing.
substitutions:
  - description: Add the Redrob agent row's description string.
    regex:
      pattern: "  <message name=\"IDS_AUTOCOMPLETE_SEARCH_DESCRIPTION\" desc=\"Description for the default search match.\">\n"
      replace: "  <message name=\"IDS_OMNIBOX_REDROB_ASK_AGENT\" desc=\"Trailing label on the address bar row that hands what the user typed to the agent instead of searching for it.\">\n    Ask the agent about this page\n  </message>\n  <message name=\"IDS_AUTOCOMPLETE_SEARCH_DESCRIPTION\" desc=\"Description for the default search match.\">\n"
      count: 1
