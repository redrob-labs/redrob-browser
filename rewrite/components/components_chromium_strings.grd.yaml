# strings shared by components/, reused across surfaces, renamed from the shared preset.
#
# Thin on purpose. The protected-phrase list is in presets/product-name.yaml and is shared by every
# strings file, so a phrase added there protects this file too -- which is the whole reason it is not
# copied in here.

substitutions:
  - description: |
      Chromium -> Redrob across strings shared by components/, reused across surfaces, leaving every phrase in presets/product-name.yaml alone.
    rename:
      preset: product-name
