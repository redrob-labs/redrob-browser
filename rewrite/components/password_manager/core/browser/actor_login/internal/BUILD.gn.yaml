# CAP-9. Let the agent's sign-in tool (chrome/browser/redrob/credential_tools.cc) depend on the agent-login
# delegate.
#
# The delegate target is visibility-restricted to the browser's own agent-login client. Ours is a second
# client of the same service -- it answers the same questions (which frame, which driver, is the tab in
# front) for the agent tab -- so it needs the same visibility and nothing else. The anchor is the delegate
# block's own test entry, which is the one line of that list no other target's visibility repeats.
substitutions:
  - description: |
      Add //chrome/browser/redrob to the delegate's visibility.
    regex:
      pattern: "    \"//components/password_manager/core/browser/actor_login/test:*\","
      replace: "    \"//chrome/browser/redrob:*\",\n    \"//components/password_manager/core/browser/actor_login/test:*\","
      count: 1
