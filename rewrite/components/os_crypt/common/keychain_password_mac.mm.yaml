# The macOS keychain item that holds the password-encryption key.

substitutions:
  - description: |
      Shown in the keychain prompt ("... in your keychain: <service>"). Mac has not shipped, so no
      saved password is lost, and the upstream name would share the item with an upstream install.
    regex:
      pattern: "const char kDefaultServiceName[] = \"BrowserOS Safe Storage\";\nconst char kDefaultAccountName[] = \"BrowserOS\";\n"
      replace: "const char kDefaultServiceName[] = \"Redrob Safe Storage\";\nconst char kDefaultAccountName[] = \"Redrob\";\n"
      count: 1
