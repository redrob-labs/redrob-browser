# Follows keychain_password_mac.mm.yaml.

substitutions:
  - description: |
      The expected keychain names.
    regex:
      pattern: "EXPECT_EQ(\"BrowserOS Safe Storage\", KeychainPassword::GetServiceName());"
      replace: "EXPECT_EQ(\"Redrob Safe Storage\", KeychainPassword::GetServiceName());"
      count: 1
  - description: |
      (continued)
    regex:
      pattern: "EXPECT_EQ(\"BrowserOS\", KeychainPassword::GetAccountName());"
      replace: "EXPECT_EQ(\"Redrob\", KeychainPassword::GetAccountName());"
      count: 1
