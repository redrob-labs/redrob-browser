# The Linux keyring item that holds the browser's encryption secret: our own name, and a way to keep
# the old one.
#
# A Chromium-branded build stores its secret as "Chromium Safe Storage" (application=chromium), the
# same item a real Chromium on the machine uses. Seahorse and KWallet Manager show it under Chromium's
# name, and the two browsers silently share one key.
#
# Renaming alone would be data loss: every saved password and cookie is encrypted under the secret in
# the OLD item, so a fresh item means nothing decrypts. The .cc rule therefore looks for the old item
# before minting a new secret and copies it across. The old item is left in place, because a real
# Chromium may still be reading it.

substitutions:
  - description: |
      Our item names, and Chromium's kept as the legacy names to migrate from.
    regex:
      pattern: |
        #else
          static constexpr char kKWalletFolder[] = "Chromium Keys";
          static constexpr char kKeyName[] = "Chromium Safe Storage";
          static constexpr char kAppName[] = "chromium";
        #endif
      replace: |
        #else
          // Redrob: our own keyring item. The Chromium names below are where earlier
          // builds stored the secret; see TryLegacy* in the .cc.
          static constexpr char kKWalletFolder[] = "Redrob Keys";
          static constexpr char kKeyName[] = "Redrob Safe Storage";
          static constexpr char kAppName[] = "redrob-browser";
        #endif
          static constexpr char kLegacyKWalletFolder[] = "Chromium Keys";
          static constexpr char kLegacyKeyName[] = "Chromium Safe Storage";
          static constexpr char kLegacyAppName[] = "chromium";
  - description: |
      Declare the migration steps.
    regex:
      pattern: "  void GenerateAndWriteKWalletPassword();\n"
      replace: "  void GenerateAndWriteKWalletPassword();\n  // Redrob: copy the secret from the legacy Chromium-named entry, if any.\n  void TryLegacyKWalletPassword();\n  void OnKWalletHasLegacyEntry(dbus_utils::CallMethodResultSig<\"b\"> has_entry);\n  void OnKWalletReadLegacyPassword(\n      dbus_utils::CallMethodResultSig<\"s\"> secret_reply);\n"
  - description: |
      Track whether the secret being read came from the legacy item.
    regex:
      pattern: "  bool session_opened_ = false;\n"
      replace: "  bool session_opened_ = false;\n  // Redrob: the search fell back to the legacy item, and what it finds is copied.\n  bool searching_legacy_ = false;\n  bool migrating_legacy_ = false;\n"
