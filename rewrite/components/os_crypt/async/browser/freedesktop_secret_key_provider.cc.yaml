# Migrate the Linux keyring secret from Chromium's item name to ours. See the .h rule for why.
#
# Secret Service: when no item carries application=redrob-browser, search application=chromium before
# minting a secret. If one is found, its secret is read as before and written to a new item under our
# name, then used. KWallet: the same, from the "Chromium Keys" folder to "Redrob Keys".
#
# The copy is the same secret, so the derived key is the same and existing data still decrypts. The
# legacy item is never deleted.

substitutions:
  - description: |
      Fall back to the legacy item before creating a new secret.
    regex:
      pattern: "  if (result_paths.empty()) {\n    // No items found, create a new secret.\n"
      replace: "  if (result_paths.empty() && !searching_legacy_) {\n    // Redrob: nothing under our name yet. Earlier builds stored the secret\n    // under Chromium's, and everything saved is encrypted with it, so look\n    // there before minting a new one.\n    searching_legacy_ = true;\n    std::map<std::string, std::string> legacy_attrs{\n        {kApplicationAttributeKey, kLegacyAppName}};\n    dbus_utils::CallMethod<\"a{ss}\", \"ao\">(\n        default_collection_proxy_, kSecretCollectionInterface,\n        kMethodSearchItems,\n        base::BindOnce(&FreedesktopSecretKeyProvider::OnSearchItems,\n                       weak_ptr_factory_.GetWeakPtr()),\n        legacy_attrs);\n    return;\n  }\n  if (!result_paths.empty() && searching_legacy_) {\n    migrating_legacy_ = true;\n  }\n  if (result_paths.empty()) {\n    // No items found, create a new secret.\n"
  - description: |
      Copy a legacy secret into our own item instead of using it in place.
    regex:
      pattern: "  DeriveKeyFromSecret(base::span(value));\n}\n"
      replace: "  if (migrating_legacy_) {\n    // Redrob: same secret, our item name. OnCreateItem derives the key.\n    migrating_legacy_ = false;\n    CreateItem(base::MakeRefCounted<base::RefCountedBytes>(value));\n    return;\n  }\n  DeriveKeyFromSecret(base::span(value));\n}\n"
  - description: |
      KWallet, new folder: try the legacy entry before generating.
    regex:
      pattern: "    FinalizeFailure(InitStatus::kKWalletFolderCreationFailed);\n    return;\n  }\n  GenerateAndWriteKWalletPassword();\n}\n"
      replace: "    FinalizeFailure(InitStatus::kKWalletFolderCreationFailed);\n    return;\n  }\n  TryLegacyKWalletPassword();\n}\n"
  - description: |
      KWallet, folder without our entry: the same.
    regex:
      pattern: "  } else {\n    GenerateAndWriteKWalletPassword();\n  }\n}\n"
      replace: "  } else {\n    TryLegacyKWalletPassword();\n  }\n}\n"
  - description: |
      The KWallet migration steps: read the legacy entry, write it under our name.
    regex:
      pattern: |
        void FreedesktopSecretKeyProvider::GenerateAndWriteKWalletPassword() {
      replace: |
        void FreedesktopSecretKeyProvider::TryLegacyKWalletPassword() {
          DCHECK_CALLED_ON_VALID_SEQUENCE(sequence_checker_);
          dbus_utils::CallMethod<"isss", "b">(
              kwallet_proxy_, kKWalletInterface, kKWalletMethodHasEntry,
              base::BindOnce(&FreedesktopSecretKeyProvider::OnKWalletHasLegacyEntry,
                             weak_ptr_factory_.GetWeakPtr()),
              kwallet_handle_, kLegacyKWalletFolder, kLegacyKeyName, product_name_);
        }

        void FreedesktopSecretKeyProvider::OnKWalletHasLegacyEntry(
            dbus_utils::CallMethodResultSig<"b"> has_entry) {
          DCHECK_CALLED_ON_VALID_SEQUENCE(sequence_checker_);
          if (!has_entry.has_value() || !std::get<0>(has_entry.value())) {
            GenerateAndWriteKWalletPassword();
            return;
          }
          dbus_utils::CallMethod<"isss", "s">(
              kwallet_proxy_, kKWalletInterface, kKWalletMethodReadPassword,
              base::BindOnce(
                  &FreedesktopSecretKeyProvider::OnKWalletReadLegacyPassword,
                  weak_ptr_factory_.GetWeakPtr()),
              kwallet_handle_, kLegacyKWalletFolder, kLegacyKeyName, product_name_);
        }

        void FreedesktopSecretKeyProvider::OnKWalletReadLegacyPassword(
            dbus_utils::CallMethodResultSig<"s"> secret_reply) {
          DCHECK_CALLED_ON_VALID_SEQUENCE(sequence_checker_);
          if (!secret_reply.has_value() || std::get<0>(secret_reply.value()).empty()) {
            GenerateAndWriteKWalletPassword();
            return;
          }
          auto secret = base::MakeRefCounted<base::RefCountedString>(
              std::move(std::get<0>(secret_reply.value())));
          dbus_utils::CallMethod<"issss", "i">(
              kwallet_proxy_, kKWalletInterface, kKWalletMethodWritePassword,
              base::BindOnce(&FreedesktopSecretKeyProvider::OnKWalletWritePassword,
                             weak_ptr_factory_.GetWeakPtr(), secret),
              kwallet_handle_, kKWalletFolder, kKeyName, secret->as_string(),
              product_name_);
        }

        void FreedesktopSecretKeyProvider::GenerateAndWriteKWalletPassword() {
