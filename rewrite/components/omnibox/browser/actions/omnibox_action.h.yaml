# PA-5. The one method the agent row needs from the chrome side.
#
# `OmniboxAction::Client` is the seam components/omnibox declares and chrome implements. It is
# what lets the action start a task without components depending on chrome -- the mistake the
# first version of this made, which could not have linked.
#
# Given a DEFAULT BODY rather than being pure virtual, deliberately. Every test and headless
# harness that implements this interface would otherwise stop compiling, and the one that
# matters -- `ChromeAutocompleteProviderClient` -- overrides it. A pure virtual here buys
# nothing: a Client that cannot start a task is exactly the Client that should do nothing.
#
# `regex` rather than a block `lines:`, because the two rule parsers read indentation inside a
# YAML block differently and the repo gate rejects a rule whose meaning depends on which one
# ran. An explicit pattern/replace has one reading.
substitutions:
  - description: Add the agent-task hook to the omnibox action client interface.
    regex:
      pattern: "    virtual void IssueContextualSearchRequest(\n        const GURL& destination_url,\n        AutocompleteMatchType::Type match_type,\n        bool is_zero_prefix_suggestion) = 0;\n"
      replace: "    virtual void IssueContextualSearchRequest(\n        const GURL& destination_url,\n        AutocompleteMatchType::Type match_type,\n        bool is_zero_prefix_suggestion) = 0;\n\n    // Hands what the user typed in the address bar to the agent, with the active tab as\n    // context. Does nothing by default: a client with no profile has no task to start.\n    virtual void StartRedrobAgentTask(const std::u16string& prompt) {}\n"
      count: 1
