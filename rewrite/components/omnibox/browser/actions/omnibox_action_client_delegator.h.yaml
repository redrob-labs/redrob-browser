# CAP-3. Forward the agent-task hook through the delegating action client.
#
# The omnibox does not execute an action against ChromeAutocompleteProviderClient directly: the edit
# model wraps it in OmniboxEditModelActionClient, an OmniboxActionClientDelegator that forwards every
# Client method by hand. A method the delegator does not forward falls through to the interface's
# default body -- for StartRedrobAgentTask, an empty one. So until this rule, choosing the agent row in
# the address bar ran the action and did nothing at all, with nothing to report it.
#
# Inline in the header so the fix is one file. The interface's default body stays empty on purpose (see
# omnibox_action.h.yaml); the delegator is the one Client that must never use it.
substitutions:
  - description: Forward StartRedrobAgentTask to the wrapped client.
    regex:
      pattern: "  void OpenComposeboxForAskG() override;\n"
      replace: "  void OpenComposeboxForAskG() override;\n  void StartRedrobAgentTask(const std::u16string& prompt) override {\n    delegate_->StartRedrobAgentTask(prompt);\n  }\n"
      count: 1
