# PA-5. The action id for the address bar's agent row.
#
# Inserted BEFORE `LAST`, which is this enum's own stated contract -- its comment says LAST
# must stay last with an id one larger than the final valid action. Appending after it would
# give our action LAST's number and make every bounds check off by one.
#
# Unnumbered on purpose: the enum has no explicit values, so position is the number. That is
# also why this goes at the end of the real entries rather than beside a related one -- the
# comment above the obsolete starter-pack entries says ids are never removed or reused, so
# inserting in the middle would renumber everything after it.
#
# A GENERATED JAVA ENUM mirrors this file (the header says so), so the Android build gets the
# new value for free. There is no second place to edit.
substitutions:
  - description: Add the Redrob agent action id.
    regex:
      pattern: "  // Action to open a tab from another device.\n  CROSS_DEVICE_TAB,\n"
      replace: "  // Action to open a tab from another device.\n  CROSS_DEVICE_TAB,\n\n  // Hands what was typed in the address bar to the agent instead of navigating.\n  REDROB_AGENT,\n"
      count: 1
