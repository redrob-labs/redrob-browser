# PA-5. The provider Type bit for the address bar's agent row.
#
# `1 << 28` is the next free bit: `TYPE_CROSS_DEVICE_TAB = 1 << 27` is upstream's current last. A Chromium
# uprev that adds its own Type will take 28, and this rule's count=1 on the unique
# `TYPE_CROSS_DEVICE_TAB = 1 << 27,` line will then FAIL rather than silently colliding with it -- which is
# the signal to renumber, not a bug.
#
# The enum's own comment names three OTHER files that must change with it, and each has its own rule beside
# this one: omnibox_event.proto, AsOmniboxEventProviderType, TypeToString. DefaultOmniboxProviders is the
# fourth and is deliberately NOT touched -- see autocomplete_classifier.cc.yaml for why.
substitutions:
  - description: Add the Redrob agent provider type to AutocompleteProvider::Type.
    insert_after:
      anchor: '    TYPE_CROSS_DEVICE_TAB = 1 << 27,'
      count: 1
      lines: |
        TYPE_REDROB_AGENT = 1 << 28,
