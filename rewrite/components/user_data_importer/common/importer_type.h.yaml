# TYPE_CHROMIUM_BASED, the importer type the Chromium-family detection reports.

substitutions:
  # ---- hunk 0 run 1: 0 removed, 4 added
  - description: |
      The enumerator, appended so no existing value's number changes -- these are persisted.
    regex:
      pattern: "  TYPE_BOOKMARKS_FILE = 5,  // Identifies a 'bookmarks.html' file.\n"
      replace: "  TYPE_BOOKMARKS_FILE = 5,  // Identifies a 'bookmarks.html' file.\n  // Chrome, Edge, Brave, Vivaldi, Opera, Chromium -- anything that stores a profile in\n  // Chromium's own on-disk formats. Upstream has no importer for these at all; this fork's is\n  // at chrome/utility/importer/chromium_importer.h.\n  TYPE_CHROMIUM_BASED = 7,\n"
      count: 1
