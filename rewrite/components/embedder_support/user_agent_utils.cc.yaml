# Append a `Redrob/<version>` token to the user agent, AFTER Safari's and leaving `Chrome/` intact.
#
# Additive on purpose, and the reason is the reason this fork exists on a Chromium base at all: Korean
# banking and government sites sniff the user agent and refuse anything that does not look like Chrome.
# Replacing the Chrome token would reintroduce exactly the defect the base swap was meant to fix. Edge
# and Brave append their own token in this same position for this same reason.
#
# PRODUCT_VERSION is Chromium's version, not REDROB_VERSION, and that is deliberate -- see
# product_version() in scripts/redrob.py. A fork version here tells a sniffing site nothing it can act
# on, while the Chromium number beside it is the compatibility statement it is actually reading.

substitutions:
  - description: |
      Add our token to the UA assembly point. count 1 because there is one assembly point; if upstream
      restructures BuildUserAgentFromOSAndProduct the rule must be re-read, not force-applied -- a UA
      edit that lands in the wrong branch is invisible until a bank rejects the browser.
    regex:
      pattern: '"%s Safari/537.36",'
      replace: '"%s Safari/537.36 Redrob/" PRODUCT_VERSION,'
      count: 1
