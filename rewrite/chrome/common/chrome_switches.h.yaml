# `--redrob-task="..."`, the switch that starts an agent task from a terminal.
#
# With a browser already running the process singleton forwards it, which is how `redrob "..."` reaches the session the user is actually in. One way only -- the singleton channel ACKs and carries no payload back, so nothing is printed; the loopback RPC is the route when an answer has to reach the terminal.

