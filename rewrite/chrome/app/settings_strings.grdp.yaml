# the Settings strings shared with the official build, renamed from the shared preset.
#
# Thin on purpose. The protected-phrase list is in presets/short-name.yaml and is shared by every
# strings file, so a phrase added there protects this file too -- which is the whole reason it is not
# copied in here.

substitutions:
  - description: |
      Google Chrome -> Redrob where the browser speaks as itself, per presets/google-chrome.yaml. Runs before the short-name sweep, which protects Google Chrome.
    rename:
      preset: google-chrome
  - description: |
      Chrome -> Redrob across the Settings strings shared with the official build, leaving every phrase in presets/short-name.yaml alone.
    rename:
      preset: short-name
