# `man redrob-browser`: who makes it, where help is, where bugs go.
#
# Upstream's page says "the web browser from Google", sends help to Google's support site and bugs to
# a tracker that closed in 2016. Each was a false statement about this product. The authorship line
# keeps the Chromium authors, whose work this is built on.

substitutions:
  - description: |
      Name the publisher.
    regex:
      pattern: "@@PACKAGE \\- the web browser from Google\n"
      replace: "@@PACKAGE \\- the web browser from Redrob\n"
  - description: |
      Point help at our site instead of Google's help center.
    regex:
      pattern: "See the Google Chrome help center for help on using the browser.\n.IP\n<https://support.google.com/chrome/>\n"
      replace: "See the Redrob site for help on using the browser.\n.IP\n<https://redrob.ai/>\n"
  - description: |
      Point bug reports at our issue tracker, and drop the instructions for Chromium's old one.
    regex:
      pattern: "http://code.google.com/p/chromium/issues/list\n.PP\nBe sure to do your search within \"All Issues\" before reporting bugs,\nand be sure to pick the \"Defect on Linux\" template when filing a new one.\n"
      replace: "https://github.com/redrob-labs/redrob-browser/issues\n.PP\n"
  - description: |
      Name who publishes it, keeping the upstream authors it is built on.
    regex:
      pattern: "The Chromium team \\- <http://www.chromium.org>\n"
      replace: "Redrob \\- <https://redrob.ai/>, built on Chromium by The Chromium Authors \\- <https://www.chromium.org>\n"
