# chrome/app/resources/generated_resources_ko.xtb: the Korean translations, kept in step with the renamed English.
#
# A translation is keyed by a fingerprint of its English. Each strings file below has a rule that
# renames Chrome/Chromium to Redrob, which moves those fingerprints; without this file grit cannot find
# the Korean any more and shows the English. `rekey` copies each affected translation to its new id and
# renames the name inside it, and also renames the Korean where the English never named the product
# (it used a placeholder) but the translator wrote the name out.

substitutions:
  - description: |
      Re-key the Korean for chrome/app/generated_resources.grd, applying short-name-ko.
    rekey:
      source: chrome/app/generated_resources.grd
      presets: short-name-ko
  - description: |
      Re-key the Korean for chrome/app/settings_strings.grdp, applying google-chrome short-name-ko.
    rekey:
      source: chrome/app/settings_strings.grdp
      presets: google-chrome short-name-ko
  - description: |
      Re-key the Korean for chrome/app/password_manager_ui_strings.grdp, applying short-name-ko.
    rekey:
      source: chrome/app/password_manager_ui_strings.grdp
      presets: short-name-ko
  - description: |
      Re-key the Korean for chrome/app/glic_strings.grdp, applying short-name-ko.
    rekey:
      source: chrome/app/glic_strings.grdp
      presets: short-name-ko
