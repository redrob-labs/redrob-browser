# Sparkle settings for the macOS app bundle.
#
# Sparkle installs an update only when the archive's EdDSA signature verifies against SUPublicEDKey.
# The key here is OURS: its private half is the redrob-browser repository secret SPARKLE_ED_PRIVATE_KEY
# (public half: repository variable SPARKLE_ED_PUBLIC_KEY), and scripts/sparkle_appcast.py signs every
# release with it. Upstream's patch carried the upstream project's key, under which no update we publish
# would ever verify -- and any update THEY signed would, which is worse.
substitutions:
  - description: |
      Sparkle update settings and the product directory name, appended to the top-level dict. The
      public key is Redrob's; a changed key here must ship together with a re-signed appcast.
    regex:
      pattern: "</dict>\n</plist>"
      replace: "  <key>SUPublicEDKey</key>\n  <string>5lWrkUbHu7MqrCIW4bmFzx1KUoIqx8ugydJSAcAZXlQ=</string>\n  <key>SUEnableAutomaticChecks</key>\n  <true/>\n  <key>SUScheduledCheckInterval</key>\n  <integer>3600</integer>\n  <key>SUAllowsAutomaticUpdates</key>\n  <true/>\n  <key>SUAutomaticallyUpdate</key>\n  <true/>\n\t<key>CrProductDirName</key>\n\t<string>${BROWSEROS_PRODUCT_DIR_NAME}</string>\n</dict>\n</plist>"
      count: 1
  - description: |
      Finder's "Kind" for a .crx and a web-app shortcut, which named Chromium under our app.
    regex:
      pattern: "<string>Chromium Extension</string>"
      replace: "<string>Redrob Extension</string>"
  - description: |
      The same for the shortcut type.
    regex:
      pattern: "<string>Chromium Shortcut</string>"
      replace: "<string>Redrob Shortcut</string>"
