# the password manager UI, renamed from the shared preset.
#
# Thin on purpose. The protected-phrase list is in presets/product-name.yaml and is shared by every
# strings file, so a phrase added there protects this file too -- which is the whole reason it is not
# copied in here.

substitutions:
  - description: |
      Chromium -> Redrob across the password manager UI, leaving every phrase in presets/product-name.yaml alone.
    rename:
      preset: product-name
  - description: |
      Chrome -> Redrob, leaving every phrase in presets/short-name.yaml alone.
    rename:
      preset: short-name
