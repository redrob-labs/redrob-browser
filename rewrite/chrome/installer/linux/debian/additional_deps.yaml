# Korean font dependencies: the two things the bundled UI face does not carry.
#
# Measured rather than assumed. Pretendard covers all 11,172 precomposed Hangul syllables, so ordinary Korean needs nothing -- but it carries ZERO of the conjoining Jamo block and no Hanja, so Hanja in a document and NFD Hangul (the form macOS filenames use) had nothing to fall back to. On a minimal install that is tofu boxes in a Korean page.

substitutions:
  # ---- hunk 0 run 1: 0 removed, 14 added
  - description: |
      Add the fallback packages as recommends.
    regex:
      pattern: "# GTK is dlopen()'ed.  Versions 3 or 4 are supported."
      replace: "# Redrob: Korean, and the two things Pretendard does not carry.\n#\n# The bundled UI face covers all 11,172 precomposed Hangul syllables, so ordinary Korean needs no fallback at all\n# and renders in the brand face. It carries ZERO of the conjoining Jamo block (U+1100-11FF) and ZERO CJK Han, both\n# measured rather than assumed -- so Hanja in a document, and NFD Hangul, which is the form macOS puts in\n# filenames, had nothing to fall back to. On a minimal install that is tofu boxes in a Korean product.\n#\n# Noto Sans CJK KR covers 256/256 of the Jamo block and 20,976/20,992 Han, which is why this is the fix rather\n# than replacing Pretendard: swapping the company's global typeface to reach a block that only appears in\n# decomposed strings would cost the brand everywhere to solve it in one place.\n#\n# It is a large dependency, around 60 MB. That is the price of a Korean product that does not show boxes.\nfonts-noto-cjk\n\n# GTK is dlopen()'ed.  Versions 3 or 4 are supported."
      count: 1
