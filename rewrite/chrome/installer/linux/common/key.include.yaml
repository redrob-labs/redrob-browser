# The apt signing key the package embeds -- the security-critical half of the packaging.
#
# Upstream's key.include carries Google Inc's Linux Packages Signing Authority key, because upstream's
# package is Chrome and that is Chrome's key. A fork that inherits it writes GOOGLE's key to
# /usr/share/keyrings/redrob-browser.gpg and points apt at dl.google.com. That is not a branding miss:
# it is the package speaking for someone else about what is allowed to update this machine.
#
# So the whole file is replaced. It is a rule rather than a stored diff for one specific reason: the
# thing being deleted is a 4096-bit key blob, and upstream ROTATES it -- there are already three
# subkeys with three different expiry dates in the file this replaces. Every rotation moves those lines
# and conflicts a stored diff, for a change we do not care about, because we delete all of it either
# way. A rule replaces whatever blob is there and never conflicts; what it checks instead is the thing
# we DO care about, which is that the file still has the shape our packaging assumes.
#
# EMPTY IS THE DEFAULT AND IS SAFE. With no key, apt.include adds no source and says so on stderr. No
# auto-update is a documented gap; a foreign repository on a user's machine is a defect.
#
# scripts/update_signing_key.py REWRITES THIS FILE, not the checkout. Point it at an armoured public
# key and it fills the heredoc below, then plaster regenerates the patch. That keeps one generator:
# it used to write into the checkout for `export` to pick up, which is a second producer of a patch
# plaster already owns.
#
# Upstream's PGP_KEY_CHECKSUM and PGP_SUBKEYS are dropped with the rest. Only rpm.include reads them
# and this fork does not build an rpm (the target needs host rpm tooling that docs/BUILD.md rules out).
# If an rpm is ever built, they have to come back -- which is why they are named here rather than just
# being absent.

substitutions:
  - description: |
      Replace the file entirely, requiring the PGP_KEY_DATA heredoc to still be there exactly once. That
      count is the premise: if upstream renames the variable, moves to a binary keyring, or ships two
      keys, this fails and the packaging gets re-read. Without it the replacement would happily produce a
      file whose only reader, apt.include, no longer finds what it expects.
    regex:
      re_pattern: '\A.*?PGP_KEY_DATA=\$\(cat <<KEYDATA\n.*?\nKEYDATA\n\).*\Z'
      re_flags: [DOTALL]
      count: 1
      replace: |
        # Generated by scripts/update_signing_key.py. Do not edit directly.
        #
        # Redrob: EMPTY means the package configures NO apt repository and installs NO keyring -- see apt.include, which
        # refuses rather than proceeding. Upstream ships Google's signing key here; a fork that inherited it would put
        # Google's key and Google's repository on every machine that installed this package.
        PGP_KEY_DATA=$(cat <<KEYDATA
        KEYDATA
        )
