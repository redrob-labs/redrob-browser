# The install-time apt wiring: the half of the package that decides whether this machine gets updates.
#
# Two guards and two redirections. The guards are the important part and they are guards against US, not
# against the user: upstream reaches this code unconditionally because upstream always has both halves --
# Chrome's repository URL and Chrome's signing key. A fork that inherits the code and not the values
# either points apt at somebody else's repository or writes a source with no keyring. No auto-update is a
# documented gap; a foreign repository on a user's machine is a defect.
#
# Both guards live inside their function rather than at the call sites, because there are three call
# sites -- debian/postinst, debian/postinst_repo and repo.cron -- and a guard per call site is a guard
# somebody will add two of.
#
# Converting this from a stored diff also restores the file's trailing newline, which the hand-written
# patch deleted. That was an editing accident rather than a decision: nothing reads the last byte of a
# shell include, but `\ No newline at end of file` in a diff is a permanent invitation to wonder whether
# it mattered.

substitutions:
  - description: |
      install_key: an absent key means write NOTHING, not write nothing to a file. With PGP_KEY_DATA
      empty the body below is SILENT rather than failing -- `echo "" | base64 -d` exits 0 and produces
      zero bytes -- so the package still created /usr/share/keyrings and left an empty keyring on every
      machine that installed it. Nothing breaks today, because install_deb822_sources refuses to add a
      source referencing it; the problem is what the file CLAIMS. A keyring exists, so the first thing to
      add a sources file by hand or in a later version gets a signature failure instead of a channel that
      is cleanly and visibly off.
    regex:
      pattern: |
        install_key() {
          if [ ! -e /usr/share/keyrings ]; then
      replace: |
        install_key() {
          # Redrob: an absent key means write NOTHING, not write nothing to a file.
          #
          # Upstream reaches here unconditionally because upstream always has a key. With PGP_KEY_DATA empty the
          # body below is silent rather than failing -- `echo "" | base64 -d` exits 0 and produces zero bytes -- so
          # a fork with no key still created /usr/share/keyrings and left an empty keyring on every machine that
          # installed the package. Nothing breaks today, because install_deb822_sources refuses to add a source
          # that would reference it. The problem is what that file claims: a keyring exists, so the first thing to
          # add a sources file by hand or by a later version gets a signature failure instead of a channel that is
          # cleanly and visibly off.
          #
          # Guarded in the function rather than at the three call sites -- debian/postinst, debian/postinst_repo
          # and repo.cron -- because a guard per call site is a guard someone will add two of.
          if [ -z "$PGP_KEY_DATA" ]; then
            return 0
          fi

          if [ ! -e /usr/share/keyrings ]; then
      count: 1

  - description: |
      The repository URI comes from the packaging rather than being Google's hardcoded host. Left as
      upstream's literal this is the single line that would point every installed copy at dl.google.com.
    regex:
      pattern: 'URIs: https://dl.google.com/linux/chrome-@@channel/deb/'
      replace: 'URIs: @@repo_uri'
      count: 1

  - description: |
      The comment above create_sources_lists still said Google's repository, which after the line above
      is simply untrue. A stale comment on the function that edits apt sources is worth fixing.
    regex:
      pattern: '# Add the Google repository to the apt sources. The sources cannot be part of'
      replace: |-
        # Add OUR repository to the apt sources -- see @@repo_uri, derived in installer.py from the same
        # string as REPOCONFIG. The sources cannot be part of
      count: 1

  - description: |
      install_deb822_sources: refuse rather than configure a repository we cannot verify. Both values are
      turned on together by construction -- scripts/update_signing_key.py fills PGP_KEY_DATA and
      REPOCONFIG comes from the packaging -- and neither is useful without the other. It says so on
      stderr rather than returning silently, because a user who expected updates should be able to find
      out from the install log that they are off.
    regex:
      pattern: |
        install_deb822_sources() {
          find_apt_sources
      replace: |
        install_deb822_sources() {
          # Redrob: refuse rather than configure a repository we cannot verify.
          #
          # Upstream reaches here unconditionally because upstream always has both halves -- Chrome's repository URL and
          # Chrome's signing key. A fork that inherited those and left them unset would either point apt at somebody
          # else's repository or add a source with no keyring at all. No auto-update is a documented gap; a foreign
          # repository on a user's machine is a defect, so the absence of either value turns this off entirely.
          #
          # Both are turned on together, by construction: scripts/update_signing_key.py fills PGP_KEY_DATA, and
          # REPOCONFIG comes from the packaging. Neither is useful without the other.
          if [ -z "$REPOCONFIG" ] || [ -z "$PGP_KEY_DATA" ]; then
            echo "Redrob: no signed update channel is configured for this build, so no apt source was added." >&2
            return 0
          fi

          find_apt_sources
      count: 1
