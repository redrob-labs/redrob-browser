# The packaging script: where the update channel's URL and the package's version are decided.
#
# Four rewrites, and three of them are one fact each that upstream states in more than one place. That
# is what makes this worth being rules: every one of these was a case where fixing the OBVIOUS constant
# left a second copy behind, and the second copy was the one that mattered.
#
#   repoconfig      the sources line     -- overridden, and it was not enough
#   repo_uri        the deb822 URI       -- apt.include hardcoded this separately
#   repoconfigregex what postinst matches against -- built from the same base upstream, so overriding
#                   only the first left postinst matching Google's URL while writing ours
#
# All three now derive from ONE string, REDROB_REPO_BASE, and scripts/check_repo.py asserts that string
# agrees with where sign-and-publish.yml actually uploads the repository.

substitutions:
  - description: |
      Add the deb822 repo_uri field. apt.include hardcoded this URI separately from repoconfig, so fixing
      only repoconfig left the .sources file that apt actually READS still pointing at dl.google.com --
      two independent hardcodings of one fact, and the one that mattered more was not named REPOCONFIG.
    regex:
      pattern: |
        repoconfig: str = ""
            repoconfigregex: str = ""
      replace: |
        repoconfig: str = ""
            repoconfigregex: str = ""
            # Redrob: the deb822 URI, which apt.include hardcoded separately from repoconfig. Fixing only repoconfig left
            # the .sources file that apt actually reads still pointing at dl.google.com -- two independent hardcodings of
            # one fact, and the one that mattered more was the one not named REPOCONFIG.
            repo_uri: str = ""
      count: 1

  - description: |
      Populate repo_uri on the deb path, from the same base string as repoconfig. Scheme, host and path
      only: deb822 carries the suite and the components as their own fields. Anchored on the single
      _compute_deb_repoconfig call line, whose leading indentation is left untouched by matching from the
      closing paren onward.
    regex:
      pattern: ') = cls._compute_deb_repoconfig(args.arch, data["package_orig"])'
      replace: ") = cls._compute_deb_repoconfig(args.arch, data[\"package_orig\"])\n            # Scheme and host and path only: deb822 carries the suite and the components as their own fields, so\n            # the base string is split here rather than duplicated as a second constant.\n            data[\"repo_uri\"] = \"https://\" + InstallerConfig.REDROB_REPO_BASE.split()[0]"
      count: 1

  - description: |
      The package version becomes OURS with Chromium's after a plus. Upstream's value is Chromium's, which
      for Chrome is right and for a fork is a lie a user reads: `apt show` reported 153.0.8010.36 for a
      product whose release was 0.1.0 -- the exact confusion REDROB_VERSION exists to prevent, in the one
      place a package manager shows it. Kept as `<ours>+<chromium>` rather than ours alone because dropping
      upstream's deletes a security-relevant fact, and it orders correctly in both dimensions. Missing
      version file RAISES rather than defaulting, since a silent fallback lands exactly on the bug.
    regex:
      pattern: |
        data["versionfull"] = f"{data['version']}-{data['package_release']}"
      replace: |
        # Redrob: the package version is OURS, with Chromium's carried after a plus.
                #
                # Upstream's version here is Chromium's, which for Chrome is correct and for a fork is a lie a user
                # reads: `apt show` reported 153.0.8010.36 for a product whose release is 0.1.0, which is the exact
                # confusion REDROB_VERSION exists to prevent, in the one place a package manager shows it.
                #
                # `<ours>+<chromium>` rather than ours alone, because dropping Chromium's would delete a
                # security-relevant fact from the metadata -- which upstream release this binary carries is the first
                # thing an auditor asks. It also orders correctly in both dimensions: 0.2.0+153 > 0.1.0+154 because our
                # version dominates, and 0.1.0+153.0.8010.37 > 0.1.0+153.0.8010.36 for a security-only rebase.
                redrob_version_file = pathlib.Path(__file__).resolve().parent / "redrob-version.txt"
                if not redrob_version_file.exists():
                    raise RuntimeError(
                        f"{redrob_version_file} is missing; the package version would silently fall back to Chromium's "
                        f"{data['version']}, which is the thing this exists to prevent")
                redrob_version = redrob_version_file.read_text().strip()
                data["versionfull"] = (
                    f"{redrob_version}+{data['version']}-{data['package_release']}")
      count: 1

  - description: |
      Our repository base, and the regex derived from the SAME string. Upstream hardcodes
      dl.google.com/linux/chrome/deb, which was being inherited wholesale -- an installed redrob-browser
      added GOOGLE's repository to the user's apt sources, which is worse than having no update channel
      because it silently points a machine at a third party. The REGEX mattered as much as the URL:
      upstream builds it from the same hardcoded base, so overriding only REPOCONFIG left postinst
      matching Google's URL while writing ours, and the legacy-list migration and disable-on-distupgrade
      logic would never have recognised their own entry. The REPOCONFIG environment override is kept,
      because a staging channel is exactly what it is for.
    regex:
      pattern: |
        @staticmethod
            def _compute_deb_repoconfig(arch: str, package: str) -> tuple[str, str]:
                base_repo_config = "dl.google.com/linux/chrome/deb/ stable main"
                default = f"deb [arch={arch}] https://{base_repo_config}"
                repoconfig = os.environ.get("REPOCONFIG", default)

                repo_config_regex = f"deb (\\[arch=[^]]*\\b{arch}\\b[^]]*\\]"
                repo_config_regex += f"[[:space:]]*) https?://{base_repo_config}"
      replace: |
        # Redrob: our own channel, and the regex derived from the SAME base as the config line.
            #
            # Upstream hardcodes dl.google.com/linux/chrome/deb, which is correct for Chrome and was being inherited
            # wholesale: an installed redrob-browser added GOOGLE's Chrome repository to the user's apt sources. Worse
            # than having no update channel, because it silently points a machine at a third party.
            #
            # The regex mattered as much as the URL. Upstream builds it from the same hardcoded base, so overriding only
            # REPOCONFIG left postinst matching Google's URL while writing ours -- the legacy-list migration and the
            # disable-on-distupgrade logic would then never recognise their own entry. Both now come from one string.
            #
            # The environment override is kept, because a staging channel is exactly what it is for.
            REDROB_REPO_BASE = "cdn.redrob.ai/browser/apt stable main"

            @staticmethod
            def _compute_deb_repoconfig(arch: str, package: str) -> tuple[str, str]:
                base_repo_config = InstallerConfig.REDROB_REPO_BASE
                default = f"deb [arch={arch}] https://{base_repo_config}"
                repoconfig = os.environ.get("REPOCONFIG", default)

                # Escaped for the shell EREs in apt.include, where the base contains a path with slashes but no regex
                # metacharacters -- kept as a substitution rather than a literal so a change to the base cannot leave the
                # two out of step again.
                escaped = base_repo_config.replace(".", "\\.")
                repo_config_regex = f"deb (\\[arch=[^]]*\\b{arch}\\b[^]]*\\]"
                repo_config_regex += f"[[:space:]]*) https?://{escaped}"
      count: 1

  - description: |
      One shared name for where the agent server lives, used by both the artifact list and the strip check
      below, so the exemption can never name a different file from the one that is packaged.
    regex:
      pattern: |
        SANDBOX = 0o4755
      replace: |
        SANDBOX = 0o4755


        # Redrob: where the build puts the agent server, relative to $root_out_dir and to the install dir alike.
        AGENT_SERVER_BINARY = "BrowserOSServer/default/resources/bin/browseros_server"
      count: 1

  - description: |
      Package the agent server. The build copies it to $root_out_dir/BrowserOSServer and the browser launches
      it from the install dir, but upstream's artifact list never named it, so the .deb installed and every
      agent surface then sat on "Bundled server unavailable".
    regex:
      pattern: |
        "MEIPreload/preloaded_data.pb",
                            ArtifactType.RESOURCE,
                            StandardPermissions.REGULAR,
                        )
                    )

                return artifacts
      replace: |
        "MEIPreload/preloaded_data.pb",
                            ArtifactType.RESOURCE,
                            StandardPermissions.REGULAR,
                        )
                    )

                # Redrob: the agent server the side panel talks to. The build copies it to
                # $root_out_dir/BrowserOSServer and the browser launches it from <install_dir>/BrowserOSServer, but
                # upstream's list never named it, so a package installed fine and then every agent surface sat on
                # "Bundled server unavailable". Not optional: a package without it is a browser without its agent.
                # The tree is copied as a DIRECTORY (which resets every file to 0644), then the binary again with its
                # exec bit. strip stays False: the server is a self-contained bun executable and stripping corrupts it.
                server_dir = "BrowserOSServer"
                server_bin = AGENT_SERVER_BINARY
                artifacts.append(
                    Artifact(server_dir, server_dir, ArtifactType.DIRECTORY))
                artifacts.append(
                    Artifact(
                        server_bin,
                        server_bin,
                        ArtifactType.RESOURCE,
                        StandardPermissions.EXECUTABLE,
                    )
                )

                return artifacts
      count: 1

  - description: |
      Exempt exactly that one binary from the unstripped-ELF gate: a bun single-file executable carries its
      program in the ELF's trailing bytes, which strip(1) cuts off. Nothing else is exempt.
    regex:
      pattern: |
        if "not stripped" in output:
                                unstripped.append(path)
      replace: |
        if "not stripped" in output and not str(path).endswith(
                                AGENT_SERVER_BINARY
                            ):
                                # Redrob: the agent server is exempt, by its exact path only. It is a bun
                                # single-file executable whose JS payload lives in the ELF's trailing bytes,
                                # so strip(1) would cut the program out of it. Nothing else is exempt.
                                unstripped.append(path)
      count: 1
