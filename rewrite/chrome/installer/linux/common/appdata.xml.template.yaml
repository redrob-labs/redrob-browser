# The AppStream entry that software centers show for our .deb.
#
# Upstream's single screenshot is Google's (gstatic chrome-2.png), so GNOME Software and Discover
# showed Google Chrome as our product. We host no screenshot yet, and a screenshot is optional in
# AppStream, so the block goes rather than pointing at someone else's browser. installer.py still
# carries the URL field; nothing reads it once the template no longer does.

substitutions:
  - description: |
      Drop the screenshot, which is a picture of Google Chrome.
    regex:
      pattern: "  <screenshots>\n    <screenshot type=\"default\">\n      <image>@@appstream_screenshot_url</image>\n      <caption/>\n    </screenshot>\n  </screenshots>\n"
      replace: ""
