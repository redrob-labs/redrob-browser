# The packaging's identity: what apt, the desktop menu and the package manager all read.
#
# Rewritten in place rather than replaced by a redrob-browser.info, because installer.py chooses between
# google-chrome.info and chromium-browser.info on is_chrome_branded and a fork that is neither lands
# here. Adding our own file would have meant patching that choice too; putting our values where they are
# already read from leaves the logic alone.
#
# One rule per field, each count 1, so a field UPSTREAM RENAMES fails instead of silently keeping
# Chromium's value. That is the failure a stored diff could not report: the hunk would apply around the
# renamed field and the package would ship with `INSTALLDIR=/opt/chromium.org/chromium`, which is the one
# field where a miss puts a real Chromium install and ours at the same path on disk.
#
# WRITE NO APOSTROPHES into the comment block this inserts. installer.py parses the .info with
# shlex.split, which does NOT treat a leading hash as a comment: every word becomes a token and one
# apostrophe opens a quoted string that swallows the rest of the file. A comment with an ordinary English
# possessive in it made PACKAGE vanish and the deb build died on `KeyError: PACKAGE` forty seconds in,
# naming neither the file nor the quote.

substitutions:
  - description: |
      Replace upstream's header blurb with the note explaining why this file is edited in place, and the
      shlex/apostrophe warning that cost a build once.
    regex:
      pattern: |
        # This file provides common configuration information for building
        # chromium-browser packages for various platforms.
      replace: |
        # Redrob: upstream file, rewritten in place rather than replaced by a new one.
        #
        # installer.py chooses between google-chrome.info and chromium-browser.info on is_chrome_branded, so a fork that
        # is neither lands here. Adding a redrob-browser.info would have meant patching that choice too; putting our
        # values where they are already read from leaves the logic alone.
        #
        # WRITE COMMENTS HERE WITHOUT APOSTROPHES OR QUOTES. installer.py parses this file with shlex.split, which does
        # NOT treat a leading hash as a comment: every word becomes a token, and one apostrophe opens a quoted string
        # that swallows the rest of the file. A comment containing the word "upstreams" with an apostrophe in it made
        # PACKAGE vanish and the deb build died on KeyError: PACKAGE, forty seconds in, naming neither the file nor the
        # quote. Keep this block plain.
        #
        # Every field below is user-visible where apt, a desktop menu or a package manager shows it, and every one of
        # them said Chromium before this. INSTALLDIR mattered most: at /opt/chromium.org/chromium a real Chromium
        # install and ours are the same files on disk.
      count: 1

  - description: |
      The package name apt installs and upgrades by.
    regex:
      pattern: 'PACKAGE="chromium-browser"'
      replace: 'PACKAGE="redrob-browser"'
      count: 1

  - description: |
      PROGNAME stays `chrome`, and the note says why, because "it still says chrome" reads like a miss.
      The binary name is load-bearing across the sandbox helper, the launcher scripts and the crash
      handler, and renaming it buys a cosmetic win for a wide blast radius.
    regex:
      pattern: |
        # Filename of the main executable (for generating launcher scripts, etc.)
        PROGNAME=chrome
      replace: |
        # Filename of the main executable (for generating launcher scripts, etc.)
        # Still chrome. The binary name is load-bearing across the sandbox helper, the launcher scripts and the crash
        # handler, and renaming it buys a cosmetic win for a wide blast radius.
        PROGNAME=chrome
      count: 1

  - description: |
      Where the package installs. The field that matters most: at upstream's path a real Chromium
      install and ours are the same files on disk.
    regex:
      pattern: 'INSTALLDIR=/opt/chromium.org/chromium'
      replace: 'INSTALLDIR=/opt/redrob/redrob-browser'
      count: 1

  - description: |
      Device policy enrolment directory, which is read by enterprise tooling per product.
    regex:
      pattern: 'ENROLLMENTDIR=/etc/chromium/policies/enrollment'
      replace: 'ENROLLMENTDIR=/etc/redrob/policies/enrollment'
      count: 1

  - description: |
      The desktop menu entry the user sees.
    regex:
      pattern: 'MENUNAME="Chromium Web Browser"'
      replace: 'MENUNAME="Redrob Browser"'
      count: 1

  - description: |
      Package summary, describing what this browser is rather than what Chromium is.
    regex:
      pattern: 'SHORTDESC="The web browser from the Chromium projects"'
      replace: 'SHORTDESC="Browser with an agent that can act on the page"'
      count: 1

  - description: |
      Long description. Says what the product does, including the permission model, because this is the
      text a package manager shows before someone installs it.
    regex:
      pattern: 'FULLDESC="Chromium is a browser that combines a minimal design with sophisticated technology to make the web faster, safer, and easier."'
      replace: 'FULLDESC="Redrob is a Chromium-based browser whose sidebar carries an agent that can read, click, type and fill on the page you have open, under a permission model you choose per task."'
      count: 1

  - description: |
      Maintainer, product URL. Whoever a user reports a packaging problem to has to be us.
    regex:
      pattern: |
        # Package maintainer information.
        MAINTNAME="Chromium Linux Team"
        MAINTMAIL="chromium-packagers@chromium.org"
        PRODUCTURL="https://www.chromium.org/Home"
      replace: |
        # Package maintainer information. Confirmed by Janghoon.
        MAINTNAME="Redrob"
        MAINTMAIL="packages@redrob.ai"
        PRODUCTURL="https://redrob.ai/"
      count: 1

  - description: |
      PROJECT_LICENSE is left exactly as upstream has it, with a note saying that is deliberate. It
      describes the licences of the code IN THE BINARY, which this fork does not alter -- trimming it to
      look tidier would be a false statement about what is being shipped. Inserted BEFORE the line as a
      zero-width match, so the value itself is never part of this rewrite and cannot be reflowed.
    regex:
      re_pattern: '^(?=PROJECT_LICENSE=)'
      replace: "# Unchanged, deliberately: this describes the licences of the code in the binary, which the fork does not alter.\n# Trimming it to look tidier would be a false statement about what is being shipped.\n"
      re_flags: [MULTILINE]
      count: 1

  - description: |
      DEVELOPER_NAME is the packaging's authorship field, distinct from the copyright notice.
    regex:
      pattern: 'DEVELOPER_NAME="The Chromium Authors"'
      replace: 'DEVELOPER_NAME="Redrob"'
      count: 1

  - description: |
      Bug tracker and help URL: upstream's point at Chromium's own process, which cannot take our bugs.
    regex:
      pattern: 'BUGTRACKERURL="https://www.chromium.org/for-testers/bug-reporting-guidelines"'
      replace: 'BUGTRACKERURL="https://github.com/redrob-labs/redrob-browser/issues"'
      count: 1

  - description: |
      Help URL, same reason.
    regex:
      pattern: 'HELPURL="https://chromium.googlesource.com/chromium/src/+/main/docs/linux/debugging.md"'
      replace: 'HELPURL="https://github.com/redrob-labs/redrob-browser"'
      count: 1

  - description: |
      The reverse-DNS name. Desktop environments key window-to-launcher matching on it, so sharing
      upstream's would make our windows group under a Chromium icon.
    regex:
      pattern: 'RDN="org.chromium.Chromium"'
      replace: 'RDN="ai.redrob.Browser"'
      count: 1
