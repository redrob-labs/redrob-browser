# chrome://flags entries the vendored stack adds.

substitutions:
  - description: |
      Flag names and descriptions shown on chrome://flags.
    regex:
      pattern: "\"BrowserOS Alpha Features\";"
      replace: "\"Redrob Alpha Features\";"
      count: 1
  - description: |
      (continued)
    regex:
      pattern: "\"Enables BrowserOS alpha features.\";"
      replace: "\"Enables Redrob alpha features.\";"
      count: 1
  - description: |
      (continued)
    regex:
      pattern: "\"BrowserOS Keyboard Shortcuts\";"
      replace: "\"Redrob Keyboard Shortcuts\";"
      count: 1
  - description: |
      (continued)
    regex:
      pattern: "\"Enables BrowserOS keyboard shortcuts ("
      replace: "\"Enables Redrob keyboard shortcuts ("
      count: 1
