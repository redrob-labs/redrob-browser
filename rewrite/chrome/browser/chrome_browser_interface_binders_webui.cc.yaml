# Bind the three WebUI page handlers.

substitutions:
  # ---- hunk 0 run 1: 0 removed, 3 added
  - description: |
      The three headers.
    regex:
      pattern: "#include \"chrome/browser/ui/webui/segmentation_internals/segmentation_internals_ui.h\""
      replace: "#include \"chrome/browser/ui/webui/redrob/redrob_ui.h\"\n#include \"chrome/browser/ui/webui/redrob_onboarding/redrob_onboarding_ui.h\"\n#include \"chrome/browser/ui/webui/redrob_settings/redrob_settings_ui.h\"\n#include \"chrome/browser/ui/webui/segmentation_internals/segmentation_internals_ui.h\""
      count: 1
  # ---- hunk 1 run 2: 0 removed, 11 added
  - description: |
      The binders themselves, anchored on the line that closes the PRECEDING registration plus the blank
      after it. `RegisterWebUIControllerInterfaceBinder<` on its own occurs 34 times in this file, which
      is what a registration list looks like -- so the anchor has to be the neighbour, not the shape.
    regex:
      # NEITHER neighbour is unique (after=34, before=448). Anchor this one by hand.
      pattern: "      OptimizationGuideInternalsUI>(map);\n\n"
      replace: "      OptimizationGuideInternalsUI>(map);\n\n  RegisterWebUIControllerInterfaceBinder<redrob::mojom::PageHandlerFactory,\n                                        redrob::RedrobUI>(map);\n  RegisterWebUIControllerInterfaceBinder<redrob::settings::mojom::PageHandlerFactory,\n                                        redrob::RedrobSettingsUI>(map);\n\n  RegisterWebUIControllerInterfaceBinder<\n\n      redrob::onboarding::mojom::PageHandlerFactory,\n\n      redrob::RedrobOnboardingUI>(map);\n\n"
      count: 1
