# PA-5. The chrome-side declaration of the agent-task hook.
#
# This is the class that holds the Profile, which is the entire reason the hook lives on the
# client interface instead of the action holding a profile pointer itself.
substitutions:
  - description: Declare the agent-task hook on the chrome autocomplete provider client.
    regex:
      pattern: "  void IssueContextualSearchRequest(const GURL& destination_url,\n                                    AutocompleteMatchType::Type match_type,\n                                    bool is_zero_prefix_suggestion) override;\n"
      replace: "  void IssueContextualSearchRequest(const GURL& destination_url,\n                                    AutocompleteMatchType::Type match_type,\n                                    bool is_zero_prefix_suggestion) override;\n  void StartRedrobAgentTask(const std::u16string& prompt) override;\n"
      count: 1
