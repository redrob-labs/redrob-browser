# Register our profile preferences with the others.

substitutions:
  # ---- hunk 0 run 1: 0 removed, 1 added
  - description: |
      The header.
    regex:
      pattern: "#include \"chrome/browser/rlz/chrome_rlz_tracker_delegate.h\""
      replace: "#include \"chrome/browser/redrob/redrob_prefs.h\"\n#include \"chrome/browser/rlz/chrome_rlz_tracker_delegate.h\""
      count: 1
  # ---- hunk 1 run 2: 0 removed, 4 added
  - description: |
      The registration call.
    regex:
      pattern: "  registry->RegisterBooleanPref(prefs::kStaticStorageQuotaEnabled, false);\n"
      replace: "  registry->RegisterBooleanPref(prefs::kStaticStorageQuotaEnabled, false);\n\n  // Everything the agent keeps between runs, registered from one place so that the settings screen\n  // claiming to list all of it can be checked against a single file.\n  redrob::prefs::RegisterProfilePrefs(registry);\n"
      count: 1
