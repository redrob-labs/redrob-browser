# Three edits, one change: the grit header that names the manifest resource, the loader itself, and the
# call from the default set. Unconditional -- this extension is not behind a feature flag, because it IS
# the browser's settings, onboarding, side panel and new tab. Without it those surfaces do not exist.
#
# The loader is added by re-emitting the whole AddContextualTasksExtension function and appending ours
# after it, because the only operations here are anchored inserts and a closing brace is not a unique
# anchor. The upstream text is reproduced verbatim; a change to it upstream makes this rule fail to match,
# which is the correct outcome -- it is a conflict, and silence would be worse.
substitutions:
  - description: Include the vendored extension's generated resource ids.
    insert_after:
      anchor: '#include "chrome/grit/generated_resources.h"'
      count: 1
      lines: |
        #include "chrome/grit/redrob_extension_resources.h"
  - description: Load the Redrob component extension from the resource bundle.
    regex:
      count: 1
      pattern: |
        void ComponentLoader::AddContextualTasksExtension() {
          if (base::FeatureList::IsEnabled(
                  extensions_features::kApiContextualTasksPrivate)) {
            Add(IDR_CONTEXTUAL_TASKS_EXTENSION_MANIFEST_JSON,
                base::FilePath(FILE_PATH_LITERAL("contextual_tasks_extension")));
          }
        }
      replace: |
        void ComponentLoader::AddContextualTasksExtension() {
          if (base::FeatureList::IsEnabled(
                  extensions_features::kApiContextualTasksPrivate)) {
            Add(IDR_CONTEXTUAL_TASKS_EXTENSION_MANIFEST_JSON,
                base::FilePath(FILE_PATH_LITERAL("contextual_tasks_extension")));
          }
        }

        void ComponentLoader::AddRedrobExtension() {
          // The path is the resource_path prefix scripts/vendor_extension.py writes into every include in
          // chrome/browser/resources/redrob_extension/resources.grd. The two have to be the same string,
          // or the manifest loads and every file inside the extension 404s.
          Add(IDR_REDROB_EXTENSION_MANIFEST_JSON,
              base::FilePath(FILE_PATH_LITERAL("redrob_extension")));
        }
  - description: Add it to the default component extension set.
    insert_after:
      anchor: '  AddContextualTasksExtension();'
      count: 1
      lines: |
        AddRedrobExtension();
