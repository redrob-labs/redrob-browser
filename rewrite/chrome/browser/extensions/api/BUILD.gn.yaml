# Link our function's source_set into the browser. `function_registration("api_registration")` in this file
# reads the schema sources and auto-generates the factory registration, so no manual ExtensionFunctionRegistry
# edit is needed -- but the object files must be in the binary, which is what this public_deps entry does.
# Anchored on the passwords_private dep so redrob_private lands in alpha order (passwords < redrob < resources)
# in the enable_extensions branch.
substitutions:
  - description: Add the redrob_private source_set to api_implementations.
    insert_after:
      anchor: '      "//chrome/browser/extensions/api/passwords_private",'
      count: 1
      lines: |
        "//chrome/browser/extensions/api/redrob_private",
