# redrobPrivate has three KeyedServices whose factories must be registered with the
# BrowserContextDependencyManager here, or the dependency graph does not know they exist -- and for a
# service created WITH the browser context that shows up as a crash at startup rather than as a
# missing feature later.
#
# Two inserts, each anchored on the unique reading_list line it sorts immediately after
# (reading_list < redrob_private < sessions).
#
# Two stacks registered into these same two anchors -- the onboarding stack (import manager,
# onboarding service) and the agent stack (task event router) -- which was a deliberate collision: it
# produced a git conflict here instead of one rule overwriting the other and leaving a service
# silently missing from the graph. Resolved by keeping all three, in the group's alphabetical order.
substitutions:
  - description: Include the redrobPrivate service factory headers.
    insert_after:
      anchor: '#include "chrome/browser/extensions/api/reading_list/reading_list_event_router_factory.h"'
      count: 1
      lines: |
        #include "chrome/browser/extensions/api/redrob_private/redrob_private_import_manager_factory.h"
        #include "chrome/browser/extensions/api/redrob_private/redrob_private_onboarding_service_factory.h"
        #include "chrome/browser/extensions/api/redrob_private/redrob_private_task_event_router_factory.h"
  - description: Ensure the redrobPrivate service factories are built.
    insert_after:
      anchor: '  extensions::ReadingListEventRouterFactory::GetInstance();'
      count: 1
      lines: |
        extensions::RedrobPrivateImportManagerFactory::GetInstance();
        extensions::RedrobPrivateOnboardingServiceFactory::GetInstance();
        extensions::RedrobPrivateTaskEventRouterFactory::GetInstance();
