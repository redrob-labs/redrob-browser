# No product analytics to the upstream project's PostHog account.
#
# Upstream ships its own PostHog project keys and endpoint. An empty endpoint is an invalid GURL, so
# every send fails locally before any network request is made; removing the keys means our binary
# does not carry another project's credentials at all.
substitutions:
  - description: Drop the upstream PostHog project keys.
    regex:
      re_pattern: "(kBrowser(?:OS|Claw)PostHogApiKey =\\n    )\"phc_[A-Za-z0-9]+\""
      replace: "\\1\"\""
      count: 2
  - description: Empty endpoint, so no event leaves the machine.
    regex:
      pattern: "kPostHogEndpoint[] = \"https://us.i.posthog.com/i/v0/e/\""
      replace: "kPostHogEndpoint[] = \"\""
      count: 1
  - description: The traffic annotation must not claim a destination this build never contacts.
    regex:
      pattern: "\"PostHog analytics service at us.i.posthog.com\""
      replace: "\"None: this build sends no analytics (empty endpoint).\""
      count: 1
  # ---- upstream-branding sweep
  - description: |
      Annotation text for the metrics request. It named both upstream products.
    regex:
      pattern: "sender: \"BrowserOS Metrics\""
      replace: "sender: \"Redrob Metrics\""
      count: 1
  - description: |
      (continued)
    regex:
      pattern: "improve BrowserOS and BrowserClaw by showing"
      replace: "improve Redrob by showing"
      count: 1
