# Build-time product identity.

substitutions:
  - description: |
      Upstream left runtime product switching on (its own TODO says to turn it off before release).
      With it on, a switch or pref can turn this browser into the other upstream product, with that
      product's name, servers and profile. Off, the product is fixed at build time.
    regex:
      pattern: "  browseros_allow_runtime_product_override = true\n"
      replace: "  browseros_allow_runtime_product_override = false\n"
      count: 1
  - description: |
      macOS profile root (CrProductDirName). Mac has not shipped, so no install is orphaned, and the
      upstream value would share ~/Library/Application Support/BrowserOS with an upstream install.
    regex:
      pattern: "  browseros_product_dir_name = \"BrowserOS\"\n"
      replace: "  browseros_product_dir_name = \"Redrob\"\n"
      count: 1
