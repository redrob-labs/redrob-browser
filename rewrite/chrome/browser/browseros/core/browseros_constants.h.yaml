# Point the vendored stack's extension channel at Redrob's CDN, give the agent extension our id,
# and stop crash dumps going to the upstream project's Sentry account.
#
# Upstream hard-codes cdn.browseros.com: on first run the browser fetched extensions.json from it
# and installed that project's own Agent and Bug Reporter extensions. Our build of the agent is
# signed with Redrob's key, so its id is ours and the browser must ask for that id; the channel
# files live under cdn.redrob.ai/browser/extensions/, published by .github/workflows/agent-extension.yml.
# The Bug Reporter keeps its table entry but is never offered: our extensions.json does not list it.
substitutions:
  - description: Extension config and update manifests come from Redrob's CDN.
    regex:
      pattern: "https://cdn.browseros.com/extensions/"
      replace: "https://cdn.redrob.ai/browser/extensions/"
      count: 4
  - description: The agent extension is Redrob's build, signed with Redrob's key.
    regex:
      pattern: "kAgentExtensionId[] = \"bflpfmnmnokmjhmgnolecpppdbdophmk\""
      replace: "kAgentExtensionId[] = \"oikpnmkappjhkifbcieakjoeiknojbgg\""
      count: 1
  - description: No crash upload to the upstream project's Sentry. An empty URL makes crashpad keep dumps local.
    regex:
      re_pattern: "// Sentry crash reporting\n// https://[^\n]*\ninline constexpr char kSentryMinidumpUrl\\[\\] =\n    \"[^\"]*\"\n    \"[^\"]*\";"
      replace: "// Crash uploads are off: Redrob runs no crash collector yet.\ninline constexpr char kSentryMinidumpUrl[] = \"\";"
      count: 1
  # ---- upstream-branding sweep
  - description: |
      The virtual host the omnibox shows for the agent's pages: chrome://browseros/settings becomes
      chrome://redrob/settings. Both directions of the rewrite (content client and omnibox client)
      read this one constant.
    regex:
      pattern: "inline constexpr char kBrowserOSHost[] = \"browseros\";\n"
      replace: "inline constexpr char kBrowserOSHost[] = \"redrob\";\n"
      count: 1
