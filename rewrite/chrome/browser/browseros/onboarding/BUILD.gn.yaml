# The onboarding bundle ships only files the onboarding page uses.
#
# icon/keychain-prompt.png was a screenshot of a macOS keychain prompt naming the upstream project's
# other product. The page has drawn that step with CSS for a while and never loads the image, so it
# was dead weight in the pak with someone else's product name in it. The agent repository deleted the
# file; this keeps the resource list in step so the grd does not name a file that is not there.
substitutions:
  - description: Drop the unused keychain screenshot from the onboarding resources.
    regex:
      pattern: "  \"icon/keychain-prompt.png\",\n"
      replace: ""
      count: 1
