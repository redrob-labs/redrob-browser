# Network traffic annotations for the agent-server updater.

substitutions:
  - description: |
      Annotation text.
    regex:
      pattern: "sender: \"BrowserOS Server Updater\""
      replace: "sender: \"Redrob Agent Server Updater\""
      count: 2
  - description: |
      (continued)
    regex:
      pattern: "updates to the BrowserOS server component"
      replace: "updates to the Redrob agent server component"
      count: 1
  - description: |
      (continued)
    regex:
      pattern: "keeping BrowserOS server component up to date."
      replace: "keeping the Redrob agent server component up to date."
      count: 2
  - description: |
      (continued)
    regex:
      pattern: "new version of the BrowserOS server component."
      replace: "new version of the Redrob agent server component."
      count: 1
