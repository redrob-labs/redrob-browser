# Network traffic annotation for the agent-server health check.

substitutions:
  - description: |
      Annotation text.
    regex:
      pattern: "sender: \"BrowserOS Server Manager\""
      replace: "sender: \"Redrob Agent Server Manager\""
      count: 1
  - description: |
      (continued)
    regex:
      pattern: "if the BrowserOS MCP server is healthy"
      replace: "if the Redrob MCP server is healthy"
      count: 1
  - description: |
      (continued)
    regex:
      pattern: "health check for BrowserOS server functionality."
      replace: "health check for Redrob agent server functionality."
      count: 1
