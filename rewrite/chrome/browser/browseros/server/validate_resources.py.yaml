# Build-step messages from the agent-server resource check.

substitutions:
  - description: |
      Messages printed during the build.
    regex:
      pattern: "    print(f\"ERROR: Required BrowserOS resource not found: {resource_path}\")\n"
      replace: "    print(f\"ERROR: Required Redrob agent resource not found: {resource_path}\")\n"
      count: 1
  - description: |
      (continued)
    regex:
      pattern: "print(f\"BrowserOS resources validated ({len(required_resources)} resources)\")\n"
      replace: "print(f\"Redrob agent resources validated ({len(required_resources)} resources)\")\n"
      count: 1
  - description: |
      Redrob: the agent server executable is redrob-agent-server, the name the OS shows (macOS firewall prompt, Task Manager, ps).
    regex:
      pattern: "[\"bin/browseros_server\"]"
      replace: "[\"bin/redrob-agent-server\"]"
