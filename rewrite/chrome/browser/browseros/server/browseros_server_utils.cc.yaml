# Port availability is probed on the address the listeners actually bind.
#
# The proxy binds 127.0.0.1 (see browseros_server_proxy.cc.yaml). Probing 0.0.0.0 would reject a
# port that is only taken on some other interface and is free on loopback.
substitutions:
  - description: Probe the reusable-port case on loopback, matching the bind.
    regex:
      pattern: "\"0.0.0.0\", port,"
      replace: "\"127.0.0.1\", port,"
      count: 1
