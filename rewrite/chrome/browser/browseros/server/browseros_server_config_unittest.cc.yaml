# The config test pins the appcast URLs; keep it in step with browseros_server_config.cc.yaml.
substitutions:
  - description: Expected appcasts are Redrob's CDN.
    regex:
      pattern: "https://cdn.browseros.com/"
      replace: "https://cdn.redrob.ai/browser/"
      count: 4
  # ---- upstream-branding sweep
  - description: |
      Follows the log name.
    regex:
      pattern: "EXPECT_EQ(std::string_view(\"BrowserOS server\"), descriptor.log_name);"
      replace: "EXPECT_EQ(std::string_view(\"Redrob agent server\"), descriptor.log_name);"
      count: 1
