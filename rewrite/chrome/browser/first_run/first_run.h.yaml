# No terms-of-service dialog on first run.
#
# Chromium 155 shows a Linux EULA dialog on first run unless initial_preferences says
# "require_eula": false, and the default is true. A Chromium-branded build has no terms to show, so
# the dialog was a modal titled "Redrob Additional Terms of Service" whose body read "This Space
# Intentionally Blank" -- the first thing anyone saw, and it blocked the onboarding behind it.
#
# The default flips to false; the initial_preferences key still turns the dialog on, so a
# deployment that needs a EULA keeps that path.
substitutions:
  - description: Do not require the first-run EULA unless initial_preferences asks for it.
    regex:
      pattern: "  bool eula_required = true;\n"
      replace: "  bool eula_required = false;\n"
      count: 1
