# The Linux icon name the browser asks the desktop for.
#
# installer.py installs the icon under PACKAGE (`redrob-browser`). Upstream's Chromium branch asks for
# `chromium-browser`, so a machine without Chromium shows a generic icon for app shortcuts and
# notifications, and a machine with Chromium shows Chromium's.

substitutions:
  - description: |
      Ask for the icon our package installs.
    regex:
      pattern: "#else  // BUILDFLAG(CHROMIUM_BRANDING)\n  return \"chromium-browser\";\n"
      replace: "#else  // BUILDFLAG(CHROMIUM_BRANDING)\n  // Redrob: the icon name our .deb installs, see installer.py.\n  return \"redrob-browser\";\n"
