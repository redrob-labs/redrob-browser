# Windows browser updates must come from Redrob's CDN, never from the upstream project's appcast:
# otherwise WinSparkle would replace this browser with theirs.
substitutions:
  - description: WinSparkle appcasts come from Redrob's CDN.
    regex:
      pattern: "https://cdn.browseros.com/"
      replace: "https://cdn.redrob.ai/browser/"
      count: 4
  # ---- upstream-branding sweep
  - description: |
      WinSparkle's registry key and the app name its update dialog shows.
    regex:
      pattern: "constexpr char kRegistryPath[] = \"Software\\\\BrowserOS\\\\WinSparkle\";"
      replace: "constexpr char kRegistryPath[] = \"Software\\\\Redrob\\\\WinSparkle\";"
      count: 1
  - description: |
      (continued)
    regex:
      pattern: "win_sparkle_set_app_details(L\"BrowserOS\",\n"
      replace: "win_sparkle_set_app_details(L\"Redrob\",\n"
      count: 1
  - description: |
      (continued)
    regex:
      pattern: "is_claw ? L\"BrowserOS neo\" : L\"BrowserOS\","
      replace: "is_claw ? L\"BrowserOS neo\" : L\"Redrob\","
      count: 1
