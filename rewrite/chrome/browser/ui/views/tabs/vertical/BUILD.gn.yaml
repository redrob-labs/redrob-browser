substitutions:
  - description: |
      Our sidebar headers join :vertical, which is the headers-only half of the split upstream uses in this
      directory.
    regex:
      re_pattern: '(source_set\("vertical"\) \{\n  sources = \[[\s\S]*?\n  \])'
      replace: |-
        \1

          sources += redrob_vertical_tabs_headers

  - description: |
      Our sidebar implementations join :impl, the other half.
    regex:
      re_pattern: '(source_set\("impl"\) \{\n  sources = \[[\s\S]*?\n  \])'
      replace: |-
        \1

          sources += redrob_vertical_tabs_impl_sources

  - description: |
      And what those implementations need. Appended after upstream's own deps list, wildcarded, so an
      upstream dependency change cannot break the anchor. One of ours orders a GENERATED header before the
      compile -- see the comment on the list in redrob/build/sources.gni.
    regex:
      re_pattern: '(source_set\("impl"\) \{[\s\S]*?\n  deps = \[[\s\S]*?\n  \])'
      replace: |-
        \1

          deps += redrob_vertical_tabs_impl_deps
