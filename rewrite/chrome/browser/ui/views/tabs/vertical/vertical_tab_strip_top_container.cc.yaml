# The top of the vertical tab strip: one button hidden, two positions corrected.
#
# All three are measurements rather than preferences, and the measurements are in the inline comments so
# they survive next to the code they justify.

substitutions:
  # ---- hunk 0: 0 removed, 7 added
  - description: |
      Hide the combo button rather than not building it. Its two actions -- tab search and new tab -- are drawn
      in the sidebar's header row instead, which is where the reference puts them. HIDDEN and not removed
      because it still owns the tab-search host's observation and BrowserView reaches for `end_button()` with no
      null check; an invisible child is skipped by layout, so no caller has to be audited on every version bump.
    regex:
      pattern: "                                      : views::LayoutOrientation::kHorizontal);"
      replace: "                                      : views::LayoutOrientation::kHorizontal);\n  // Redrob: built and hidden. Its two actions -- tab search and new tab -- are drawn in the sidebar's\n  // header row beside the workspace name, which is where the reference puts them, and two ways to open tab\n  // search in one column is two things to keep in step. It is HIDDEN rather than not built because it\n  // still owns the tab-search host's observation and BrowserView reaches for `end_button()` without a null\n  // check; an invisible child is skipped by the layout, so the row is right and no caller has to be\n  // audited on every version bump.\n  combo_button_->SetVisible(false);"
      count: 1
  # ---- hunk 1: 3 removed, 8 added
  - description: |
      Centre the button when collapsed. Upstream's `is_collapsed ? 0 : centre` is backwards for this shell:
      measured on the 56px rail, the favicon centred at 27.5 and this button's ink sat at 23.0, 4.5px left of
      everything stacked above it.

      The pattern carries the `collapse_button_->GetPreferredSize()` line above it, and has to: the
      three lines being replaced appear TWICE in this function, identically, for unfocus_button_ and
      for collapse_button_. Only the second is ours. The count found 2 and refused, which is the
      whole argument for declaring one -- a stored diff applied to the first block would have moved
      the wrong button and nothing would have failed.
    regex:
      pattern: "      const gfx::Size pref_size = collapse_button_->GetPreferredSize();\n      int x = is_collapsed\n                  ? 0\n                  : std::max(0, (host_size.width() - pref_size.width()) / 2);"
      replace: "      const gfx::Size pref_size = collapse_button_->GetPreferredSize();\n      // Redrob: CENTRED when collapsed, not pinned to 0.\n      //\n      // Upstream's `is_collapsed ? 0 : centre` is backwards for this shell. Measured on the collapsed rail\n      // before the change: the rail is 56px wide (x 0..55, so its true centre is 27.5), the tab favicon's ink\n      // centred correctly at 27.5, and this button's ink sat at 23.0 -- 4.5px left of everything it is stacked\n      // above. Expanded there is a 240px row and a leading edge to align to; collapsed there is only a column\n      // of glyphs, and the one thing they can agree on is the middle.\n      int x = std::max(0, (host_size.width() - pref_size.width()) / 2);"
      count: 1
  # ---- hunk 2: 1 removed, 13 added
  - description: |
      Put the collapse toggle at the TRAILING edge, matching the reference's top-right placement. Upstream
      anchors it left beside the caption buttons, which here leaves it directly above the workspace name and
      reads as part of that row. It reads the same padding constant as the strip rather than a number of its own,
      so that if the hidden combo button ever returns the collision is visible in one place.

      Same duplication as the hunk above, for the same reason: `gfx::Rect bounds(left_alignment,`
      appears twice, and the pattern carries the collapse_button_ line to pick ours.
    regex:
      pattern: "      const gfx::Size pref_size = collapse_button_->GetPreferredSize();\n      gfx::Rect bounds(left_alignment,"
      replace: "      const gfx::Size pref_size = collapse_button_->GetPreferredSize();\n      // Redrob: TRAILING, not leading. The reference puts the sidebar's collapse toggle at the column's\n      // top-RIGHT -- its glyph measures x 226..241 in a 254px column, so the button's own right edge sits at\n      // the strip's horizontal padding. Upstream anchors it left, beside the caption buttons, which on this\n      // product leaves it directly above the workspace name and reads as part of that row.\n      //\n      // The trailing slot is free because the combo button that used to occupy it is hidden -- see the\n      // constructor. If that ever comes back the two would collide, which is why this reads the same\n      // padding constant rather than a number of its own.\n      const int trailing_x = std::max(\n          left_alignment,\n          host_size.width() - pref_size.width() -\n              GetLayoutConstant(LayoutConstant::kVerticalTabStripHorizontalPadding));\n      gfx::Rect bounds(trailing_x,"
      count: 1
