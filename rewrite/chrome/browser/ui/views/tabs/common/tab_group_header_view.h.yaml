substitutions:
  - description: |
      Declare the two methods whose bodies live in the chromium_src override beside this rule. A member
      cannot be introduced from an override, so these three lines are a real upstream edit.
    regex:
      pattern: 'void OnDataChanged(const tabs::TabGroupData& tab_group_data);'
      replace: |-
        void OnDataChanged(const tabs::TabGroupData& tab_group_data);

          // Redrob: the vertical row's tab count. Called from Layout as well as OnDataChanged, because the group's
          // data observer does not fire on a tab count change.
          void UpdateTabCountLabel();
          void Layout(PassKey key) override;

  - description: |
      Test accessors for the two children, alongside the one upstream already exposes for the chevron.
    regex:
      pattern: 'views::ImageView* collapse_icon_for_testing() { return collapse_icon_; }'
      replace: |-
        views::ImageView* collapse_icon_for_testing() { return collapse_icon_; }
          views::ImageView* leading_mark_for_testing() { return leading_mark_; }
          views::Label* tab_count_label_for_testing() { return tab_count_label_; }

  - description: |
      The two children themselves. Not const, unlike upstream's neighbours, because they are built only in
      the vertical strip and stay null in the horizontal one.
    regex:
      pattern: 'const raw_ptr<views::ImageView> collapse_icon_ = nullptr;'
      replace: |-
        const raw_ptr<views::ImageView> collapse_icon_ = nullptr;
          // Redrob: vertical-only, null in the horizontal strip.
          raw_ptr<views::ImageView> leading_mark_ = nullptr;
          raw_ptr<views::Label> tab_count_label_ = nullptr;
