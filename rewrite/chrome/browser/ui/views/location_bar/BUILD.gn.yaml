# CAP-3. Compile the address bar's agent-mode chip with the location bar that lays it out.
#
# In this target rather than in a list of ours: location_bar_view.cc includes the chip's header, and a
# header from another target would need that target as a dep of this one -- the same one-line edit,
# made somewhere further from the code that uses it.
substitutions:
  - description: Add the agent-mode chip beside the keyword chip it mirrors.
    insert_after:
      anchor: '      "selected_keyword_view.cc",'
      count: 1
      lines: |
        "redrob_agent_chip.cc",
        "redrob_agent_chip.h",
  - description: |
      The chip's label and tooltip are the product's own strings; the grit header is generated, so this
      dep is what makes it exist before the compile. The agent provider's header is already reachable
      through //components/omnibox/browser.
    insert_after:
      anchor: '      "//chrome/browser/ui/views/zoom",'
      count: 1
      lines: |
        "//chrome/browser/redrob/resources:redrob_strings",
