# Pinned toolbar buttons draw in the theme's icon colours.

substitutions:
  - description: |
      Upstream painted the third-party LLM (Chat) button a fixed orange, its own brand colour,
      in every theme. Removing the special case gives it the same normal, hovered, pressed and
      engaged colours as every other pinned button, which the colour pipeline already themes.
    regex:
      pattern: "  // Special case for Third Party LLM - use custom orange color\n  if (action_id_ == kActionSidePanelShowThirdPartyLlm) {\n    const SkColor orange = SkColorSetRGB(0xFB, 0x65, 0x18);\n    UpdateIconsWithColors(icon, orange, orange, orange,\n                          GetForegroundColor(ButtonState::STATE_DISABLED));\n  } else if (is_icon_visible_ && action_engaged_) {\n"
      replace: "  if (is_icon_visible_ && action_engaged_) {\n"
      count: 1
