substitutions:
  - description: |
      Add our first-run flow controller to the same branch upstream's own lives in. One line, and it never
      changes again -- the file NAMES are in redrob/build/sources.gni, so adding another one is an edit to a
      file we own rather than a re-export of this patch.
    regex:
      # Chromium 155 moved the dice branch's files into their own targets, so the branch carries `deps`
      # and no longer a `sources` list to append to. Anchored on the first two dep lines, which are the
      # one occurrence of that pair in the file -- `enable_dice_support` itself appears four times and
      # the single dep names appear two or three times each.
      re_pattern: |-
        if \(enable_dice_support\) \{
              deps \+= \[
                "webui/signin/batch_upload:mojo_bindings",
                "//chrome/browser/ui/views/profiles:cross_device_signin_qr_bubble_views",
      replace: |-
        if (enable_dice_support) {
              sources += redrob_chrome_browser_ui_dice_sources
              deps += redrob_chrome_browser_ui_deps
              deps += [
                "webui/signin/batch_upload:mojo_bindings",
                "//chrome/browser/ui/views/profiles:cross_device_signin_qr_bubble_views",
