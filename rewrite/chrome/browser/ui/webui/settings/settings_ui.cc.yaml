# chrome://settings: the "AI in <brand>" surface is off, unconditionally.
#
# Two places, and the second is the one that makes it stick. The constructor's booleans decide what the
# page renders at load; UpdateShowGlicState() runs LATER and pushed them back to true at runtime, so
# suppressing only the constructor gave a page that was absent until Glic's own first-run was accepted
# and then reappeared in a shipped build.
#
# This is not a branding change. The rows advertised features we do not ship -- AI history search,
# "Skills in Redrob", Indigo, Google Drive and Workspace connection -- but the disqualifying part was the
# disclosure above them, which said under OUR name that data is sent to Google and may be read by human
# reviewers. Both are false here: the agent talks to whichever provider the user configured, which
# sidecar_client.cc states goes to that provider "not to Google and not to Redrob". A privacy claim that
# is wrong against the user is the one kind that cannot be left to a later cleanup.

substitutions:
  - description: |
      Force every AI-page boolean false AFTER upstream's own calls, rather than rewriting each condition.
      An AI boolean added upstream in a later rebase then lands above this block and is still overridden --
      which is the opposite of what editing the conditions would give, where a new one arrives switched on.
    insert_after:
      anchor: '                          show_ai_features_section);'
      count: 1
      lines: |

        // Redrob: the whole "AI in <brand>" settings surface is OFF, unconditionally.
        //
        // It is upstream's page for GOOGLE's AI features, and brand substitution made every one of them read as
        // ours. Measured in a built binary before this: chrome://settings carried an "AI in Redrob" section whose
        // rows were AI history search, AI suggestions, "Skills in Redrob", "Indigo -- Manage your Indigo data", and
        // "Google 검색 AI 모드 및 연결된 앱" offering to connect Google Drive and Workspace. This product ships none
        // of them.
        //
        // The disqualifying part is not the advertising, it is the disclosure above the rows. It stated, under our
        // name, that "관련 데이터가 Google로 전송됩니다" beside a Google logo, and then in English that "Data sent to
        // Google may be seen by human reviewers to improve Redrob AI's technology". Both are FALSE here: this
        // browser's agent talks to whichever provider the user configured -- see sidecar_client.cc, which says the
        // request goes to that provider "not to Google and not to Redrob" -- and no Google reviewer sees any of it.
        // A privacy claim that is wrong in the user's favour is still a lie, and this one is wrong against them.
        //
        // Set after the calls above rather than by rewriting each condition, so an AI boolean added upstream in a
        // later rebase lands ABOVE this block and is still overridden. Our own agent settings live at
        // chrome://redrob-settings, which is where a Redrob AI control belongs.
        html_source->AddBoolean("showAiPage", false);
        html_source->AddBoolean("showAiPageAiFeatureSection", false);
        html_source->AddBoolean("showGlicSettings", false);
        html_source->AddBoolean("enableAiModeSearchSetting", false);
        html_source->AddBoolean("showOnDeviceAiSettings", false);
      indent: 2

  - description: |
      Stop reading ShouldShowSettingsPage(). Leaving the call and ignoring its result would leave a reader
      wondering which of the two decides, and the compiler warning about the unused local is the honest
      signal that the value has no consumer any more.
    regex:
      pattern: '  const bool show_glic = enablement.ShouldShowSettingsPage();'
      replace: '  // ShouldShowSettingsPage() is deliberately not read: this browser never shows that page.'
      count: 1

  - description: |
      The runtime update keeps showGlicSettings false. This is the half that makes the suppression hold:
      without it, accepting Glic's first-run flips this and showAiPage back to true after load. Written as
      a quoted scalar rather than a block, because every line here needs the file's own two-space indent
      and a block scalar strips exactly that.
    regex:
      pattern: '  update.Set("showGlicSettings", show_glic);'
      replace: "  // Redrob: stays false, matching the constructor's unconditional suppression of the AI settings surface --\n  // see the block there for why. Without this, accepting Glic's own first-run would push showGlicSettings and\n  // showAiPage back to true at runtime and the page would reappear in a shipped build.\n  update.Set(\"showGlicSettings\", false);"
      count: 1

  - description: |
      Drop the branch that re-enabled showAiPage at runtime. Nothing should set it true, and `show_glic`
      no longer exists to test. The leading indent and the trailing newline are part of the pattern, so the
      three lines go away completely rather than leaving a line of whitespace behind.
    regex:
      pattern: "  if (show_glic) {\n    update.Set(\"showAiPage\", true);\n  }\n"
      replace: ''
      count: 1
