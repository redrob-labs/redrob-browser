substitutions:
  - description: |
      Register our three WebUI configs. Both this target and the controller factory below need the same
      three, and they get the same list -- adding a fourth page is then one edit in
      redrob/build/sources.gni rather than two patch edits that can drift apart.
    regex:
      re_pattern: '(source_set\("configs"\) \{[\s\S]*?\n  deps = \[[\s\S]*?\n  \])'
      replace: |-
        \1

          deps += redrob_chrome_browser_ui_webui_deps

  - description: |
      The same three for the controller factory, which is what actually resolves a chrome:// URL to a page.
    regex:
      re_pattern: '(source_set\("chrome_web_ui_controller_factory"\) \{[\s\S]*?\n  deps = \[[\s\S]*?\n  \])'
      replace: |-
        \1

          deps += redrob_chrome_browser_ui_webui_deps
