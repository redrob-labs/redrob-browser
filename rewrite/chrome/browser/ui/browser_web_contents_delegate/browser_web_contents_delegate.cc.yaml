# Do not focus the omnibox on our new tab: the prompt field should hold the caret.
#
# Upstream focuses the omnibox on the NTP because there the NTP's search box IS the omnibox. Here they are two different fields, so focusing the wrong one sends the first thing you type to a search engine instead of to the agent.

substitutions:
  # ---- hunk 0 run 1: 0 removed, 11 added
  - description: |
      Return false for our host, BEFORE the kChromeUINewTabHost branch. Order is load-bearing: our page is reached through chrome://newtab, which stays the entry's VIRTUAL url, so the later branch would recognise it as the new tab page and answer true.
    regex:
      pattern: "    if ((url.SchemeIs(content::kChromeUIScheme) &&"
      replace: "    // Redrob: the new tab IS the AI composer, and its prompt field is what should hold the caret.\n    // Upstream focuses the omnibox on the NTP because the NTP's search box IS the omnibox; here they are\n    // two different fields, so focusing the wrong one sends the first thing you type to a search engine\n    // instead of to the agent. This has to come BEFORE the kChromeUINewTabHost branch below: our surface\n    // is reached through chrome://newtab, which stays the entry's VIRTUAL url, so that branch would see a\n    // new tab page and answer true.\n    if (url.host() == chrome::kChromeUIRedrobHost ||\n        virtual_url.host() == chrome::kChromeUIRedrobHost) {\n      return false;\n    }\n\n    if ((url.SchemeIs(content::kChromeUIScheme) &&"
      count: 1
