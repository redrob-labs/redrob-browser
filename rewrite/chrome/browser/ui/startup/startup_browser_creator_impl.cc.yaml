# `--redrob-task="..."` opens that task instead of the session.
#
# Someone who typed a task in a terminal is asking for that task, not for their session to be restored around
# it. The prompt travels in the URL and the surface starts it, which keeps ONE StartTask path -- with its
# bounds and its permission gate -- rather than a second one here.

substitutions:
  # ---- hunk 0 run 1: 0 removed, 1 added
  - description: |
      The URL escaping the prompt needs.
    regex:
      pattern: "#include \"chrome/common/chrome_switches.h\""
      replace: "#include \"base/strings/escape.h\"\n#include \"chrome/common/chrome_switches.h\""
      count: 1
  # ---- hunk 1 run 2: 0 removed, 15 added
  - description: |
      Handle the switch before the ordinary startup tabs are computed, and only when it carries a value.
    regex:
      pattern: "    bool whats_new_enabled) {\n"
      replace: "    bool whats_new_enabled) {\n  // `--redrob-task=\"...\"` wins over everything else this launch would have opened: someone who\n  // typed a task in a terminal is asking for that task, not for their session to be restored\n  // around it. The prompt travels in the URL and the surface starts it, which keeps one\n  // StartTask path -- with its bounds and its permission gate -- rather than a second one here.\n  if (command_line_->HasSwitch(switches::kRedrobTask)) {\n    const std::string prompt =\n        command_line_->GetSwitchValueASCII(switches::kRedrobTask);\n    if (!prompt.empty()) {\n      return {StartupTabs({StartupTab(GURL(std::string(chrome::kChromeUIRedrobURL) +\n                                           \"?ask=\" +\n                                           base::EscapeQueryParamValue(prompt, false)))}),\n              LaunchResult::kWithGivenUrls};\n    }\n  }\n\n"
      count: 1
