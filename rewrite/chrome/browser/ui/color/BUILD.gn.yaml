substitutions:
  - description: |
      Add our colour mixer to :mixers. Appended AFTER upstream's list rather than inserted into it, so an
      upstream addition to that list cannot move our anchor -- the list body is wildcarded on purpose.
    regex:
      re_pattern: '(source_set\("mixers"\) \{\n  sources = \[[\s\S]*?\n  \])'
      replace: |-
        \1

          sources += redrob_chrome_browser_ui_color_sources
