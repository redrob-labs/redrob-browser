substitutions:
  - description: |
      Make our composer the new tab page. Anchored on BOTH neighbours, because the placement is the whole
      point: returning AFTER the off-the-record branch is what leaves incognito on Chromium's own NTP, and
      a rewrite that landed before it would change that silently.
    regex:
      re_pattern: '(return NewTabURLDetails\(GURL\(\), NEW_TAB_URL_INCOGNITO\);\n    \}\n\n)(#if BUILDFLAG\(IS_ANDROID\))'
      replace: |-
        \1    // Redrob: the AI surface is the new tab page. This is the whole reason the composer is a WebUI --
            // reaching it by typing chrome://redrob is the unwired state, not the product. Off-the-record
            // windows keep Chromium's incognito NTP above, deliberately: an agent surface that offered to run
            // tasks in a window whose whole promise is leaving no trace would be lying about which it is.
            return NewTabURLDetails(GURL(chrome::kChromeUIRedrobURL), NEW_TAB_URL_VALID);

        \2
