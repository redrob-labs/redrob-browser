# Our sources in the chrome target, through the shared .gni list.

substitutions:
  # ---- hunk 0 run 1: 0 removed, 5 added
  - description: |
      The dependency.
    regex:
      pattern: "      \":aperitif_library\","
      replace: "      # Redrob: the UI font, which has to be INSIDE the framework. DIR_MODULE for the browser process on macOS is\n      # the versioned framework directory, so a font copied to the build root is both unreadable at runtime and\n      # unshipped. A bundle_data that no bundle depends on builds green and copies nothing, so this line is the\n      # one that makes the target real.\n      \"//chrome/browser/redrob:ui_font_bundle_data\",\n      \":aperitif_library\","
      count: 1
  - description: |
      Redrob: link the browser executable as redrob-browser.exe on Windows.
    regex:
      pattern: "    _chrome_output_name = \"initialexe/chrome\"\n"
      replace: "    # Redrob: the Windows executable is redrob-browser.exe.\n    _chrome_output_name = \"initialexe/redrob-browser\"\n"
  - description: |
      The import-reorder step reads and writes the renamed executable.
    regex:
      pattern: "      \"$root_out_dir/initialexe/chrome.exe\",\n      \"$root_out_dir/initialexe/chrome.exe.pdb\",\n"
      replace: "      \"$root_out_dir/initialexe/redrob-browser.exe\",\n      \"$root_out_dir/initialexe/redrob-browser.exe.pdb\",\n"
  - description: |
      The same for its outputs.
    regex:
      pattern: "      \"$root_out_dir/chrome.exe\",\n      \"$root_out_dir/chrome.exe.pdb\",\n"
      replace: "      \"$root_out_dir/redrob-browser.exe\",\n      \"$root_out_dir/redrob-browser.exe.pdb\",\n"
