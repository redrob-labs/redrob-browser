# Pack our locale strings into the same .pak as everything else.

substitutions:
  # ---- hunk 0 run 1: 0 removed, 4 added
  - description: |
      Our grd in the input list.
    regex:
      pattern: "      \"${root_gen_dir}/chrome/generated_resources_\","
      replace: "      # Redrob's own strings. Without this line the per-locale pak is built and then not folded into\n      # <locale>.pak, so every IDS_REDROB_* resolves to English at runtime while the build stays green\n      # -- the whole point of this fork's l10n is that this line exists.\n      \"${root_gen_dir}/chrome/browser/redrob/resources/redrob_strings_\",\n      \"${root_gen_dir}/chrome/generated_resources_\","
      count: 1
  # ---- hunk 1 run 2: 0 removed, 1 added
  - description: |
      The matching dependency.
    regex:
      pattern: "      \"//components/omnibox/resources:omnibox_pedal_synonyms\","
      replace: "      \"//chrome/browser/redrob/resources:redrob_strings\",\n      \"//components/omnibox/resources:omnibox_pedal_synonyms\","
      count: 1
