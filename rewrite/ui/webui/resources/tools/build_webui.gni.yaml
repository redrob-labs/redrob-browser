# Let a build_webui target opt into our shared WebUI assets.

substitutions:
  # ---- hunk 0 run 1: 0 removed, 6 added
  - description: |
      The hook.
    regex:
      pattern: "      \"*.svg\",\n"
      replace: "      \"*.svg\",\n\n      # A webfont is binary exactly like the image types above, so running the text\n      # preprocessor over it fails on the first byte that is not valid UTF-8. This list was\n      # simply missing the case; nothing about it is specific to one page's font.\n      \"*.woff\",\n      \"*.woff2\",\n"
      count: 1
