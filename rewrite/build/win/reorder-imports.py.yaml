# Redrob: the Windows browser executable is redrob-browser.exe, not chrome.exe.
#
# Upstream names it chrome.exe on every build, branded or not. The portable zip used to ship a copy
# under our name beside the original, and Task Manager, the file's properties and the firewall all
# said chrome.exe. Every place that names the file is one rule in this set; chrome.dll keeps its name
# because nothing user-facing shows it.

substitutions:
  - description: |
      Reorder the imports of the renamed executable.
    regex:
      pattern: "    input_image = os.path.join(input_dir, 'chrome.exe')\n    output_image = os.path.join(output_dir, 'chrome.exe')\n"
      replace: "    input_image = os.path.join(input_dir, 'redrob-browser.exe')\n    output_image = os.path.join(output_dir, 'redrob-browser.exe')\n"
  - description: |
      Copy its pdb and friends by the new name.
    regex:
      pattern: "os.path.join(input_dir, 'chrome.exe.*')"
      replace: "os.path.join(input_dir, 'redrob-browser.exe.*')"
