# Load our siso handler, which is what makes a chromium_src override compile in place of an upstream .cc.

substitutions:
  # ---- hunk 0 run 1: 0 removed, 1 added
  - description: |
      The import.
    regex:
      pattern: "load(\"./windows.star\", chromium_windows = \"chromium\")\n"
      replace: "load(\"./windows.star\", chromium_windows = \"chromium\")\nload(\"./redrob_siso_config.star\", \"redrob_siso_config\")\n"
      count: 1
  # ---- hunk 1 run 2: 0 removed, 2 added
  - description: |
      The handler in the config list.
    regex:
      pattern: "    return module("
      replace: "    redrob_siso_config.configure(ctx, step_config, filegroups, handlers)\n\n    return module("
      count: 1
