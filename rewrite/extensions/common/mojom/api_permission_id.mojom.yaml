# The stable numeric id for the redrobPrivate permission. It must exist before chrome_api_permissions.cc can
# map the string "redrobPrivate" to it. Appended after the current last value (kPublicSuffix = 273); the next
# free ordinal is 274. A Chromium uprev that adds its own permissions will push the real next-free number up,
# and this rule's count=1 on the unique `kPublicSuffix = 273,` line will then FAIL rather than silently
# colliding -- which is the signal to renumber, not a bug.
substitutions:
  - description: Add kRedrobPrivate to the extension API permission id enum.
    insert_after:
      anchor: '  kPublicSuffix = 273,'
      count: 1
      lines: |
        kRedrobPrivate = 274,
