# The DECLARE_EXTENSION_FUNCTION macro on RedrobPrivateGetBrowserVersionFunction names
# REDROBPRIVATE_GETBROWSERVERSION, which must be a value in this enum or the C++ does not compile. Appended
# after the current last real value (…= 1980); the next ordinal is 1981. The matching enums.xml entry is
# generated by tools/metrics/histograms/update_extension_histograms.py, not hand-written; a dev build compiles
# without the XML, and the XML is regenerated before any metrics-gated build.
# count=1 on the unique 1980 line fails loudly on an uprev that adds its own functions, which is the cue to
# renumber.
substitutions:
  - description: Add the REDROBPRIVATE_GETBROWSERVERSION histogram enum value.
    insert_after:
      anchor: '  ENTERPRISEREPORTINGPRIVATE_REPORTFORCESAVETOCLOUDEVENTHANDLED = 1980,'
      count: 1
      lines: |
        REDROBPRIVATE_GETBROWSERVERSION = 1981,
        REDROBPRIVATE_SETMEMORYENABLED = 1982,
        REDROBPRIVATE_SETMEMORYRETENTIONDAYS = 1983,
        REDROBPRIVATE_FORGETALLMEMORY = 1984,
        REDROBPRIVATE_REMOVEMEMORY = 1985,
        REDROBPRIVATE_SETMEMORYPINNED = 1986,
        REDROBPRIVATE_REMOVEROUTINE = 1987,
        REDROBPRIVATE_SETROUTINEENABLED = 1988,
        REDROBPRIVATE_REMOVEPROVIDER = 1989,
        REDROBPRIVATE_SELECTPROVIDER = 1990,
        REDROBPRIVATE_GETSETTINGS = 1991,
        REDROBPRIVATE_ADDPROVIDER = 1992,
        REDROBPRIVATE_SETOFFERTOSAVEPASSWORDS = 1993,
        REDROBPRIVATE_SETPASSWORDAUTOSIGNIN = 1994,
        REDROBPRIVATE_SETPASSWORDMANAGERCHOICE = 1995,
        REDROBPRIVATE_SETRPCENABLED = 1996,
        REDROBPRIVATE_CLEARWORKINGFOLDER = 1997,
