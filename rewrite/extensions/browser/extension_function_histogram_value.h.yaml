        REDROBPRIVATE_REMOVEROUTINE = 1991,
        REDROBPRIVATE_SETROUTINEENABLED = 1992,
        REDROBPRIVATE_REMOVEPROVIDER = 1993,
        REDROBPRIVATE_SELECTPROVIDER = 1994,
        REDROBPRIVATE_GETSETTINGS = 1995,
        REDROBPRIVATE_ADDPROVIDER = 1996,
        REDROBPRIVATE_SETOFFERTOSAVEPASSWORDS = 1997,
        REDROBPRIVATE_SETPASSWORDAUTOSIGNIN = 1998,
        REDROBPRIVATE_SETPASSWORDMANAGERCHOICE = 1999,
