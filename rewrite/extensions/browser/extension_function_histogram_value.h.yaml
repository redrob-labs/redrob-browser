# Every DECLARE_EXTENSION_FUNCTION on a redrobPrivate function names a value in this enum, and the C++ does
# not compile without it. They are appended after the current last real value (…= 1980), so they run from
# 1981 upward. The matching enums.xml entries are generated by
# tools/metrics/histograms/update_extension_histograms.py, not hand-written; a dev build compiles without the
# XML, and the XML is regenerated before any metrics-gated build.
# count=1 on the unique 1980 line fails loudly on an uprev that adds its own functions, which is the cue to
# renumber.
#
# ONE rule holds the whole list on purpose. The functions arrived on six stacked branches, each appending to
# this same anchor, and merging them re-emitted the values already on develop: the rule ended up declaring
# some enumerators six times, with different numbers each time, and the compiler rejected it as a
# redefinition. Values are deduped and contiguous here, and check_repo.py now refuses a duplicate name or
# number so a merge cannot reintroduce one quietly.
substitutions:
  - description: Add the redrobPrivate function histogram enum values.
    insert_after:
      anchor: '  // tools/metrics/histograms/update_extension_histograms.py'
      count: 1
      lines: |
        REDROBPRIVATE_GETBROWSERVERSION = 5000,
        REDROBPRIVATE_SETPASSWORDCHOICE = 5001,
        REDROBPRIVATE_SETMODELCHOICE = 5002,
        REDROBPRIVATE_GETIMPORTSOURCES = 5003,
        REDROBPRIVATE_COMPLETEONBOARDING = 5004,
