        REDROBPRIVATE_REMOVEPROVIDER = 5012,
        REDROBPRIVATE_SELECTPROVIDER = 5013,
        REDROBPRIVATE_GETSETTINGS = 5014,
        REDROBPRIVATE_ADDPROVIDER = 5015,
        REDROBPRIVATE_SETOFFERTOSAVEPASSWORDS = 5016,
