# Every DECLARE_EXTENSION_FUNCTION on a redrobPrivate function names a value in this enum, and the C++ does
# not compile without it. They are appended after the current last real value (…= 1980), so they run from
# 1981 upward. The matching enums.xml entries are generated by
# tools/metrics/histograms/update_extension_histograms.py, not hand-written; a dev build compiles without the
# XML, and the XML is regenerated before any metrics-gated build.
# count=1 on the unique 1980 line fails loudly on an uprev that adds its own functions, which is the cue to
# renumber.
#
# ONE rule holds the whole list on purpose. The functions arrived on six stacked branches, each appending to
# this same anchor, and merging them re-emitted the values already on develop: the rule ended up declaring
# some enumerators six times, with different numbers each time, and the compiler rejected it as a
# redefinition. Values are deduped and contiguous here, and check_repo.py now refuses a duplicate name or
# number so a merge cannot reintroduce one quietly.
substitutions:
  - description: Add the redrobPrivate function histogram enum values.
    insert_after:
      anchor: '  ENTERPRISEREPORTINGPRIVATE_REPORTFORCESAVETOCLOUDEVENTHANDLED = 1980,'
      count: 1
      lines: |
        REDROBPRIVATE_GETBROWSERVERSION = 1981,
        REDROBPRIVATE_SETPASSWORDCHOICE = 1982,
        REDROBPRIVATE_SETMODELCHOICE = 1983,
        REDROBPRIVATE_GETIMPORTSOURCES = 1984,
        REDROBPRIVATE_COMPLETEONBOARDING = 1985,
        REDROBPRIVATE_SETMEMORYENABLED = 1986,
        REDROBPRIVATE_SETMEMORYRETENTIONDAYS = 1987,
        REDROBPRIVATE_FORGETALLMEMORY = 1988,
        REDROBPRIVATE_REMOVEMEMORY = 1989,
        REDROBPRIVATE_SETMEMORYPINNED = 1990,
        REDROBPRIVATE_REMOVEROUTINE = 1991,
        REDROBPRIVATE_SETROUTINEENABLED = 1992,
        REDROBPRIVATE_REMOVEPROVIDER = 1993,
        REDROBPRIVATE_SELECTPROVIDER = 1994,
        REDROBPRIVATE_GETSETTINGS = 1995,
        REDROBPRIVATE_ADDPROVIDER = 1996,
        REDROBPRIVATE_SETOFFERTOSAVEPASSWORDS = 1997,
        REDROBPRIVATE_SETPASSWORDAUTOSIGNIN = 1998,
        REDROBPRIVATE_SETPASSWORDMANAGERCHOICE = 1999,
        REDROBPRIVATE_SETRPCENABLED = 2000,
        REDROBPRIVATE_CLEARWORKINGFOLDER = 2001,
        REDROBPRIVATE_ADDROUTINE = 2002,
        REDROBPRIVATE_UPDATEROUTINE = 2003,
        REDROBPRIVATE_RUNROUTINENOW = 2004,
        REDROBPRIVATE_CHOOSEWORKINGFOLDER = 2005,
        REDROBPRIVATE_BEGINPROVIDERSIGNIN = 2006,
        REDROBPRIVATE_OPENPASSWORDMANAGER = 2007,
        REDROBPRIVATE_LISTMODELS = 2008,
        REDROBPRIVATE_LISTTASKS = 2009,
        REDROBPRIVATE_GETTASK = 2010,
        REDROBPRIVATE_CANCELTASK = 2011,
        REDROBPRIVATE_SETPERMISSIONMODE = 2012,
        REDROBPRIVATE_WITHDRAWQUEUEDFOLLOWUP = 2013,
        REDROBPRIVATE_SEARCHWITHDEFAULTPROVIDER = 2014,
        REDROBPRIVATE_STARTTASK = 2015,
        REDROBPRIVATE_SENDFOLLOWUP = 2016,
        REDROBPRIVATE_CHOOSETASKWORKINGFOLDER = 2017,
        REDROBPRIVATE_STARTIMPORT = 2018,
        REDROBPRIVATE_GETENGINEINSTALLSTATE = 2019,
        REDROBPRIVATE_INSTALLENGINE = 2020,
        REDROBPRIVATE_GETENGINECREDENTIAL = 2021,
        // 2022 onward are this branch's. 2021 above arrived from the engine-auth work,
        // which this branch deliberately left a gap for rather than reusing the number:
        // two branches declaring the same enumerator is the failure this file's header
        // describes, and a gap in a histogram enum costs nothing while a collision costs
        // a compile. The gap closed on merge, which is what was supposed to happen.
        REDROBPRIVATE_GETVERTICALTABINSERTIONPOSITION = 2022,
        REDROBPRIVATE_SETVERTICALTABINSERTIONPOSITION = 2023,
        REDROBPRIVATE_GETHORIZONTALTABSHRINKENABLED = 2024,
        REDROBPRIVATE_SETHORIZONTALTABSHRINKENABLED = 2025,
        REDROBPRIVATE_GETWINDOWTRANSLUCENCYENABLED = 2026,
        REDROBPRIVATE_SETWINDOWTRANSLUCENCYENABLED = 2027,
        REDROBPRIVATE_GETAUTOMATICPICTUREINPICTUREENABLED = 2028,
        REDROBPRIVATE_SETAUTOMATICPICTUREINPICTUREENABLED = 2029,
