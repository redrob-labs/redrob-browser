        REDROBPRIVATE_CANCELTASK = 5030,
        REDROBPRIVATE_SETPERMISSIONMODE = 5031,
        REDROBPRIVATE_WITHDRAWQUEUEDFOLLOWUP = 5032,
        REDROBPRIVATE_SEARCHWITHDEFAULTPROVIDER = 5033,
        REDROBPRIVATE_STARTTASK = 5034,
