        REDROBPRIVATE_SETRPCENABLED = 5019,
        REDROBPRIVATE_CLEARWORKINGFOLDER = 5020,
        REDROBPRIVATE_ADDROUTINE = 5021,
        REDROBPRIVATE_UPDATEROUTINE = 5022,
