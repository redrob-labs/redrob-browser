# Vendored avif-decode 3.0.0 (BSD-3-Clause, Kornel Lesiński). Local changes:
# rav1d is built without its assembly on every target.
# Upstream enables rav1d's default `asm` feature on x86/x86_64, which needs
# the `nasm` binary at build time on Linux x64 and Windows MSVC runners.
# Without it rav1d is pure Rust, so all four release targets build with no
# extra system packages. The decoder uses at most 4 threads (src/lib.rs).
# The lodepng-backed CLI binary is dropped.
[package]
edition = "2024"
rust-version = "1.98"
name = "avif-decode"
version = "3.0.0"
authors = ["Kornel <kornel@geekhood.net>"]
description = "Convert AVIF images to PNG or decompressed pixel data"
license = "BSD-3-Clause"
repository = "https://github.com/kornelski/avif-decode"
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "avif_decode"
path = "src/lib.rs"

[dependencies]
avif-parse = "2.1.0"
bytemuck = "1.25"
imgref = "1.12.3"
log = "0.4.34"
quick-error = "2.0.1"
rgb = { version = "0.8.53", default-features = false, features = ["bytemuck"] }
yuv = "0.8.19"
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
