# `Google Chrome` -> `Redrob`, where the long name speaks as the browser itself.
#
# short-name protects `Google Chrome` because most of its uses name Google's browser (the importer's
# "Google Chrome" entry, Family Link's settings). A few strings files use it instead as the browser
# talking about itself -- "Google Chrome is trying to fill your password", "Go to Google Chrome help" --
# and only those files take this preset. It runs BEFORE short-name, so what is left for short-name to
# protect is only the names that are genuinely Google's.

from: Google Chrome
to: Redrob

protect:
  # Google's automation build, which the chromium strings files name in their own <if> branches.
  - Google Chrome for Testing
