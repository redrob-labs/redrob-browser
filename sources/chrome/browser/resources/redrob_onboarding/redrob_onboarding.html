<!doctype html>
<!-- Static light default, overwritten by theme.ts before first paint. See redrob/redrob.html for why the
     attribute cannot be left off once design_system.css is linked. -->
<html dir="$i18n{textdirection}" lang="$i18n{language}" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>$i18n{obWelcomeTitle}</title>
  <link rel="stylesheet" href="design_tokens.css">
  <link rel="stylesheet" href="design_system.css">
  <link rel="stylesheet" href="chrome_base.css">
  <link rel="stylesheet" href="redrob_onboarding.css">
</head>
<body>
  <!-- One step is visible at a time. The dotted field is a background layer rather than a per-step
       element so it does not restart its paint as steps change. -->
  <div id="field" aria-hidden="true"></div>

  <main id="stage">
    <section class="step" data-step="welcome">
      <!-- Two files, one shown, for the reason in redrob.css: 10-logo.md forbids recoloring the
           artwork, so the dark ground gets the flat-white symbol rather than a tinted copy of the
           gradient one. -->
      <div class="art art-mark">
        <img class="mark-light" src="brand/redrob-symbol.png" alt="" aria-hidden="true">
        <img class="mark-dark" src="brand/redrob-symbol-solid-white.png" alt="" aria-hidden="true">
      </div>
      <h1>$i18n{obWelcomeTitle}</h1>
      <p>$i18n{obWelcomeBody}</p>
    </section>

    <section class="step" data-step="account" hidden>
      <div class="art art-account" aria-hidden="true"></div>
      <h1>$i18n{obAccountTitle}</h1>
      <p>$i18n{obAccountBody}</p>
      <!-- An email field and an "I already have an account" button stood here. Neither was read by
           anything: the field's value was collected and discarded, and the button had no handler at all,
           so the step asked for an address and then threw it away. Until there is a real sign-in to hand
           them to, this step says what it is -- a note -- rather than miming a form. The strings stay in
           the dictionary for that flow. -->
    </section>

    <section class="step" data-step="agent" hidden>
      <div class="art art-agent" aria-hidden="true"></div>
      <h1>$i18n{obAgentTitle}</h1>
      <p>$i18n{obAgentBody}</p>
      <!-- A hint here taught Ctrl+Shift+E ("press it anywhere to ask about what you are looking at"), and
           that shortcut does not exist. Nothing binds it: there is no Redrob command id at all, and the
           accelerator table binds VKEY_E only for Ctrl (focus search) and Alt (app menu). The feature is
           designed but unbuilt -- redrob.mojom's StartTask already reserves `context_refs` for exactly this
           ("opaque handles the browser process resolves -- a tab, a selection, a bookmark"), yet the only
           caller passes an empty array and nothing mints a ref. So the first-run flow was teaching a
           keystroke the user would press and see nothing happen, which is worse than not mentioning it.
           The strings stay in the dictionary for when the shortcut is real. -->
    </section>

    <section class="step" data-step="passwords" hidden>
      <div class="art art-passwords" aria-hidden="true"></div>
      <h1>$i18n{obPasswordsTitle}</h1>
      <p>$i18n{obPasswordsBody}</p>
      <div class="choices" role="radiogroup" aria-label="$i18n{obPasswordsGroup}">
        <button class="choice" data-choice="redrob" role="radio" aria-checked="false">
          <strong>$i18n{obPasswordsUseRedrob}</strong>
          <span>$i18n{obPasswordsUseRedrobDetail}</span>
        </button>
        <button class="choice" data-choice="external" role="radio" aria-checked="false">
          <strong>$i18n{obPasswordsExternal}</strong>
          <span>$i18n{obPasswordsExternalDetail}</span>
        </button>
        <button class="choice" data-choice="skip" role="radio" aria-checked="true">
          <strong>$i18n{obPasswordsSkip}</strong>
          <span>$i18n{obPasswordsSkipDetail}</span>
        </button>
      </div>
    </section>

    <section class="step" data-step="model" hidden>
      <div class="art art-model" aria-hidden="true"></div>
      <h1>$i18n{obModelTitle}</h1>
      <p>$i18n{obModelBody}</p>
      <div class="choices" role="radiogroup" aria-label="$i18n{obModelGroup}">
        <button class="choice" data-choice="redrob" role="radio" aria-checked="true">
          <strong>$i18n{obModelRedrob}</strong>
          <span>$i18n{obModelRedrobDetail}</span>
        </button>
        <button class="choice" data-choice="chatgpt" role="radio" aria-checked="false">
          <strong>$i18n{obModelChatgpt}</strong>
          <span>$i18n{obModelChatgptDetail}</span>
        </button>
        <button class="choice" data-choice="claude" role="radio" aria-checked="false">
          <strong>$i18n{obModelClaude}</strong>
          <span>$i18n{obModelClaudeDetail}</span>
        </button>
      </div>
      <!-- A "more providers" button stood here with no handler. The surface it implied is real but it is
           in Settings > Models, and leaving the flow mid-way to reach it would abandon the choices made
           so far. Removed rather than wired: the settings page is one click away once the flow ends. -->
    </section>

    <section class="step" data-step="import" hidden>
      <!-- Two stacked plates: the browser being imported from, and this one under it. The reference
           reads as "moving from there to here", which a single icon cannot say. -->
      <div class="art art-import" aria-hidden="true">
        <div class="plate plate-source"></div>
        <div class="plate plate-target"></div>
      </div>
      <h1 id="import-title">$i18n{obImportTitle}</h1>
      <p id="import-detail">$i18n{obImportBody}</p>
      <div id="import-sources" class="choices" role="radiogroup" aria-label="$i18n{obImportGroup}"></div>
      <p id="import-status" class="status" role="status" hidden></p>
    </section>
  </main>

  <footer id="bar">
    <button id="back" class="quiet">$i18n{obBack}</button>
    <div id="dots" role="tablist" aria-label="$i18n{obProgress}"></div>
    <button id="next" class="primary">$i18n{obContinue}</button>
  </footer>

  <!-- The localized-string dictionary, served by UseStringsJs. Module scripts run in order, so
       this has to come first: the page module reads loadTimeData at import time. -->
  <script type="module" src="strings.m.js"></script>
  <script type="module" src="redrob_onboarding.js"></script>
</body>
</html>
