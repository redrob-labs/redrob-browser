<!doctype html>
<!-- data-theme is set here as well as by theme.ts, and the static value is not redundant. design_system.css
     supersedes three roles behind `:root:not([data-theme="light"])`, which matches a document with NO
     data-theme at all: if theme.ts ever fails to run, the page would render light everywhere except
     --surface-sunken, --ink-muted and the six --series-* -- a half-dark page with nothing reporting it.
     Declaring light here means that selector never matches by accident. theme.ts overwrites the attribute
     before first paint, so a dark OS still gets a dark page with no flash. -->
<html lang="$i18n{language}" dir="$i18n{textdirection}" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redrob</title>
  <!-- Order is load-bearing. design_tokens.css is the vendored design system and defines every token;
       chrome_base.css follows it because it needs those tokens and because its Pretendard rule has to
       win over the vendored static-weight rules; redrob.css consumes both. -->
  <link rel="stylesheet" href="design_tokens.css">
  <link rel="stylesheet" href="design_system.css">
  <link rel="stylesheet" href="chrome_base.css">
  <link rel="stylesheet" href="redrob.css">
</head>
<body>
  <!-- Two views in one document. The new tab shows #home; a task opens at ?task=<id> and shows
       #task. One document because a task tab and a new tab are the same WebUI host, and routing in
       the page costs nothing next to registering a second one. -->
  <main id="home" hidden>
    <!-- Two files, one shown. 10-logo.md forbids recoloring the artwork, so the dark page cannot be
         served by tinting the light file: assets/Symbol/README.md assigns the gradient symbol to light
         grounds and the flat-white one to redrob-black and dark surfaces, and the page swaps them on
         data-theme. Both are in the DOM and redrob.css hides one, which is also how the design
         system's own .rr-mark works. aria-hidden on both: the page's heading already says Redrob, so a
         name here would be read twice. -->
    <span class="mark">
      <img class="mark-light" src="brand/redrob-symbol.png" alt="" aria-hidden="true">
      <img class="mark-dark" src="brand/redrob-symbol-solid-white.png" alt="" aria-hidden="true">
    </span>
    <!-- The card holds the input row ONLY. The controls sit BELOW it on the page, not inside a divided
         card: measured off the reference, the card is 620x44 and the control row is outside its shadow.
         Putting them in one bordered box is what made this read as a form rather than a prompt. -->
    <div class="composer-wrap">
      <form id="composer" class="composer" autocomplete="off">
        <div class="composer-row">
          <input id="prompt" type="text" aria-label="$i18n{newTabPromptLabel}"
                 placeholder="$i18n{newTabPromptPlaceholder}">
          <!-- A real mode toggle: both segments only SELECT, and the form's submit is the one thing that acts.
               Before this, `Search` performed a search the instant it was clicked and `Ask AI` was the form's
               submit button, while `seg-on` was a static class in this file that nothing ever moved. Three
               consequences, all of which a user hit immediately: the control permanently claimed Ask AI was
               the selected mode, clicking `Search` with an empty field did nothing whatsoever and gave no
               feedback, and the keyboard was governed by neither segment -- Enter always filed a task. -->
          <div class="segmented" role="group" aria-label="$i18n{newTabModeGroup}">
            <button type="button" id="mode-search" class="seg"
                    aria-pressed="false">$i18n{newTabModeSearch}</button>
            <button type="button" id="mode-ask" class="seg seg-on"
                    aria-pressed="true">$i18n{newTabModeAsk}</button>
          </div>
          <!-- Implicit submission needs a submit control in the form. Both segments are plain buttons now, so
               without this Enter would do nothing -- and Enter is how this field is actually used. Absolutely
               positioned by .visually-hidden, so it takes no room in the row's flex. -->
          <button type="submit" class="visually-hidden" tabindex="-1" aria-hidden="true"></button>
        </div>
      </form>
      <div class="composer-controls">
        <!-- A "+" add-context button stood here, and twice more in the task composer: three copies, none
             wired to anything, because the `@` context picker they belong to is not built. Every click was
             swallowed. Deleted rather than hidden -- git holds the markup, and a hidden control that is
             meant to come back is how dead markup survives a cleanup. It returns with the picker. -->
        <!-- One control showing the mode in force, not three segments competing for the eye. The
             narrow-by-default decision is unchanged; what changed is that the two modes you are NOT in
             no longer take up as much room as the one you are. -->
        <label class="ctl ctl-select">
          <svg data-icon="shieldCheck" aria-hidden="true"></svg>
          <span class="visually-hidden">$i18n{newTabPermissionMode}</span>
          <span class="ctl-value"></span>
          <svg class="ctl-caret" data-icon="chevronDown" aria-hidden="true"></svg>
          <select id="mode" data-mode-select>
            <option value="read">$i18n{newTabPermissionRead}</option>
            <option value="guard" selected>$i18n{newTabPermissionGuard}</option>
            <option value="full">$i18n{newTabPermissionFull}</option>
          </select>
        </label>
        <span class="spacer"></span>
        <label class="ctl ctl-select">
          <span class="visually-hidden">$i18n{newTabModel}</span>
          <span class="ctl-value"></span>
          <svg class="ctl-caret" data-icon="chevronDown" aria-hidden="true"></svg>
          <select id="model">
            <option value="auto" selected>redrob/auto</option>
          </select>
        </label>
        <label class="ctl ctl-select">
          <span class="visually-hidden">$i18n{newTabEffort}</span>
          <span class="ctl-value"></span>
          <svg class="ctl-caret" data-icon="chevronDown" aria-hidden="true"></svg>
          <select id="effort">
            <option value="ultra">$i18n{newTabEffortUltra}</option>
            <option value="standard" selected>$i18n{newTabEffortStandard}</option>
            <option value="quick">$i18n{newTabEffortQuick}</option>
          </select>
        </label>
      </div>
    </div>

    <!-- Suggested tiles answer an EMPTY state. Once there are recent tasks the empty state is over, so
         the tiles are hidden rather than stacked above real work -- three invented prompts should never
         outrank three things you actually ran. -->
    <section id="suggested" class="suggested" aria-labelledby="suggested-heading">
      <h2 id="suggested-heading">$i18n{newTabSuggested}</h2>
      <div class="tiles">
        <button type="button" class="tile" data-prompt="$i18n{newTabTileReadPrompt}">
          <span class="tile-kind">$i18n{newTabTileKindRead}</span>
          <span class="tile-title">$i18n{newTabTileReadTitle}</span>
          <span class="tile-detail">$i18n{newTabTileReadDetail}</span>
        </button>
        <button type="button" class="tile" data-prompt="$i18n{newTabTileComparePrompt}">
          <span class="tile-kind">$i18n{newTabTileKindCompare}</span>
          <span class="tile-title">$i18n{newTabTileCompareTitle}</span>
          <span class="tile-detail">$i18n{newTabTileCompareDetail}</span>
        </button>
        <button type="button" class="tile" data-prompt="$i18n{newTabTileActPrompt}">
          <span class="tile-kind">$i18n{newTabTileKindAct}</span>
          <span class="tile-title">$i18n{newTabTileActTitle}</span>
          <span class="tile-detail">$i18n{newTabTileActDetail}</span>
        </button>
      </div>
    </section>

    <section id="recent" class="recent" aria-labelledby="recent-heading" hidden>
      <h2 id="recent-heading">$i18n{newTabRecent}</h2>
      <ol id="cards" class="cards"></ol>
    </section>
    <p id="home-status" role="status"></p>
  </main>

  <main id="task" hidden>
    <header class="task-head">
      <!-- The only route out of a task used to be the browser's own Back, which is not an affordance on
           the page and does not exist at all when the task tab was opened fresh from the command line.
           A real anchor rather than a scripted button: it is a navigation, so middle-click and
           open-in-new-tab work, and it still works if the page's module fails to load. -->
      <a class="task-back" href="chrome://redrob/" aria-label="$i18n{taskBackHome}"
         title="$i18n{taskBackHome}">
        <svg data-icon="chevronLeft" aria-hidden="true"></svg>
      </a>
      <h1 id="task-title"></h1>
      <span id="task-state" class="task-state"></span>
      <span class="spacer"></span>
      <span id="task-effort" class="task-effort"></span>
      <button type="button" id="task-stop" class="pill pill-quiet" hidden>$i18n{taskStop}</button>
    </header>
    <div class="task-body">
      <!-- Three children, each owning what it draws, so an update can touch only what changed. The whole
           article used to be aria-live and was cleared and rebuilt on every push from the browser, so a
           screen reader re-announced the entire history each time a step arrived and anything focused
           inside it was destroyed. The announcement now lives in #announce below and says only what is
           new. -->
      <article id="trace" class="trace">
        <div id="narration"></div>
        <div id="steps"></div>
        <p id="trace-error" class="task-error" hidden></p>
        <!-- The one place in this product with a genuinely empty SURFACE rather than an empty list, so it
             gets the full shape: what happened, what it means, and the way out. A list that is merely
             empty keeps its one-line note instead -- the section around it already has a heading and a
             lede, and a centred block there would repeat both. -->
        <div id="trace-empty" class="empty-block" hidden>
          <svg data-icon="alert" aria-hidden="true"></svg>
          <p class="empty-title" id="trace-empty-title"></p>
          <p class="empty-detail">$i18n{taskNotFoundDetail}</p>
          <a class="pill pill-solid" href="chrome://redrob/">$i18n{taskBackHomeLabel}</a>
        </div>
      </article>
      <aside id="preview" class="preview" hidden>
        <div class="preview-head">
          <span id="preview-title"></span>
          <button type="button" id="preview-close" aria-label="$i18n{taskClosePreview}">&times;</button>
        </div>
        <img id="preview-image" alt="">
      </aside>
    </div>
    <form id="reply" class="composer composer-foot" autocomplete="off">
      <ol id="queued" class="queued" hidden></ol>
      <div class="composer-row">
        <input id="reply-prompt" type="text" aria-label="$i18n{taskReplyLabel}"
               placeholder="$i18n{taskReplyPlaceholder}">
        <!-- Two buttons while it runs, not one. Enter queues, because throwing away work in progress
             should be something you ask for by name rather than something Enter might mean. -->
        <button type="button" id="reply-steer" class="pill pill-quiet" hidden>$i18n{taskSteerNow}</button>
        <button type="submit" id="reply-send" class="send" aria-label="$i18n{taskSendReply}"></button>
      </div>
      <div class="composer-controls">
        <label class="ctl ctl-select">
          <svg data-icon="shieldCheck" aria-hidden="true"></svg>
          <span class="visually-hidden">$i18n{newTabPermissionMode}</span>
          <span class="ctl-value"></span>
          <svg class="ctl-caret" data-icon="chevronDown" aria-hidden="true"></svg>
          <select data-mode-select>
            <option value="read">$i18n{newTabPermissionRead}</option>
            <option value="guard" selected>$i18n{newTabPermissionGuard}</option>
            <option value="full">$i18n{newTabPermissionFull}</option>
          </select>
        </label>
        <button type="button" class="ctl" id="pick-folder">$i18n{taskChooseFolder}</button>
        <span class="spacer"></span>
        <span class="ctl ctl-static" id="reply-model"></span>
      </div>
      <p id="task-status" class="task-status" role="status"></p>
    </form>
    <!-- What a screen reader hears when the task moves: the newest step, or the new state. One short
         sentence per change rather than the whole trace re-read, which is what a live region on the log
         itself produced. Visually hidden because the trace already shows all of this on screen. -->
    <p id="announce" class="visually-hidden" aria-live="polite"></p>
  </main>

  <!-- The localized-string dictionary, served by UseStringsJs. Module scripts run in order, so
       this has to come first: the page module reads loadTimeData at import time. -->
  <script type="module" src="strings.m.js"></script>
  <script type="module" src="redrob.js"></script>
</body>
</html>
