<!doctype html>
<html lang="en" data-theme="redrob">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/redrob-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redrob in Browser</title>
    <!--
      No web-font CDN. The design system's own tokens.css declares every face it
      needs, and scripts/build.mjs copies those files next to it -- which it did not
      do before, so the faces 404'd and this link was covering for a missing build
      step rather than adding a font.
    -->
    <script src="/debug-chrome.js"></script>
    <script type="module" crossorigin src="/assets/sidepanel.js"></script>
    <!-- The design system, taken from @redrob-labs/ui — tokens then preflight
         then the component sheet, the order the library documents. Before the
         panel's own sheet, so redrob.css can still override where the panel
         genuinely differs. -->
    <link rel="stylesheet" href="/assets/redrob-ui/tokens.css" />
    <link rel="stylesheet" href="/assets/redrob-ui/preflight.css" />
    <link rel="stylesheet" href="/assets/redrob-ui/styles.css" />
    <link rel="stylesheet" href="/assets/redrob.css" />
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
