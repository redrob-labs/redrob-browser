[package]
name = "redrob-scene-raster"
description = "CPU rasterizer for redrob-scene frames (agent screenshots that match the window)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
redrob-scene = { workspace = true }
vello_cpu = { version = "0.3", default-features = false, features = ["std", "png", "text", "u8_pipeline"] }
# Same version vello_cpu uses; only for FontEmbolden (synthetic bold).
glifo = { version = "0.4", default-features = false }
# Same version glifo uses; reads unitsPerEm for the embolden amount.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
# LCD glyph masks, rasterized as the engine's CPU paint does.
swash = { version = "=0.2.0", default-features = false, features = ["std", "scale", "render"] }
