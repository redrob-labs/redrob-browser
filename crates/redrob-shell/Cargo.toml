[package]
name = "redrob-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Redrob Browser window: draws pages from the engine and sends it the user's input"

[[bin]]
name = "redrob-browser-window"
path = "src/main.rs"

[dependencies]
eframe = "0.36"
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = "0.3"
serde_json = { workspace = true }
base64 = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
anyhow = { workspace = true }
rusqlite = { version = "0.37", features = ["bundled"] }
aes-gcm = "0.10"
keyring = "4"
zeroize = "1"
getrandom = "0.3"
pbkdf2 = "0.12"
sha1 = "0.10"
cbc = "0.1"
aes = "0.8"
sha2 = "0.10"
ureq = { version = "2.9", features = ["json"] }
url = { workspace = true }
open = "5"
# Chromium in every window tab (docs/CEF.md). The binaries come from CEF_PATH.
# accelerated_osr: pages arrive as GPU textures (dmabuf, IOSurface, D3D11).
cef = { version = "=156.3.0", default-features = false, features = ["accelerated_osr", "sandbox"] }

[target.'cfg(target_os = "linux")'.dependencies]
# fcitx5 over D-Bus, so text composes in place on X11 (ime.rs). zbus is
# already in the build (accesskit); blocking calls only.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
serde = "1"

[target.'cfg(unix)'.dependencies]
# SIGTERM and SIGINT handlers in place of Chromium's (cef/mod.rs).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Start-up on Windows (startup.rs: the log file, the message box) and the
# setup's language (i18n.rs).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
